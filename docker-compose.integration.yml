services:
  sapbo:
    build:
      context: ./docker/sapbo-mock
    image: atom-sapbo-mock:latest
    container_name: atom-sapbo-integration
    environment:
      SAPBO_MOCK_USER: "administrator"
      SAPBO_MOCK_PASSWORD: "Password1"
    ports:
      - "18443:8443"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import ssl, urllib.request; ctx=ssl._create_unverified_context(); urllib.request.urlopen('https://127.0.0.1:8443/health', timeout=2, context=ctx).read()
      interval: 5s
      timeout: 3s
      retries: 20

  sapds:
    build:
      context: ./docker/sapds-mock
    image: atom-sapds-mock:latest
    container_name: atom-sapds-integration
    environment:
      SAPDS_MOCK_USER: "administrator"
      SAPDS_MOCK_PASSWORD: "Password1"
    ports:
      - "18444:8444"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import ssl, urllib.request; ctx=ssl._create_unverified_context(); urllib.request.urlopen('https://127.0.0.1:8444/health', timeout=2, context=ctx).read()
      interval: 5s
      timeout: 3s
      retries: 20

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: atom-sqlserver-integration
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Atom_Test_12345!"
    ports:
      - "14333:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          timeout 1 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  oracle:
    image: gvenzl/oracle-free:23
    container_name: atom-oracle-integration
    environment:
      ORACLE_PASSWORD: "Oracle_Test_12345"
      APP_USER: "e2e_src"
      APP_USER_PASSWORD: "Oracle_Test_12345"
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: atom-minio-integration
    command: server /data
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    ports:
      # 29000, not 19000: on some hosts Windows/Hyper-V reserves the
      # 18979-19078 dynamic port range, which blocks docker from binding it.
      - "29000:9000"
    # No healthcheck: the official image is distroless (no shell/curl to run a
    # CMD healthcheck with). global-setup.ts's seedMinio() (a later task) does
    # its own retry-with-backoff wait for the API to accept requests before
    # seeding.

  sftp:
    image: atmoz/sftp:latest
    container_name: atom-sftp-integration
    volumes:
      - ./tests/e2e/fixtures/data/sftp_seed/target:/home/e2euser/upload
    command: ["e2euser:e2epass:1001:::upload"]
    ports:
      - "12222:22"
    # No healthcheck: this minimal Alpine image has no bash (so no /dev/tcp
    # trick) and no netcat. The new live e2e spec's own paramiko connection
    # attempt (a later task) retries, which is a sufficient readiness gate
    # here -- unlike MinIO, there's no seed *script* to gate a real readiness
    # check on for this service.

  localstack:
    # Pinned to the last community line: from the 2026.x images onward,
    # localstack/localstack:latest exits at boot with "License activation failed"
    # unless LOCALSTACK_AUTH_TOKEN holds a valid pro key, which broke
    # `docker compose up --wait` (and therefore tests/e2e/global-setup.ts) for
    # everyone without a licence. 3.8.1 starts s3/glue/athena as before.
    image: localstack/localstack:3
    container_name: atom-localstack-integration
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,glue,athena
      - AWS_DEFAULT_REGION=us-east-1
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}

  airflow:
    # Single-container "standalone-ish" Airflow: SequentialExecutor + its default
    # sqlite metadata DB (no Postgres/MySQL sidecar needed for a throwaway e2e
    # container). `airflow users create` gives us the deterministic admin/admin
    # credentials AwsAirflowRuntime._standalone_client's basic auth expects --
    # the built-in `airflow standalone` CLI command instead generates a random
    # password per boot, which would defeat a fixed e2e Config.
    image: apache/airflow:2.9.3-python3.11
    container_name: atom-airflow-integration
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # A newly-parsed DAG defaults to paused, and Airflow's scheduler will
      # NOT queue tasks for a run on a paused DAG even when that run was
      # created by an explicit manual trigger (confirmed empirically: a
      # triggered run on a paused DAG sits at state=queued with
      # last_scheduling_decision=null forever; unpausing immediately lets
      # the same run proceed to running/success). Since this container's
      # only DAG exists purely to be triggered by e2e tests, default it
      # (and any future DAG dropped into the seed folder) to unpaused.
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # Scan the dags folder every 5s (default 30s) so the seeded DAG is
      # visible via the REST API well within a healthcheck-based wait.
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "5"
      # Default REST API auth backend is airflow.api.auth.backend.session,
      # which only accepts a browser session cookie -- any request with plain
      # HTTP Basic Auth (which is all AirflowRestClient/_standalone_client
      # ever sends) gets a 403 regardless of whether the credentials are
      # correct. basic_auth is the backend that actually checks username/password.
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    volumes:
      - ./docker/airflow-seed/dags:/opt/airflow/dags
    ports:
      - "18085:8080"
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        (airflow users create --username admin --password admin --firstname E2E --lastname Admin --role Admin --email admin@example.com || true) &&
        (airflow scheduler &) &&
        exec airflow webserver --port 8080
    healthcheck:
      # /health always returns HTTP 200 with a per-component JSON body -- it
      # does NOT turn non-200 when a component is down, so a plain "did the
      # request succeed" check (this file's usual sapbo/sapds pattern) would
      # report this container healthy even if the backgrounded `airflow
      # scheduler &` process (started fire-and-forget by `command:` above,
      # never itself supervised) died right after launch. Parse the body and
      # require the scheduler component specifically to be healthy.
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          body = json.loads(urllib.request.urlopen('http://localhost:8080/health', timeout=3).read());
          exit(0 if body.get('scheduler', {}).get('status') == 'healthy' and body.get('metadatabase', {}).get('status') == 'healthy' else 1)
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 40s

  gitlab:
    build:
      context: ./docker/gitlab-mock
    image: atom-gitlab-mock:latest
    container_name: atom-gitlab-integration
    ports:
      - "18080:18080"

