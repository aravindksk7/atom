<template x-if="currentView === 'monitor'"><div>
  <div class="section-header">
    <div>
      <div class="section-title">Execution Monitor</div>
      <div class="section-sub">Live progress of running and recent tests</div>
    </div>
    <div class="flex items-center gap-2 text-muted">
      <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
      SSE stream with 5s fallback
    </div>
  </div>

  <template x-if="activeRuns.length === 0">
    <div class="card empty-state">
      <div class="empty-state-icon">📡</div>
      <div class="empty-state-title">No active runs</div>
      <div class="empty-state-sub">
        <button @click="currentView='jobs'" data-testid="monitor-launch-link" class="text-indigo-500 hover:underline">Launch a test →</button>
      </div>
    </div>
  </template>

  <div class="space-y-4">
    <template x-for="run in activeRuns" :key="run.run_id">
      <div class="card" :data-testid="'monitor-run-' + run.run_id" x-init="loadRunTiming(run.run_id)">
        <div class="flex items-start justify-between mb-4">
          <div>
            <div class="flex flex-wrap items-center gap-2">
              <span class="font-semibold text-sm" data-testid="monitor-run-name" x-text="run.target_name || runLabel(run)"></span>
              <span class="font-mono text-sm text-slate-400" x-show="run.target_name" x-text="run.run_id.substring(0,8)+'…'"></span>
              <span class="badge" :class="statusBadgeClass(run.status)" :data-testid="'monitor-run-status-' + run.run_id" x-text="run.status"></span>
            </div>
            <div class="text-muted mt-1">
              <span x-text="run.source_env||'?'"></span> → <span x-text="run.target_env||'?'"></span>
              <!-- Runs with step timing show Started and Ended in the summary below. -->
              <span class="ml-2" x-show="!runTimings[run.run_id] || !runTimings[run.run_id].steps.length"
                    x-text="run.started_at ? 'Started ' + fmtDate(run.started_at) : 'Pending…'"></span>
            </div>
            <template x-if="run._progress && run._progress.current_job">
              <div class="text-muted mt-1 text-xs">
                Running: <span class="font-mono text-indigo-600" x-text="run._progress.current_job"></span>
              </div>
            </template>
          </div>
          <div class="text-right space-y-2">
            <div class="text-2xl font-bold text-slate-700" x-text="run.total_tests"></div>
            <div class="text-muted">tests</div>
            <button @click="cancelRun(run.run_id)"
                    x-show="!isTerminalStatus(run.status)"
                    :disabled="cancellingRuns[run.run_id] || run.cancel_requested"
                    :data-testid="'monitor-cancel-btn-' + run.run_id"
                    class="btn-danger btn-sm text-xs disabled:opacity-50"
                    x-text="run.cancel_requested ? 'Cancel requested' : (cancellingRuns[run.run_id] ? 'Cancelling...' : 'Cancel')"></button>
          </div>
        </div>

        <!-- Runs with steps get per-job progress; others keep the single bar. -->
        <template x-if="!runTimings[run.run_id] || !runTimings[run.run_id].steps.length">
          <div class="progress-track mb-4">
            <div class="progress-fill" :style="'width:' + runProgress(run) + '%'"></div>
          </div>
        </template>
        <template x-for="timing in [runTimings[run.run_id]].filter((t) => t && t.steps.length)" :key="run.run_id">
          <div class="mb-4" data-testid="run-timing">
            <div class="rt-summary">
              <div class="text-xs text-muted">
                <span>Started </span><span data-testid="run-started" x-text="fmtDate(timing.started_at)"></span>
                <span> · Ended </span><span data-testid="run-ended" x-text="fmtDate(timing.completed_at)"></span>
                <span x-show="timing.held_seconds > 0" x-text="' · Held ' + fmtSeconds(timing.held_seconds)"></span>
              </div>
              <div class="text-right">
                <div class="rt-elapsed" data-testid="run-elapsed" x-text="fmtSeconds(timing.elapsed_seconds)"></div>
                <div class="text-xs text-muted" x-text="timing.jobs_done + ' of ' + timing.jobs_total + ' jobs done'"></div>
              </div>
            </div>
            <div class="rt-tabs" role="tablist" aria-label="Run timing views">
              <button type="button" role="tab" class="rt-tab" :class="runTimingTab(run) === 'progress' && 'is-on'"
                      :aria-selected="runTimingTab(run) === 'progress'" @click="setRunTimingTab(run.run_id, 'progress')"
                      data-testid="run-tab-progress">Progress</button>
              <button type="button" role="tab" class="rt-tab" :class="runTimingTab(run) === 'timeline' && 'is-on'"
                      :aria-selected="runTimingTab(run) === 'timeline'" @click="setRunTimingTab(run.run_id, 'timeline')"
                      data-testid="run-tab-timeline">Timeline</button>
            </div>
            <div x-show="runTimingTab(run) === 'progress'" data-testid="run-progress-rows">
              <template x-for="step in timing.steps" :key="step.step_index">
                <div class="rt-progress-row" :data-testid="'monitor-step-' + (step.step_id || step.step_index)">
                  <div class="rt-job-name">
                    <span class="rt-job-title" x-text="step.job_name"></span>
                    <span class="rt-job-sub" x-text="step.job_type || 'unknown'"></span>
                  </div>
                  <div class="rt-bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="100"
                       :aria-valuenow="step.progress.percent === null ? null : step.progress.percent"
                       :aria-label="step.job_name + ': ' + step.progress.label">
                    <template x-if="step.progress.state !== 'queued' && step.progress.state !== 'not_run'">
                      <div class="rt-bar-fill" :class="progressBarClass(step)" :style="'width:' + progressBarWidth(step)"
                           x-text="step.progress.percent === null ? '' : step.progress.label"></div>
                    </template>
                  </div>
                  <div class="rt-runtime" x-text="runtimeText(step)"></div>
                  <template x-if="step.progress.state === 'held'">
                    <button @click="openStepRelease(run.run_id, step.step_index)" class="btn-primary btn-sm text-xs py-1 px-3">Release</button>
                  </template>
                </div>
              </template>
            </div>
            <div x-show="runTimingTab(run) === 'timeline'">
              <!-- SHARED: shared/run-gantt.html -->
            </div>
          </div>
        </template>

        <!-- Stat mini-cards -->
        <div class="grid-stat">
          <div class="stat-card stat-emerald">
            <div class="stat-card-label">Passed</div>
            <div class="stat-card-value" x-text="run.passed"></div>
          </div>
          <div class="stat-card stat-rose">
            <div class="stat-card-label">Failed</div>
            <div class="stat-card-value" x-text="run.failed"></div>
          </div>
          <div class="stat-card stat-amber">
            <div class="stat-card-label">Slow</div>
            <div class="stat-card-value" x-text="run.slow"></div>
          </div>
          <div class="stat-card stat-indigo">
            <div class="stat-card-label">Error</div>
            <div class="stat-card-value" x-text="run.error"></div>
          </div>
        </div>


        <!-- HELD alert -->
        <template x-if="heldStepIndex(run) != null">
          <div class="mt-3 flex items-center gap-3 p-3 rounded-lg bg-amber-50 border border-amber-200">
            <span class="text-amber-600 font-semibold text-sm">⏸ Sequence held at step <span x-text="(heldStepIndex(run) + 1)"></span></span>
          </div>
        </template>
      </div>
    </template>
  </div>

  <!-- Step Release Modal -->
  <div x-show="stepReleaseModal.show" x-cloak class="modal-backdrop" @click.self="stepReleaseModal.show = false">
    <div x-ref="stepReleaseDialog" class="modal-box w-full max-w-md" role="dialog" aria-modal="true" aria-labelledby="stepReleaseDialogTitle">
      <h2 id="stepReleaseDialogTitle" class="text-lg font-bold mb-4">Release Held Step</h2>
      <div class="space-y-3">
        <div>
          <label  class="field-label" for="a11y-config-action-approve-and-continue-skip-and-continue-cancel-run-your-name">Action *</label>
          <div class="flex gap-3 mt-1">
            <label class="flex items-center gap-1 text-sm cursor-pointer">
              <input type="radio" x-model="stepReleaseModal.action" value="approve" aria-label="stepreleasemodal action" /> Approve &amp; continue
            </label>
            <label class="flex items-center gap-1 text-sm cursor-pointer">
              <input type="radio" x-model="stepReleaseModal.action" value="skip" aria-label="stepreleasemodal action" /> Skip &amp; continue
            </label>
            <label class="flex items-center gap-1 text-sm cursor-pointer">
              <input type="radio" x-model="stepReleaseModal.action" value="cancel" aria-label="stepreleasemodal action" /> Cancel run
            </label>
          </div>
        </div>
        <div><label class="field-label">Your name *</label><input x-model="stepReleaseModal.releasedBy" class="field-input" placeholder="Alice" id="a11y-config-action-approve-and-continue-skip-and-continue-cancel-run-your-name" /></div>
        <div><label  class="field-label" for="a11y-config-note">Note *</label><textarea x-model="stepReleaseModal.note" class="field-input" rows="2" placeholder="Verified data looks correct…" id="a11y-config-note"></textarea></div>
      </div>
      <div class="flex justify-end gap-3 mt-6">
        <button @click="stepReleaseModal.show = false" class="btn-secondary">Cancel</button>
        <button @click="submitStepRelease()" :disabled="!stepReleaseModal.note.trim() || !stepReleaseModal.releasedBy.trim()" class="btn-primary">Release</button>
      </div>
    </div>
  </div>
</div></template>
