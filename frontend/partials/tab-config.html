<template x-if="currentView === 'config'"><div>
  <div class="section-header">
    <div>
      <div class="section-title">Configuration Editor</div>
      <div class="section-sub">Manage environment credentials and settings</div>
    </div>
    <button @click="openNewConfigModal()" class="btn-primary" data-testid="config-new-btn">+ New Config</button>
  </div>

  <template x-if="configs.length === 0">
    <div class="card empty-state">
      <div class="empty-state-icon">🔧</div>
      <div class="empty-state-title">No configurations yet</div>
      <div class="empty-state-sub">Click "New Config" to define an environment</div>
    </div>
  </template>

  <div class="grid gap-3">
    <template x-for="cfg in configs" :key="cfg.id">
      <div class="card flex items-center justify-between gap-4" :data-testid="'config-row-' + cfg.id">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-9 h-9 rounded-lg flex items-center justify-center text-lg flex-shrink-0"
               style="background:#ede9fe">🗃️</div>
          <div class="min-w-0">
            <div class="font-semibold text-slate-800 truncate" x-text="cfg.name"></div>
            <div class="flex items-center gap-2 mt-0.5">
              <span class="badge badge-blue" x-text="cfg.env_name"></span>
              <span class="text-muted" x-text="'Updated ' + fmtDate(cfg.updated_at)"></span>
            </div>
          </div>
        </div>
        <div class="flex gap-2 flex-shrink-0">
          <button @click="editConfig(cfg)" class="btn-secondary btn-sm" :data-testid="'config-row-' + cfg.id + '-edit-btn'">Edit</button>
          <button @click="deleteConfig(cfg.id)" class="btn-danger btn-sm" :data-testid="'config-row-' + cfg.id + '-delete-btn'">Delete</button>
          <button @click="openSchemaExplorer(cfg)" class="btn-secondary btn-sm"
                  :class="schemaExplorerId === cfg.id ? 'ring-2 ring-indigo-400' : ''">
            Browse Schema <span x-text="schemaExplorerId === cfg.id ? '▲' : '▼'"></span>
          </button>
        </div>
      </div>
    </template>
  </div>

  <!-- Schema Explorer Panel -->
  <template x-if="schemaExplorerId !== null">
    <div class="card mt-3">
      <div class="flex items-center justify-between mb-3">
        <div class="font-semibold text-slate-700">
          Schema Explorer —
          <span x-text="configs.find(c => c.id === schemaExplorerId)?.name ?? ''"></span>
        </div>
        <button @click="closeSchemaExplorer()" class="text-muted hover:text-slate-700 text-sm">✕ Close</button>
      </div>

      <div x-show="schemaExplorerLoading" class="text-muted text-sm">Loading schema…</div>

      <template x-if="!schemaExplorerLoading && schemaExplorerData.length === 0">
        <div class="text-muted text-sm">No tables found or connection failed.</div>
      </template>

      <template x-if="!schemaExplorerLoading && schemaExplorerData.length > 0">
        <div>
          <template x-for="schemaGroup in [...new Set(schemaExplorerData.map(t => t.schema))]" :key="schemaGroup">
            <div class="mb-2">
              <button @click="toggleSchemaGroup(schemaGroup)"
                      class="flex items-center gap-1 text-sm font-semibold text-slate-700 hover:text-indigo-600 w-full text-left">
                <span x-text="schemaExpandedSchemas[schemaGroup] ? '▼' : '▶'"></span>
                <span x-text="schemaGroup"></span>
                <span class="text-muted font-normal ml-1"
                      x-text="'(' + schemaExplorerData.filter(t => t.schema === schemaGroup).length + ' tables)'"></span>
              </button>
              <template x-if="schemaExpandedSchemas[schemaGroup]">
                <div class="ml-4 mt-1 space-y-1">
                  <template x-for="tbl in schemaExplorerData.filter(t => t.schema === schemaGroup)" :key="tbl.schema + '.' + tbl.table">
                    <div>
                      <div class="flex items-center gap-2 py-0.5">
                        <button @click="toggleSchemaTable(tbl.schema + '.' + tbl.table)"
                                class="text-xs text-slate-600 hover:text-indigo-600 font-mono">
                          <span x-text="schemaExpandedTables[tbl.schema + '.' + tbl.table] ? '▼' : '▶'"></span>
                          <span x-text="tbl.table"></span>
                        </button>
                        <button @click="previewSchemaTable(schemaExplorerId, tbl.schema, tbl.table)"
                                class="btn-secondary btn-sm text-xs">▶ Preview</button>
                        <button @click="useTableInJob(tbl.schema, tbl.table)"
                                class="btn-secondary btn-sm text-xs">Use in Job</button>
                      </div>
                      <template x-if="schemaExpandedTables[tbl.schema + '.' + tbl.table]">
                        <div class="ml-6 text-xs text-muted font-mono flex flex-wrap gap-x-3 mt-0.5">
                          <template x-for="col in tbl.columns" :key="col.name">
                            <span><span x-text="col.name"></span> <span class="text-slate-400" x-text="'(' + col.type + ')'"></span></span>
                          </template>
                        </div>
                      </template>
                      <template x-if="schemaTablePreviews[tbl.schema + '.' + tbl.table]">
                        <div class="mt-1 ml-4">
                          <template x-if="schemaTablePreviews[tbl.schema + '.' + tbl.table] === 'loading'">
                            <div class="text-xs text-muted">Loading preview…</div>
                          </template>
                          <template x-if="typeof schemaTablePreviews[tbl.schema + '.' + tbl.table] === 'string' && schemaTablePreviews[tbl.schema + '.' + tbl.table].startsWith('error:')">
                            <div class="text-xs text-red-500" x-text="schemaTablePreviews[tbl.schema + '.' + tbl.table].replace('error:', '')"></div>
                          </template>
                          <template x-if="schemaTablePreviews[tbl.schema + '.' + tbl.table] && typeof schemaTablePreviews[tbl.schema + '.' + tbl.table] === 'object'">
                            <div class="overflow-x-auto border rounded" style="max-height:200px;overflow-y:auto">
                              <table class="data-table text-xs" aria-label="config table 1">
                                <thead>
                                  <tr>
                                    <template x-for="col in schemaTablePreviews[tbl.schema + '.' + tbl.table].columns" :key="col">
                                      <th x-text="col" scope="col"></th>
                                    </template>
                                  </tr>
                                </thead>
                                <tbody>
                                  <template x-for="(row, ri) in schemaTablePreviews[tbl.schema + '.' + tbl.table].rows" :key="ri">
                                    <tr>
                                      <template x-for="(cell, ci) in row" :key="ci">
                                        <td x-text="cell ?? '—'"></td>
                                      </template>
                                    </tr>
                                  </template>
                                </tbody>
                              </table>
                            </div>
                          </template>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>

  <!-- YAML Import card -->
  <div class="card mt-4">
    <button type="button" class="card-toggle" @click="yamlImportOpen = !yamlImportOpen" :aria-expanded="yamlImportOpen.toString()">
      <div class="font-semibold text-slate-700">Import YAML</div>
      <span class="text-muted text-sm" x-text="yamlImportOpen ? '▲ collapse' : '▼ expand'"></span>
    </button>
    <template x-if="yamlImportOpen">
      <div class="mt-3 space-y-3">
        <p class="text-muted text-sm">Paste a YAML block defining one or more named environments. Each top-level key becomes a saved config.</p>
        <textarea x-model="yamlImportText" rows="8" class="field-input font-mono text-xs" placeholder="dev:&#10;  db_host: sql-dev.internal&#10;  db_port: 1433&#10;  bo_url: http://bo-dev:6405" data-testid="config-yaml-textarea" aria-label="dev 10 db host sql dev internal 10 db port 1433 10 bo url http bo dev 6405"></textarea>
        <div class="flex justify-end">
          <button :disabled="!yamlImportText.trim() || yamlImporting" class="btn-primary" @click="importYaml()" data-testid="config-yaml-import-btn">
            <span x-show="!yamlImporting">Import</span>
            <span x-show="yamlImporting">Importing…</span>
          </button>
        </div>
      </div>
    </template>
  </div>

  <!-- Security – API Tokens -->
  <div class="card mt-4">
    <button type="button" class="card-toggle" data-testid="security-card-header" @click="securityOpen = !securityOpen; if(securityOpen) loadTokens()" :aria-expanded="securityOpen.toString()">
      <div class="font-semibold text-slate-700">🔑 Security — Users &amp; API Access</div>
      <span class="text-muted text-sm" x-text="securityOpen ? '▲ collapse' : '▼ expand'"></span>
    </button>
    <template x-if="securityOpen">
      <div class="mt-3 space-y-3">
        <p class="text-muted text-sm">Each user receives a personal bearer token. Administrators can create and revoke standard-user or administrator access.</p>
        <div class="flex items-center gap-2">
          <input type="password" :value="storedToken" @change="setStoredToken($event.target.value)" class="field-input flex-1" data-testid="security-token-input" placeholder="Paste token here to authenticate…" aria-label="paste token here to authenticate" />
          <span class="badge text-xs" :class="activeTokenIsAdmin ? 'badge-blue' : 'badge-gray'" x-text="activeTokenIsAdmin ? 'Administrator' : 'Standard user'"></span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-muted text-xs" x-text="activeTokenIsAdmin ? tokens.length + ' user credential(s)' : 'Administrator access is required to manage users'"></span>
          <button x-show="activeTokenIsAdmin" @click="showCreateToken = !showCreateToken" class="btn-primary btn-sm" data-testid="security-add-user-btn">+ Add User Access</button>
        </div>
        <template x-if="showCreateToken && activeTokenIsAdmin">
          <div class="grid gap-2 md:grid-cols-4 items-end">
            <div class="md:col-span-2">
              <label  class="field-label" for="a11y-config-user-service-name">User / service name</label>
              <input x-model="newTokenName" class="field-input" data-testid="security-new-token-name-input" placeholder="e.g. jane.smith or ci-pipeline" @keydown.enter="createToken()" id="a11y-config-user-service-name" />
            </div>
            <div>
              <label  class="field-label" for="a11y-config-role">Role</label>
              <select x-model="newTokenRole" class="field-input field-select" data-testid="security-new-token-role-select" id="a11y-config-role">
                <option value="user">Standard user</option>
                <option value="admin">Administrator</option>
              </select>
            </div>
            <div>
              <label  class="field-label" for="a11y-config-expires-optional">Expires (optional)</label>
              <input x-model="newTokenExpiresAt" type="datetime-local" class="field-input" id="a11y-config-expires-optional" />
            </div>
            <button @click="createToken()" :disabled="!newTokenName.trim()" class="btn-primary btn-sm md:col-span-4" data-testid="security-create-access-btn">Create Access</button>
          </div>
        </template>
        <template x-if="createdToken">
          <div class="bg-amber-50 border border-amber-300 rounded-lg p-3 text-sm space-y-1">
            <div class="font-semibold text-amber-800">Access created for <span x-text="createdTokenRole === 'admin' ? 'an administrator' : 'a standard user'"></span> — copy this token now:</div>
            <div class="text-xs text-amber-700">Give it to the intended user securely. Your current administrator session has not changed.</div>
            <div class="font-mono text-xs break-all text-amber-900 select-all" data-testid="security-created-token-value" x-text="createdToken"></div>
            <template x-if="createdTokenHint">
              <div class="text-xs text-amber-700">Hint (last 8 chars): <span class="font-mono" x-text="'…' + createdTokenHint"></span></div>
            </template>
            <button @click="createdToken = null; createdTokenHint = null" class="text-xs text-amber-700 underline">Dismiss</button>
          </div>
        </template>
        <div class="space-y-1">
          <template x-for="tok in tokens" :key="tok.id">
            <div class="flex items-center gap-3 px-3 py-2 rounded border border-slate-100 bg-slate-50 text-sm" :data-testid="'security-token-row-' + tok.id">
              <div class="flex-1 min-w-0">
                <span class="font-medium text-slate-700" x-text="tok.name"></span>
                <span class="ml-1 text-xs font-medium" :class="tok.is_admin ? 'text-indigo-600' : 'text-slate-500'" x-text="tok.is_admin ? '(administrator)' : '(standard user)'"></span>
                <span class="text-muted ml-2 text-xs" x-text="'created ' + fmtDate(tok.created_at)"></span>
                <span x-show="tok.last_used_at" class="text-muted ml-2 text-xs" x-text="'last used ' + fmtDate(tok.last_used_at)"></span>
                <span x-show="tok.token_hint" class="text-muted ml-2 text-xs font-mono" x-text="'…' + tok.token_hint"></span>
                <span x-show="tok.expires_at" class="text-muted ml-2 text-xs" x-text="'expires ' + fmtDate(tok.expires_at)"></span>
              </div>
              <span :class="tok.enabled ? 'badge-green' : 'badge-gray'" class="badge text-xs" x-text="tok.enabled ? 'Active' : 'Revoked'"></span>
              <button @click="revokeToken(tok.id)" :disabled="!tok.enabled" class="btn-danger btn-sm text-xs" :data-testid="'security-revoke-btn-' + tok.id">Revoke</button>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>

  <!-- Diagnostics – Support Bundle -->
  <div class="card mt-4">
    <button type="button" class="card-toggle" @click="diagnosticsOpen = !diagnosticsOpen; if(diagnosticsOpen && !diagnosticsData) loadDiagnostics()" :aria-expanded="diagnosticsOpen.toString()">
      <div class="font-semibold text-slate-700">Diagnostics — Support Bundle</div>
      <span class="text-muted text-sm" x-text="diagnosticsOpen ? '▲ collapse' : '▼ expand'"></span>
    </button>
    <template x-if="diagnosticsOpen">
      <div class="mt-3 space-y-3">
        <p class="text-muted text-sm">Collect runtime, package, database, and optional recent log details for troubleshooting.</p>
        <div class="flex items-center justify-between gap-3">
          <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
            <input type="checkbox" class="rounded" x-model="diagnosticsIncludeLogs" aria-label="diagnosticsincludelogs" /> Include recent logs
          </label>
          <button @click="loadDiagnostics()" class="btn-secondary btn-sm" :disabled="diagnosticsLoading">
            <span x-show="!diagnosticsLoading">Refresh Diagnostics</span>
            <span x-show="diagnosticsLoading">Loading...</span>
          </button>
        </div>
        <template x-if="diagnosticsError">
          <div class="text-sm text-rose-600" x-text="diagnosticsError"></div>
        </template>
        <template x-if="diagnosticsData">
          <div class="grid gap-3 md:grid-cols-3 text-sm">
            <div class="rounded border border-slate-200 bg-slate-50 p-3">
              <div class="font-semibold text-slate-700 mb-1">Environment</div>
              <div class="text-muted">Python <span x-text="diagnosticsData.environment?.python || 'unknown'"></span></div>
              <div class="text-muted truncate" x-text="diagnosticsData.environment?.platform || ''"></div>
            </div>
            <div class="rounded border border-slate-200 bg-slate-50 p-3">
              <div class="font-semibold text-slate-700 mb-1">Database</div>
              <div class="text-muted">Dialect <span x-text="diagnosticsData.database?.dialect || 'unknown'"></span></div>
              <div class="text-muted">Driver <span x-text="diagnosticsData.database?.driver || 'unknown'"></span></div>
            </div>
            <div class="rounded border border-slate-200 bg-slate-50 p-3">
              <div class="font-semibold text-slate-700 mb-1">Packages</div>
              <div class="text-muted" x-text="Object.entries(diagnosticsData.packages || {}).map(([k,v]) => k + ' ' + v).join(', ')"></div>
            </div>
          </div>
        </template>
        <template x-if="diagnosticsData && diagnosticsData.recent_logs && diagnosticsData.recent_logs.length">
          <pre class="text-xs bg-slate-50 text-slate-900 rounded p-3 overflow-auto max-h-64" x-text="diagnosticsData.recent_logs.join('\n')"></pre>
        </template>
      </div>
    </template>
  </div>

  <!-- Regional – App-wide Timezone -->
  <div class="card mt-4">
    <button type="button" class="card-toggle" @click="timezoneOpen = !timezoneOpen" :aria-expanded="timezoneOpen.toString()">
      <div class="font-semibold text-slate-700">🌐 Regional — Timezone</div>
      <span class="text-muted text-sm" x-text="timezoneOpen ? '▲ collapse' : '▼ expand'"></span>
    </button>
    <template x-if="timezoneOpen">
      <div class="mt-3 space-y-3">
        <p class="text-muted text-sm">All timestamps across the dashboard, run history, and generated reports are shown in this timezone. Scheduled runs also fire according to it — a cron expression of <code>0 9 * * *</code> means 9am in this zone.</p>
        <template x-if="!activeTokenIsAdmin">
          <div class="text-sm">Current: <span class="font-medium" x-text="appTimezone"></span> <span class="text-muted text-xs">(administrator access required to change)</span></div>
        </template>
        <template x-if="activeTokenIsAdmin">
          <div class="flex items-center gap-2">
            <select x-model="timezoneDraft" class="field-input field-select flex-1" aria-label="timezonedraft">
              <template x-for="tz in timezoneOptions" :key="tz">
                <option :value="tz" x-text="tz"></option>
              </template>
            </select>
            <button @click="saveTimezoneSetting()" :disabled="timezoneSaving || timezoneDraft === appTimezone" class="btn-primary btn-sm">
              <span x-show="!timezoneSaving">Save</span>
              <span x-show="timezoneSaving">Saving…</span>
            </button>
          </div>
        </template>
      </div>
    </template>
  </div>

  <!-- SAP BO – server-side copy of downloads -->
  <div class="card mt-4">
    <button type="button" class="card-toggle" @click="boDownloadDirOpen = !boDownloadDirOpen" :aria-expanded="boDownloadDirOpen.toString()">
      <div class="font-semibold text-slate-700">💾 SAP BO — download directory</div>
      <span class="text-muted text-sm" x-text="boDownloadDirOpen ? '▲ collapse' : '▼ expand'"></span>
    </button>
    <template x-if="boDownloadDirOpen">
      <div class="mt-3 space-y-3">
        <p class="text-muted text-sm">When set, every SAP BO report downloaded from the Adapters tab is also written here on the server, with a timestamp in the filename so nothing is ever overwritten. Files are never deleted. Leave empty to keep downloads browser-only. The path must already exist on the machine running this app, and must be absolute — on Windows that means a drive letter (<code>C:\reports\sapbo</code>) or a UNC share (<code>\\server\share\reports</code>), not a rooted path like <code>/var/reports</code>.</p>
        <template x-if="!activeTokenIsAdmin">
          <div class="text-sm">Current: <span class="font-medium" x-text="boDownloadDir || '(browser only)'"></span> <span class="text-muted text-xs">(administrator access required to change)</span></div>
        </template>
        <template x-if="activeTokenIsAdmin">
          <div class="flex items-center gap-2">
            <input type="text" x-model="boDownloadDirDraft" placeholder="C:\reports\sapbo" class="field-input flex-1" aria-label="bodownloaddirdraft">
            <button @click="saveBoDownloadDirSetting()" :disabled="boDownloadDirSaving || boDownloadDirDraft === boDownloadDir" class="btn-primary btn-sm">
              <span x-show="!boDownloadDirSaving">Save</span>
              <span x-show="boDownloadDirSaving">Saving…</span>
            </button>
          </div>
        </template>
      </div>
    </template>
  </div>

  <!-- Notifications – Webhook Hooks -->
  <div class="card mt-4">
    <button type="button" class="card-toggle" @click="notifOpen = !notifOpen; if(notifOpen) loadHooks()" :aria-expanded="notifOpen.toString()">
      <div class="font-semibold text-slate-700">🔔 Notifications — Webhooks</div>
      <span class="text-muted text-sm" x-text="notifOpen ? '▲ collapse' : '▼ expand'"></span>
    </button>
    <template x-if="notifOpen">
      <div class="mt-3 space-y-3">
        <div class="flex justify-end">
          <button @click="openNewHookModal()" class="btn-primary btn-sm">+ New Webhook</button>
        </div>
        <template x-if="hooks.length === 0">
          <div class="empty-state py-4"><div class="empty-state-title">No webhooks configured</div></div>
        </template>
        <div class="space-y-1">
          <template x-for="hook in hooks" :key="hook.id">
            <div class="flex items-center gap-3 px-3 py-2 rounded border border-slate-100 bg-slate-50 text-sm">
              <div class="flex-1 min-w-0">
                <span class="font-medium text-slate-700" x-text="hook.name"></span>
                <span class="text-muted ml-2 text-xs font-mono truncate" x-text="hook.url"></span>
                <div class="flex flex-wrap gap-1 mt-0.5">
                  <template x-for="ev in (hook.events||[])" :key="ev">
                    <span class="badge badge-sky text-xs" x-text="ev"></span>
                  </template>
                </div>
              </div>
              <span :class="hook.enabled ? 'badge-green' : 'badge-gray'" class="badge text-xs" x-text="hook.enabled ? 'On' : 'Off'"></span>
              <button @click="testHook(hook.id)" class="btn-secondary btn-sm text-xs">Test</button>
              <button @click="deleteHook(hook.id)" class="btn-danger btn-sm text-xs">Delete</button>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>

  <!-- Step Release Modal -->
  <div x-show="stepReleaseModal.show" x-cloak class="modal-backdrop" @click.self="stepReleaseModal.show = false">
    <div x-ref="stepReleaseDialog" class="modal-box w-full max-w-md" role="dialog" aria-modal="true" aria-labelledby="stepReleaseDialogTitle">
      <h2 id="stepReleaseDialogTitle" class="text-lg font-bold mb-4">Release Held Step</h2>
      <div class="space-y-3">
        <div>
          <label  class="field-label" for="a11y-config-action-approve-and-continue-skip-and-continue-cancel-run-your-name">Action *</label>
          <div class="flex gap-3 mt-1">
            <label class="flex items-center gap-1 text-sm cursor-pointer">
              <input type="radio" x-model="stepReleaseModal.action" value="approve" aria-label="stepreleasemodal action" /> Approve &amp; continue
            </label>
            <label class="flex items-center gap-1 text-sm cursor-pointer">
              <input type="radio" x-model="stepReleaseModal.action" value="skip" aria-label="stepreleasemodal action" /> Skip &amp; continue
            </label>
            <label class="flex items-center gap-1 text-sm cursor-pointer">
              <input type="radio" x-model="stepReleaseModal.action" value="cancel" aria-label="stepreleasemodal action" /> Cancel run
            </label>
          </div>
        </div>
        <div><label class="field-label">Your name *</label><input x-model="stepReleaseModal.releasedBy" class="field-input" placeholder="Alice" id="a11y-config-action-approve-and-continue-skip-and-continue-cancel-run-your-name" /></div>
        <div><label  class="field-label" for="a11y-config-note">Note *</label><textarea x-model="stepReleaseModal.note" class="field-input" rows="2" placeholder="Verified data looks correct…" id="a11y-config-note"></textarea></div>
      </div>
      <div class="flex justify-end gap-3 mt-6">
        <button @click="stepReleaseModal.show = false" class="btn-secondary">Cancel</button>
        <button @click="submitStepRelease()" :disabled="!stepReleaseModal.note.trim() || !stepReleaseModal.releasedBy.trim()" class="btn-primary">Release</button>
      </div>
    </div>
  </div>

  <!-- Webhook Modal -->
  <div x-show="showHookModal" x-cloak class="modal-backdrop" @click.self="showHookModal = false">
    <div x-ref="hookDialog" class="modal-box w-full max-w-md" role="dialog" aria-modal="true" aria-labelledby="hookDialogTitle">
      <h2 id="hookDialogTitle" class="text-lg font-bold mb-4">New Webhook</h2>
      <div class="space-y-3">
        <div><label  class="field-label" for="a11y-config-name">Name *</label><input x-model="hookModal.name" class="field-input" placeholder="Slack alerts" id="a11y-config-name" /></div>
        <div><label  class="field-label" for="a11y-config-url">URL *</label><input x-model="hookModal.url" class="field-input" placeholder="https://hooks.slack.com/…" id="a11y-config-url" /></div>
        <div>

                <div><label class="field-label">DB User</label><input x-model="conn.db_user" class="field-input" placeholder="inherits default" aria-label="inherits default" /></div>

        <div>
          <div class="flex items-center justify-between mb-2">

          <div class="mb-2">

            <span class="text-xs text-slate-400">Set once, then give each endpoint below a relative Path instead of repeating the full Base URL.</span>
          </div>
          <template x-for="(ep, idx) in configModal.apiEndpoints" :key="idx">
            <div class="border border-slate-200 rounded-lg mb-2 overflow-hidden">
              <div class="flex items-center gap-2 px-3 py-2 bg-slate-50 border-b border-slate-200">
                <input x-model="ep.name" class="field-input font-mono text-xs font-semibold py-1 px-2" style="width:140px" placeholder="endpoint_name" aria-label="endpoint name" />
                <span class="text-xs text-slate-400 flex-1" x-text="ep.base_url || (configModal.apiBaseHost && ep.path ? configModal.apiBaseHost.replace(/\/$/, '') + '/' + ep.path.replace(/^\//, '') : 'not configured')"></span>
                <span class="text-xs text-slate-400 uppercase" x-text="ep.method"></span>
                <button @click="toggleApiEndpoint(idx)" type="button" class="text-slate-400 text-xs px-1" x-text="ep.expanded ? '▲' : '▼'"></button>
                <button @click="removeApiEndpoint(idx)" type="button" class="text-red-400 text-xs px-1">✕</button>
              </div>
              <div x-show="ep.expanded" class="p-3 space-y-3">
                <div class="grid-2">
                  <div>
                    <label class="field-label">Base URL <span class="text-slate-400 font-normal" x-show="configModal.apiBaseHost">(leave blank to use Base Host + Path)</span></label>
                    <input x-model="ep.base_url" class="field-input" placeholder="https://api.example.com/v1/orders" aria-label="https api example com v1 orders" />
                  </div>
                  <div>
                    <label class="field-label">Method</label>
                    <select x-model="ep.method" class="field-input field-select" aria-label="ep method">
                      <option value="GET">GET</option>
                      <option value="POST">POST</option>
                    </select>
                  </div>
                </div>
                <div x-show="configModal.apiBaseHost">
                  <label class="field-label">Path (appended to Base Host)</label>
                  <input x-model="ep.path" class="field-input" placeholder="orders" aria-label="orders" />
                </div>
                <div>
                  <label class="field-label">Auth Type</label>
                  <select x-model="ep.auth_type" class="field-input field-select" aria-label="ep auth type">
                    <option value="none">None</option>
                    <option value="api_key">API Key Header</option>
                    <option value="bearer">Bearer Token</option>
                    <option value="basic">Basic Auth</option>
                    <option value="sap_bo_logontoken">SAP BO Logon Token</option>
                    <option value="sap_bo_basic">SAP BO Basic Logon</option>
                  </select>
                </div>
                <div x-show="ep.auth_type === 'api_key'" class="grid-2">
                  <div><label class="field-label">Header Name</label><input x-model="ep.api_key_header" class="field-input" placeholder="X-API-Key" aria-label="x api key" /></div>
                  <div><label class="field-label">API Key</label><input x-model="ep.api_key" type="password" class="field-input" aria-label="ep api key" /></div>
                </div>
                <div x-show="ep.auth_type === 'bearer'">
                  <label class="field-label">Bearer Token</label><input x-model="ep.bearer_token" type="password" class="field-input" aria-label="ep bearer token" />
                </div>
                <div x-show="ep.auth_type === 'basic'" class="grid-2">
                  <div><label class="field-label">Username</label><input x-model="ep.basic_username" class="field-input" aria-label="ep basic username" /></div>
                  <div><label class="field-label">Password</label><input x-model="ep.basic_password" type="password" class="field-input" aria-label="ep basic password" /></div>
                </div>
                <div x-show="ep.auth_type === 'sap_bo_logontoken'">
                  <label class="field-label">X-SAP-LogonToken</label><input x-model="ep.sap_bo_logon_token" type="password" class="field-input" aria-label="ep sap bo logon token" />
                </div>
                <div x-show="ep.auth_type === 'sap_bo_basic'" class="grid-2">
                  <div><label class="field-label">BO Username</label><input x-model="ep.basic_username" class="field-input" aria-label="ep basic username" /></div>
                  <div><label class="field-label">BO Password</label><input x-model="ep.basic_password" type="password" class="field-input" aria-label="ep basic password" /></div>
                  <div>
                    <label class="field-label">BO Auth Type</label>
                    <select x-model="ep.sap_bo_auth_type" class="field-input field-select" aria-label="ep sap bo auth type">
                      <option value="secEnterprise">Enterprise</option>
                      <option value="secWinAD">Windows AD</option>
                      <option value="secLDAP">LDAP</option>
                      <option value="secSAPR3">SAP R/3</option>
                    </select>
                  </div>
                  <div><label class="field-label">Logon URL Override</label><input x-model="ep.sap_bo_logon_url" class="field-input" placeholder="https://bo.example.com/biprws/logon/long" aria-label="https bo example com biprws logon long" /></div>
                </div>
                <div class="grid-2">
                  <div><label class="field-label">Headers (one per line, "Name: Value")</label><textarea x-model="ep.headers_raw" rows="2" class="field-input font-mono text-xs" placeholder="Accept: application/json" aria-label="accept application json"></textarea></div>
                  <div><label class="field-label">Query Params (one per line, "name=value")</label><textarea x-model="ep.query_params_raw" rows="2" class="field-input font-mono text-xs" placeholder="status=active" aria-label="status active"></textarea></div>
                </div>
                <div x-show="ep.method === 'POST'">
                  <label class="field-label">Body (JSON)</label>
                  <textarea x-model="ep.body_raw" rows="2" class="field-input font-mono text-xs" placeholder='{"filter": "active"}' aria-label="ep body raw"></textarea>
                </div>
                <div class="grid-2">
                  <div><label class="field-label">Timeout (s)</label><input x-model="ep.timeout" type="number" class="field-input" aria-label="ep timeout" /></div>
                  <label class="flex items-center gap-2 text-sm text-slate-700 mt-6">
                    <input x-model="ep.verify_ssl" type="checkbox" class="rounded border-slate-300" aria-label="ep verify ssl" /> Verify SSL certificate
                  </label>
                </div>
                <div class="grid-2">
                  <div>
                    <label class="field-label">Response Format</label>
                    <select x-model="ep.response_format" class="field-input field-select" aria-label="ep response format">
                      <option value="json">JSON</option>
                      <option value="csv">CSV</option>
                      <option value="xlsx">XLSX</option>
                      <option value="xls">XLS</option>
                    </select>
                  </div>
                  <div x-show="ep.response_format === 'json'">
                    <label class="field-label">JSON Root Path</label>
                    <input x-model="ep.json_root_path" class="field-input" placeholder="data.items" aria-label="data items" />
                  </div>
                </div>
                <div>
                  <label class="field-label">Pagination</label>
                  <select x-model="ep.pagination_type" class="field-input field-select" aria-label="ep pagination type">
                    <option value="none">None</option>
                    <option value="cursor">Cursor</option>
                    <option value="page">Page / Limit</option>
                  </select>
                </div>
                <div x-show="ep.pagination_type === 'cursor'" class="grid-2">
                  <div><label class="field-label">Cursor Path</label><input x-model="ep.pagination_cursor_path" class="field-input" placeholder="meta.next_cursor" aria-label="meta next cursor" /></div>
                  <div><label class="field-label">Cursor Query Param</label><input x-model="ep.pagination_cursor_param" class="field-input" placeholder="cursor" aria-label="cursor" /></div>
                </div>
                <div x-show="ep.pagination_type === 'page'" class="grid-2">
                  <div><label class="field-label">Page Param</label><input x-model="ep.pagination_page_param" class="field-input" placeholder="page" aria-label="page" /></div>
                  <div><label class="field-label">Size Param</label><input x-model="ep.pagination_size_param" class="field-input" placeholder="limit" aria-label="limit" /></div>
                  <div><label class="field-label">Page Size</label><input x-model="ep.pagination_page_size" type="number" class="field-input" aria-label="ep pagination page size" /></div>
                </div>
                <div x-show="ep.pagination_type !== 'none'">
                  <label class="field-label">Max Pages</label>
                  <input x-model="ep.pagination_max_pages" type="number" class="field-input" style="width:120px" aria-label="ep pagination max pages" />
                </div>
                <div class="flex items-center gap-2">
                  <button @click="testApiEndpoint(idx)" type="button" class="btn-secondary btn-sm text-xs">Test</button>
                  <button @click="previewApiEndpoint(idx)" type="button" class="btn-secondary btn-sm text-xs">Preview</button>
                  <span x-show="ep.testResult" :class="ep.testResult && ep.testResult.ok ? 'text-emerald-600' : 'text-red-600'" class="text-xs" x-text="ep.testResult ? ep.testResult.message : ''"></span>
                </div>
                <!-- Request/response inspector. An endpoint that works in Bruno and
                     fails here reports only "Cannot parse API response as json" - no
                     status, no content type, no body. Showing the request as actually
                     sent next to the response as actually received turns that into a
                     diff against Bruno rather than a guess. -->
                <div x-show="ep.exchange" class="border border-slate-200 rounded">
                  <button type="button"
                          @click="ep.exchangeOpen = !ep.exchangeOpen"
                          :aria-expanded="ep.exchangeOpen ? 'true' : 'false'"
                          :aria-controls="'api-exchange-panel-' + idx"
                          :data-testid="'api-exchange-toggle-' + idx"
                          class="w-full flex items-center gap-2 flex-wrap px-2 py-1.5 text-xs text-left hover:bg-slate-50">
                    <span class="font-medium text-slate-700">Request / response</span>
                    <!-- Colour AND the numeric status: the signal is never colour-only. -->
                    <span :data-testid="'api-exchange-status-' + idx"
                          class="px-1.5 py-0.5 rounded border font-mono"
                          :class="(ep.exchange?.response?.status || 0) >= 400 ? 'bg-red-50 border-red-200 text-red-700' : 'bg-emerald-50 border-emerald-200 text-emerald-700'"
                          x-text="'HTTP ' + (ep.exchange?.response?.status ?? '?')"></span>
                    <span class="text-slate-500" x-text="(ep.exchange?.response?.elapsed_ms ?? 0) + ' ms'"></span>
                    <span class="text-slate-500" x-text="(ep.exchange?.response?.bytes ?? 0) + ' bytes'"></span>
                    <span class="text-slate-500 ml-auto" x-text="ep.exchangeOpen ? 'Hide' : 'Show'"></span>
                  </button>
                  <div x-show="ep.exchangeOpen"
                       :id="'api-exchange-panel-' + idx"
                       :data-testid="'api-exchange-panel-' + idx"
                       class="border-t border-slate-200 p-2 space-y-2">
                    <div class="flex items-center gap-2 flex-wrap">
                      <button type="button"
                              @click="ep.exchangePretty = !ep.exchangePretty"
                              :aria-pressed="ep.exchangePretty ? 'true' : 'false'"
                              :data-testid="'api-exchange-pretty-toggle-' + idx"
                              :aria-label="ep.exchangePretty ? 'Pretty: bodies are formatted, activate to show them raw' : 'Raw: bodies are unformatted, activate to pretty-print them'"
                              class="btn-secondary btn-sm text-xs"
                              x-text="ep.exchangePretty ? 'Pretty' : 'Raw'"></button>
                    </div>
                    <!-- Say plainly what the masking does and does not cover. A user
                         must not read "<n chars, redacted>" as proof that everything
                         sensitive was caught, and the URL is shown verbatim by design. -->
                    <p class="text-[11px] text-slate-500">
                      Masked header values are redacted by name: matching is on the header
                      name pattern only, so a credential under a name the pattern does not
                      recognise is shown here in full. The URL is shown exactly as sent,
                      query string included, so a credential passed as a query parameter is
                      visible in cleartext.
                    </p>
                    <div :data-testid="'api-exchange-request-' + idx" class="border border-slate-200 rounded">
                      <div class="flex items-center gap-2 flex-wrap px-2 py-1 bg-slate-50 border-b border-slate-200">
                        <span class="text-[11px] uppercase tracking-wide font-medium text-slate-500">Request</span>
                        <span x-show="ep.exchange?.request?.truncated" class="text-[11px] text-amber-700">body truncated</span>
                        <button type="button"
                                class="btn-secondary btn-sm text-xs ml-auto"
                                aria-label="Copy the request as sent"
                                :data-testid="'api-exchange-copy-request-' + idx"
                                @click="navigator.clipboard.writeText(
                                  (ep.exchange?.request?.method || '') + ' ' + (ep.exchange?.request?.url || '') + '\n' +
                                  Object.entries(ep.exchange?.request?.headers || {}).map(([k, v]) => k + ': ' + v).join('\n') + '\n\n' +
                                  exchangeBody(ep.exchange?.request?.body, ep.exchangePretty)
                                ).catch(() => {})">Copy</button>
                      </div>
                      <div class="p-2 space-y-1">
                        <div class="exchange-pre-wrap overflow-x-auto">
                          <pre class="text-xs font-mono text-slate-700" x-text="(ep.exchange?.request?.method || '') + ' ' + (ep.exchange?.request?.url || '')"></pre>
                        </div>
                        <div class="exchange-pre-wrap overflow-x-auto">
                          <pre class="text-xs font-mono text-slate-600" x-text="Object.entries(ep.exchange?.request?.headers || {}).map(([k, v]) => k + ': ' + v).join('\n')"></pre>
                        </div>
                        <!-- A request body that was never sent is the dropped-body
                             signal, so it is called out rather than shown as blank. -->
                        <p x-show="ep.exchange?.request?.body === null || ep.exchange?.request?.body === undefined"
                           :data-testid="'api-exchange-request-none-' + idx"
                           class="text-xs font-mono font-bold text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1">&lt;NONE SENT&gt;</p>
                        <div x-show="ep.exchange?.request?.body !== null && ep.exchange?.request?.body !== undefined"
                             class="exchange-pre-wrap overflow-x-auto max-h-40 overflow-y-auto">
                          <pre class="text-xs font-mono text-slate-700"
                               :data-testid="'api-exchange-request-body-' + idx"
                               x-text="exchangeBody(ep.exchange?.request?.body, ep.exchangePretty)"></pre>
                        </div>
                      </div>
                    </div>
                    <div :data-testid="'api-exchange-response-' + idx" class="border border-slate-200 rounded">
                      <div class="flex items-center gap-2 flex-wrap px-2 py-1 bg-slate-50 border-b border-slate-200">
                        <span class="text-[11px] uppercase tracking-wide font-medium text-slate-500">Response</span>
                        <span class="text-[11px] font-mono text-slate-500" x-text="ep.exchange?.response?.content_type || '(no content type)'"></span>
                        <span x-show="ep.exchange?.response?.binary" class="text-[11px] text-slate-500">hex preview</span>
                        <span x-show="ep.exchange?.response?.truncated" class="text-[11px] text-amber-700">body truncated</span>
                        <span x-show="(ep.exchange?.response?.redirects || 0) > 0" class="text-[11px] text-amber-700"
                              x-text="(ep.exchange?.response?.redirects || 0) + ' redirect(s) followed'"></span>
                        <button type="button"
                                class="btn-secondary btn-sm text-xs ml-auto"
                                aria-label="Copy the response as received"
                                :data-testid="'api-exchange-copy-response-' + idx"
                                @click="navigator.clipboard.writeText(
                                  'HTTP ' + (ep.exchange?.response?.status ?? '') + '\n' +
                                  Object.entries(ep.exchange?.response?.headers || {}).map(([k, v]) => k + ': ' + v).join('\n') + '\n\n' +
                                  exchangeBody(ep.exchange?.response?.body, ep.exchangePretty)
                                ).catch(() => {})">Copy</button>
                      </div>
                      <div class="p-2 space-y-1">
                        <div class="exchange-pre-wrap overflow-x-auto">
                          <pre class="text-xs font-mono text-slate-600" x-text="Object.entries(ep.exchange?.response?.headers || {}).map(([k, v]) => k + ': ' + v).join('\n')"></pre>
                        </div>
                        <div class="exchange-pre-wrap overflow-x-auto max-h-40 overflow-y-auto">
                          <pre class="text-xs font-mono text-slate-700"
                               :data-testid="'api-exchange-response-body-' + idx"
                               x-text="exchangeBody(ep.exchange?.response?.body, ep.exchangePretty)"></pre>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <p x-show="ep.previewError" x-text="ep.previewError" class="text-xs text-red-600"></p>
                <div x-show="ep.previewResult" class="overflow-x-auto max-h-40 border border-slate-200 rounded">
                  <table class="text-xs w-full" aria-label="config table 2">
                    <thead class="bg-slate-100 sticky top-0">
                      <tr><template x-for="col in (ep.previewResult?.columns || [])" :key="col"><th x-text="col" class="px-2 py-1 text-left font-medium text-slate-600 whitespace-nowrap" scope="col"></th></template></tr>
                    </thead>
                    <tbody>
                      <template x-for="(row, ri) in (ep.previewResult?.rows || [])" :key="ri">
                        <tr :class="ri % 2 === 0 ? 'bg-white' : 'bg-slate-50'">
                          <template x-for="(cell, ci) in row" :key="ci"><td x-text="cell ?? 'NULL'" class="px-2 py-1 whitespace-nowrap max-w-xs truncate"></td></template>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </template>
        </div>
        <div class="divider"></div>
