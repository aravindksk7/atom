<template x-if="currentView === 'sequences'"><div data-testid="sequences-panel" x-init="rehydrateBatchProgress()">
  <div class="section-header">
    <div>
      <div class="section-title">Execution Sequences</div>
      <div class="section-sub">Saved, versioned job pipelines with their own dependencies. Attach one to a job selection or a schedule.</div>
    </div>
    <button class="btn btn-primary" data-testid="sequence-new-btn" @click="openSequenceCreate()">New sequence</button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <!-- List -->
    <div class="card">
      <div class="card-title">Saved sequences</div>
      <div x-show="sequencesLoading" class="text-sm text-muted">Loading…</div>
      <div x-show="!sequencesLoading && sequences.length === 0" class="text-sm text-muted">
        No sequences yet.
      </div>
      <ul class="space-y-2" data-testid="sequence-list">
        <template x-for="seq in sequences" :key="seq.id">
          <li class="flex items-center justify-between gap-2 p-2 rounded hover:bg-subtle cursor-pointer"
              :data-testid="'sequence-row-' + seq.name"
              @click="selectSequence(seq)">
            <div>
              <div class="font-medium" x-text="seq.name"></div>
              <div class="text-xs text-muted">
                <span x-text="'v' + seq.latest_version"></span> ·
                <span x-text="seq.step_count + ' steps'"></span>
              </div>
            </div>
            <button class="btn btn-ghost btn-xs" :data-testid="'sequence-archive-' + seq.name"
                    @click.stop="archiveSequence(seq)">Archive</button>
          </li>
        </template>
      </ul>
    </div>

    <!-- Detail -->
    <div class="card lg:col-span-2" x-show="selectedSequence" data-testid="sequence-detail">
      <div class="flex items-center justify-between">
        <div class="card-title" x-text="selectedSequence && selectedSequence.name"></div>
        <div class="flex gap-2">
          <button class="btn btn-primary btn-sm" data-testid="sequence-launch-btn"
                  @click="openLaunchSequenceModal(selectedSequence)">Run sequence</button>
          <button class="btn btn-secondary btn-sm" data-testid="sequence-ci-btn"
                  @click="openCiIntegrationModal(selectedSequence, 'sequence')">CI/CD</button>
          <button class="btn btn-secondary btn-sm" data-testid="sequence-edit-btn"
                  @click="openSequenceVersionEditor()">Edit as new version</button>
        </div>
      </div>
      <div class="text-sm text-muted mb-3" x-text="selectedSequence && selectedSequence.description"></div>

      <table class="data-table" aria-label="sequences table 1">
        <thead>
          <tr><th>Step</th><th>Job</th><th>Runs after</th></tr>
        </thead>
        <tbody>
          <template x-if="selectedSequence">
            <template x-for="step in selectedSequence.versions[selectedSequence.versions.length - 1].steps"
                      :key="step.step_id">
              <tr>
                <td x-text="step.step_id"></td>
                <td x-text="step.job_name"></td>
                <td x-text="(step.depends_on || []).join(', ') || '—'"></td>
              </tr>
            </template>
          </template>
        </tbody>
      </table>

      <div class="mt-4 text-sm" data-testid="sequence-usage">
        <div class="font-medium">Used by</div>
        <div class="text-muted">
          <span x-text="sequenceUsage.selections.length + ' selection(s)'"></span> ·
          <span x-text="sequenceUsage.schedules.length + ' schedule(s)'"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Editor -->
  <div class="modal" x-show="sequenceEditorOpen" x-cloak data-testid="sequence-editor">
    <div class="modal-body max-w-4xl">
      <div class="modal-title"
           x-text="sequenceEditorMode === 'create' ? 'New execution sequence' : 'New version'"></div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
        <label class="field">
          <span class="field-label">Name</span>
          <input class="field-input" data-testid="sequence-name-input"
                 x-model="sequenceMeta.name" :disabled="sequenceEditorMode === 'version'"
                 aria-label="sequence name" />
        </label>
        <label class="field">
          <span class="field-label">Description</span>
          <input class="field-input" x-model="sequenceMeta.description" aria-label="sequence description" />
        </label>
        <label class="field">
          <span class="field-label">Tags (comma separated)</span>
          <input class="field-input" x-model="sequenceMeta.tags_raw" aria-label="sequence tags" />
        </label>
      </div>

<details class="card card-compact mb-3" data-testid="sequence-preconditions">
  <summary class="text-sm cursor-pointer">Preconditions — when may this sequence run?</summary>
  <p class="text-xs text-muted mt-2">
    Checked once before the sequence starts. If a gate says no, nothing runs and no run is recorded.
  </p>

  <label class="field-inline mt-3">
    <input type="checkbox" x-model="sequencePreconditions.time_window_enabled"
           data-testid="precondition-window-toggle" aria-label="restrict to a time window" />
    <span>Only within a time window</span>
  </label>
  <div class="grid grid-cols-2 gap-3" x-show="sequencePreconditions.time_window_enabled">
    <label class="field">
      <span class="field-label">From</span>
      <input type="time" class="field-input" data-testid="precondition-window-start"
             x-model="sequencePreconditions.time_window_start" aria-label="window start" />
    </label>
    <label class="field">
      <span class="field-label">Until</span>
      <input type="time" class="field-input" data-testid="precondition-window-end"
             x-model="sequencePreconditions.time_window_end" aria-label="window end" />
    </label>
  </div>
  <p class="text-xs text-muted" x-show="sequencePreconditions.time_window_enabled">
    Uses the application timezone. An end time earlier than the start wraps past midnight.
  </p>

  <label class="field-inline mt-3">
    <input type="checkbox" x-model="sequencePreconditions.weekdays_enabled"
           data-testid="precondition-weekdays-toggle" aria-label="restrict to weekdays" />
    <span>Only on certain days</span>
  </label>
  <div class="flex flex-wrap gap-2" x-show="sequencePreconditions.weekdays_enabled"
       data-testid="precondition-weekdays">
    <template x-for="day in weekdayOptions" :key="day.value">
      <label class="chip cursor-pointer">
        <input type="checkbox" :checked="sequencePreconditions.weekdays.includes(day.value)"
               @change="toggleWeekday(day.value)" :aria-label="day.label" />
        <span x-text="day.label"></span>
      </label>
    </template>
  </div>

  <label class="field-inline mt-3">
    <input type="checkbox" x-model="sequencePreconditions.require_run_enabled"
           data-testid="precondition-upstream-toggle" aria-label="require a recent successful job" />
    <span>Only after another job has succeeded recently</span>
  </label>
  <div class="grid grid-cols-2 gap-3" x-show="sequencePreconditions.require_run_enabled">
    <label class="field">
      <span class="field-label">Job</span>
      <select class="field-input" data-testid="precondition-upstream-job"
              x-model="sequencePreconditions.require_run_job" aria-label="upstream job">
        <option value="">Select a job…</option>
        <template x-for="job in jobs" :key="job.name">
          <option :value="job.name" x-text="job.name"></option>
        </template>
      </select>
    </label>
    <label class="field">
      <span class="field-label">Within the last (hours)</span>
      <input type="number" min="1" class="field-input" data-testid="precondition-upstream-hours"
             x-model.number="sequencePreconditions.require_run_hours" aria-label="within hours" />
    </label>
  </div>
</details>

      <div class="space-y-3" data-testid="sequence-step-editor">
        <template x-for="(step, index) in sequenceSteps" :key="index">
          <div class="card card-compact">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <label class="field">
                <span class="field-label">Job</span>
                <select class="field-input" :data-testid="'sequence-step-job-' + index"
                        x-model="step.job_name" @change="onSequenceJobPicked(step)"
                        aria-label="step job">
                  <option value="">Select a job…</option>
                  <template x-for="job in jobs" :key="job.name">
                    <option :value="job.name" x-text="job.name"></option>
                  </template>
                </select>
              </label>
              <label class="field">
                <span class="field-label">Step id</span>
                <input class="field-input" :data-testid="'sequence-step-id-' + index"
                       x-model="step.step_id" @input="validateSequenceSteps()"
                       aria-label="step id" />
              </label>
              <div class="field">
                <span class="field-label">Runs after</span>
                <div class="flex flex-wrap gap-2" :data-testid="'sequence-step-deps-' + index">
                  <template x-for="parent in sequenceParentOptions(step)" :key="parent">
                    <label class="chip cursor-pointer">
                      <input type="checkbox" :checked="(step.depends_on || []).includes(parent)"
                             @change="toggleSequenceDependency(step, parent)"
                             :aria-label="'depends on ' + parent" />
                      <span x-text="parent"></span>
                    </label>
                  </template>
                  <span class="text-xs text-muted" x-show="sequenceParentOptions(step).length === 0">
                    No other steps yet
                  </span>
                </div>
              </div>
              <label class="field" x-show="(step.depends_on || []).length > 0">
                <span class="field-label">Run this step when</span>
                <select class="field-input" :data-testid="'sequence-step-trigger-' + index"
                        x-model="step.trigger_rule" @change="validateSequenceSteps()"
                        aria-label="trigger rule">
                  <option value="all_success">All parents succeeded</option>
                  <option value="all_done">All parents finished, whatever the outcome</option>
                  <option value="any_success">At least one parent succeeded</option>
                  <option value="all_failed">All parents failed</option>
                </select>
              </label>
            </div>

            <details class="mt-2">
              <summary class="text-sm cursor-pointer">Advanced</summary>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-2">
                <label class="field-inline">
                  <input type="checkbox" x-model="step.hold_after" aria-label="hold after this step" />
                  <span>Hold after this step</span>
                </label>
                <label class="field">
                  <span class="field-label">Wait before this step (seconds)</span>
                  <input type="number" min="0" class="field-input" x-model.number="step.wait_seconds"
                         aria-label="wait seconds" />
                </label>
                <label class="field">
                  <span class="field-label">Retries on error</span>
                  <input type="number" min="0" max="10" class="field-input"
                         :data-testid="'sequence-step-retries-' + index"
                         x-model.number="step.max_retries" placeholder="Inherit from run settings"
                         aria-label="max retries" />
                </label>
                <label class="field">
                  <span class="field-label">Delay between retries (seconds)</span>
                  <input type="number" min="0" class="field-input"
                         x-model.number="step.retry_delay_seconds" placeholder="Inherit from run settings"
                         aria-label="retry delay seconds" />
                </label>
                <label class="field">
                  <span class="field-label">If this step fails</span>
                  <select class="field-input" :data-testid="'sequence-step-onfailure-' + index"
                          x-model="step.on_failure" aria-label="on failure">
                    <option value="skip_downstream">Carry on — dependent steps decide for themselves</option>
                    <option value="continue">Carry on and don't count this failure against the run</option>
                    <option value="stop">Stop the whole run</option>
                  </select>
                </label>
              </div>
              <p class="text-xs text-muted mt-2">
                Only errors are retried. A failed data comparison is a real result, so re-running it cannot change the outcome.
              </p>
            </details>

            <template x-for="issue in sequenceIssuesFor(step.step_id)" :key="issue.field + issue.message">
              <div class="text-xs text-danger mt-1" x-text="issue.message"></div>
            </template>

            <div class="mt-2 text-right">
              <button class="btn btn-ghost btn-xs" :data-testid="'sequence-step-remove-' + index"
                      @click="removeSequenceStep(index)">Remove step</button>
            </div>
          </div>
        </template>
      </div>

      <button class="btn btn-secondary btn-sm mt-3" data-testid="sequence-add-step"
              @click="addSequenceStep()">Add step</button>

      <template x-for="issue in sequenceGlobalIssues" :key="issue.field + issue.message">
        <div class="text-sm text-danger mt-2" data-testid="sequence-global-error" x-text="issue.message"></div>
      </template>

      <!-- Read-only graph preview, laid out by dependency depth. -->
      <div class="mt-4" x-show="sequenceOrder.length" data-testid="sequence-graph-preview">
        <div class="field-label">Execution order preview</div>
        <div class="flex flex-col gap-2">
          <template x-for="level in sequenceLevels" :key="level.index">
            <div class="flex items-center gap-2">
              <span class="text-xs text-muted w-16" x-text="'level ' + (level.index + 1)"></span>
              <div class="flex flex-wrap gap-2">
                <template x-for="step in level.steps" :key="step.step_id">
                  <span class="chip" x-text="step.step_id"></span>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" @click="sequenceEditorOpen = false">Cancel</button>
        <button class="btn btn-primary" data-testid="sequence-save-btn"
                :disabled="!sequenceIsValid || sequenceSaving"
                @click="saveSequence()">Save</button>
      </div>
    </div>
  </div>

  <!-- Launch Sequence Modal -->
  <div x-show="showLaunchSequenceModal" x-cloak class="modal-backdrop" @click.self="showLaunchSequenceModal = false">
    <div class="modal-box w-full max-w-md" x-ref="launchSequenceDialog" role="dialog" aria-modal="true" aria-labelledby="launchSequenceModalTitle">
      <h2 id="launchSequenceModalTitle" class="text-lg font-bold mb-4">Launch Sequence</h2>
      <div class="space-y-3">
        <div>
          <label class="field-label">Source Env</label>
          <select x-model="launchSequenceModal.source_env" class="field-input field-select">
            <option value="dev">Dev</option><option value="qa">QA</option>
            <option value="staging">Staging</option><option value="prod">Prod</option>
          </select>
        </div>
        <div>
          <label class="field-label">Target Env (leave blank for single-environment jobs)</label>
          <select x-model="launchSequenceModal.target_env" class="field-input field-select" data-testid="launch-sequence-target-env">
            <option value="">— None —</option>
            <option value="dev">Dev</option><option value="qa">QA</option>
            <option value="staging">Staging</option><option value="prod">Prod</option>
          </select>
        </div>
        <div>
          <label class="field-label">Variable overrides (optional, one per line "name=value")</label>
          <textarea x-model="launchSequenceModal.variableOverridesRaw" rows="2" class="field-input font-mono text-xs" placeholder="run_date=2026-09-08" data-testid="launch-sequence-variable-overrides-textarea"></textarea>
          <p class="text-xs text-muted mt-1">Overrides the Config-stored value for this run only. Leave blank to use the Config's value.</p>
        </div>
        <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" class="rounded" x-model="launchSequenceModal.repeat_enabled" data-testid="sequence-repeat-toggle" /> Repeat execution</label>
        <div x-show="launchSequenceModal.repeat_enabled" class="border border-slate-200 rounded-lg p-3 space-y-3 bg-slate-50">
          <div>
            <label class="field-label">Date variable</label>
            <select x-model="launchSequenceModal.batch_variable_name" class="field-input field-select" data-testid="sequence-batch-variable-select">
              <option value="">Select date variable...</option>
              <template x-for="variable in dateCustomVariables()" :key="variable.name">
                <option :value="variable.name" x-text="variable.name"></option>
              </template>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="field-label">Start date</label><input type="date" x-model="launchSequenceModal.batch_start_value" class="field-input" data-testid="sequence-batch-start-date" /></div>
            <div><label class="field-label">Iterations</label><input type="number" min="1" max="200" x-model="launchSequenceModal.batch_iterations" class="field-input" data-testid="sequence-batch-iterations" /></div>
            <div><label class="field-label">Step days</label><input type="number" min="1" x-model="launchSequenceModal.batch_step_days" class="field-input" data-testid="sequence-batch-step-days" /></div>
            <div><label class="field-label">Weekend policy</label><select x-model="launchSequenceModal.batch_weekend_policy" class="field-input field-select" data-testid="sequence-batch-weekend-policy"><option value="skip">Skip</option><option value="shift">Shift</option><option value="ignore">Ignore</option></select></div>
          </div>
          <label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" class="rounded" x-model="launchSequenceModal.batch_stop_on_failure" data-testid="sequence-batch-stop-on-failure" /> Stop on first failed run</label>
        </div>
      </div>
      <div class="flex justify-end gap-3 mt-6">
        <button @click="showLaunchSequenceModal = false" class="btn-secondary">Cancel</button>
        <button @click="launchSequence()" :disabled="launchSequenceModal.repeat_enabled && !launchSequenceModal.batch_variable_name" class="btn-primary" data-testid="launch-sequence-submit-btn">Launch</button>
      </div>
    </div>
  </div>

  <template x-if="batchProgress || batchProgressError || recentBatchIds.length">
    <div class="card mb-4 border-emerald-200 bg-emerald-50" data-testid="batch-progress-panel">
      <div class="flex items-start justify-between gap-3">
        <div class="flex-1 min-w-0">
          <div class="flex flex-wrap items-center gap-3">
            <div class="font-semibold text-emerald-900">Batch progress</div>
            <select x-show="recentBatchIds.length" x-model="selectedBatchId" @change="selectRecentBatch($event.target.value)" class="field-input field-select text-xs py-1 w-auto" aria-label="Recent batches" data-testid="recent-batches-picker">
              <template x-for="batchId in recentBatchIds" :key="batchId"><option :value="batchId" x-text="batchId"></option></template>
            </select>
          </div>
          <template x-if="batchProgress"><div><div class="text-sm text-emerald-800" x-text="`${batchProgress.completed} / ${batchProgress.iterations} complete`"></div><div class="text-xs text-emerald-700" data-testid="batch-progress-status" x-text="`${batchProgress.variable_name}, status ${batchProgress.status}`"></div></div></template>
          <div x-show="batchProgressError" class="text-sm text-rose-700 mt-2" data-testid="batch-progress-error" x-text="batchProgressError"></div>
        </div>
        <button x-show="batchProgress && !batchIsTerminal(batchProgress.status)" @click="cancelBatch(batchProgress.batch_id)" class="btn-danger btn-sm" data-testid="batch-progress-cancel-btn">Cancel</button>
      </div>
      <template x-if="batchProgress">
        <div class="mt-4 space-y-2" data-testid="batch-loop-list">
          <template x-for="loop in (batchProgress.runs || [])" :key="loop.iteration_index">
            <div class="rounded-lg border border-emerald-200 bg-white overflow-hidden" :data-testid="'batch-loop-' + loop.iteration_index">
              <div class="flex items-center gap-3 px-3 py-2">
                <button x-show="loop.run_id" @click="toggleBatchRunSteps(loop.run_id)" class="text-slate-500 w-5" :aria-expanded="Boolean(expandedBatchRuns[loop.run_id])" :aria-label="'Toggle loop ' + loop.iteration_index + ' steps'"><span x-text="expandedBatchRuns[loop.run_id] ? '⌄' : '›'"></span></button>
                <span x-show="!loop.run_id" class="w-5"></span><span class="text-sm font-semibold text-slate-700" x-text="'Loop ' + loop.iteration_index"></span><span class="text-sm text-slate-600" x-text="loop.business_date"></span><span x-show="loop.started_at" class="text-xs text-slate-500" x-text="loop.started_at ? 'Started ' + fmtDate(loop.started_at) : ''"></span><span x-show="loop.completed_at" class="text-xs text-slate-500" x-text="loop.completed_at ? 'Completed ' + fmtDate(loop.completed_at) : ''"></span><span class="badge text-xs ml-auto" :class="stepStatusBadgeClass(loop.status)" x-text="loop.status"></span>
              </div>
              <template x-if="loop.run_id && expandedBatchRuns[loop.run_id]"><div class="border-t border-slate-100 px-3 py-2 space-y-1.5"><template x-for="step in (runStepsCache[loop.run_id] || [])" :key="step.step_id || step.step_index"><div class="flex items-center gap-3 px-3 py-2 rounded-lg bg-slate-50 border border-slate-100"><span class="text-xs font-bold text-slate-400 w-5 text-center" x-text="step.step_index + 1"></span><span class="flex-1 text-sm font-medium text-slate-700" x-text="step.job_name"></span><span class="badge text-xs" :class="stepStatusBadgeClass(step.status)" x-text="step.status"></span></div></template><div x-show="batchStepsUnavailable[loop.run_id]" class="text-xs text-slate-500 px-3 py-2">steps unavailable</div></div></template>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>
</div></template>
