<template x-if="currentView === 'aws'"><div>
  <div class="section-header">
    <div>
      <div class="section-title">AWS</div>
      <div class="section-sub">Ad-hoc checks against AWS services — S3 object metadata, row counts, partitions, and format validation</div>
    </div>
  </div>

  <div class="compare-subtabs mb-4">
    <button type="button" data-testid="aws-service-s3" @click="awsService='s3'" :class="awsService === 's3' ? 'sub-tab active' : 'sub-tab'">S3</button>
    <button type="button" data-testid="aws-service-glue" @click="awsService='glue'" :class="awsService === 'glue' ? 'sub-tab active' : 'sub-tab'">Glue</button>
    <button type="button" data-testid="aws-service-athena" @click="awsService='athena'" :class="awsService === 'athena' ? 'sub-tab active' : 'sub-tab'">Athena</button>
    <button type="button" data-testid="aws-service-airflow" disabled title="Coming soon" class="sub-tab">Airflow</button>
  </div>

  <div class="card mb-4">
    <label  class="field-label" for="a11y-aws-config">Config</label>
    <select x-model="awsConfigId" class="field-input field-select" data-testid="aws-config-select" id="a11y-aws-config">
      <option value="">— Select —</option>
      <template x-for="cfg in configs" :key="cfg.id">
        <option :value="cfg.id" x-text="cfg.name"></option>
      </template>
    </select>
  </div>

  <div x-show="awsService === 's3'">
    <div class="card mb-4">
      <div class="flex items-center justify-between mb-3">
        <div class="font-semibold text-slate-700">Amazon S3</div>
        <span class="badge badge-purple">Object Checks</span>
      </div>

      <div class="grid-2 mb-3">
        <div>
          <label  class="field-label" for="a11y-aws-format">Format</label>
          <select x-model="awsFmt" class="field-input field-select" data-testid="aws-fmt-select" id="a11y-aws-format">
            <option value="csv">csv</option>
            <option value="json">json</option>
            <option value="parquet">parquet</option>
            <option value="orc">orc</option>
          </select>
        </div>
      </div>

      <div class="grid-2 mb-3">
        <div>
          <label  class="field-label" for="a11y-aws-bucket">Bucket</label>
          <input x-model="awsBucket" class="field-input" placeholder="my-bucket" data-testid="aws-bucket-input" id="a11y-aws-bucket" />
        </div>
        <div>
          <label  class="field-label" for="a11y-aws-key">Key</label>
          <input x-model="awsKey" class="field-input" placeholder="data/part-0.parquet" data-testid="aws-key-input" id="a11y-aws-key" />
        </div>
      </div>

      <div class="grid-2 mb-3">
        <div>
          <label  class="field-label" for="a11y-aws-prefix">Prefix</label>
          <input x-model="awsPrefix" class="field-input" placeholder="table/" data-testid="aws-prefix-input" id="a11y-aws-prefix" />
        </div>
        <div>
          <label  class="field-label" for="a11y-aws-expected-schema-json-optional">Expected Schema (JSON, optional)</label>
          <input x-model="awsExpectedSchemaRaw" class="field-input" placeholder='{"id":"int64"}' data-testid="aws-expected-schema-input" id="a11y-aws-expected-schema-json-optional" />
        </div>
      </div>

      <div class="card mb-3">
        <div class="font-semibold text-slate-700 mb-2">Create tracked S3 job</div>
        <div class="grid-2 mb-3">
          <div>
            <label  class="field-label" for="a11y-aws-job-name-optional">Job Name (optional)</label>
            <input x-model="awsJobName" class="field-input" placeholder="auto-generated from S3 path" data-testid="aws-job-name-input" id="a11y-aws-job-name-optional" />
          </div>
          <div>
            <label  class="field-label" for="a11y-aws-expected-partition-columns">Expected Partition Columns</label>
            <input x-model="awsExpectedColumnsRaw" class="field-input" placeholder="dt, region" data-testid="aws-expected-columns-input" id="a11y-aws-expected-partition-columns" />
          </div>
        </div>
        <div class="grid-2 mb-3">
          <div>
            <label  class="field-label" for="a11y-aws-min-rows">Min Rows</label>
            <input x-model="awsMinRows" type="number" min="0" class="field-input" placeholder="0" data-testid="aws-min-rows-input" id="a11y-aws-min-rows" />
          </div>
          <div>
            <label  class="field-label" for="a11y-aws-max-rows">Max Rows</label>
            <input x-model="awsMaxRows" type="number" min="0" class="field-input" placeholder="1000000" data-testid="aws-max-rows-input" id="a11y-aws-max-rows" />
          </div>
        </div>
        <div class="grid-2 mb-3">
          <div>
            <label  class="field-label" for="a11y-aws-min-partitions">Min Partitions</label>
            <input x-model="awsMinPartitions" type="number" min="0" class="field-input" placeholder="1" data-testid="aws-min-partitions-input" id="a11y-aws-min-partitions" />
          </div>
        </div>
        <div class="flex gap-2 flex-wrap mb-2">
          <button @click="awsCreateRowCountJob()" :disabled="awsLoading || !awsConfigId || !awsBucket || !awsKey" class="btn-secondary" data-testid="aws-create-row-count-job-btn">Create Row Count Job</button>
          <button @click="awsCreateFormatValidationJob()" :disabled="awsLoading || !awsConfigId || !awsBucket || !awsKey" class="btn-secondary" data-testid="aws-create-format-validation-job-btn">Create Format Validation Job</button>
          <button @click="awsCreatePartitionCheckJob()" :disabled="awsLoading || !awsConfigId || !awsBucket || !awsPrefix" class="btn-secondary" data-testid="aws-create-partition-check-job-btn">Create Partition Check Job</button>
        </div>
        <div x-show="awsJobError" class="bg-rose-50 border-rose-200 text-rose-700 border rounded-lg p-2 text-sm" data-testid="aws-job-error" x-text="awsJobError"></div>
      </div>

      <div class="flex gap-2 flex-wrap mb-3">
        <button @click="awsRunMetadata()" :disabled="awsLoading || !awsConfigId || !awsBucket || !awsKey" class="btn-primary" data-testid="aws-run-metadata-btn">Metadata</button>
        <button @click="awsRunRowCount()" :disabled="awsLoading || !awsConfigId || !awsBucket || !awsKey" class="btn-primary" data-testid="aws-run-row-count-btn">Row Count</button>
        <button @click="awsRunPartitions()" :disabled="awsLoading || !awsConfigId || !awsBucket || !awsPrefix" class="btn-primary" data-testid="aws-run-partitions-btn">Partitions</button>
        <button @click="awsRunValidateFormat()" :disabled="awsLoading || !awsConfigId || !awsBucket || !awsKey" class="btn-primary" data-testid="aws-run-validate-format-btn">Validate Format</button>
      </div>

      <div x-show="awsLoading" class="text-muted" data-testid="aws-loading">Running…</div>

      <template x-if="awsError">
        <div class="bg-rose-50 border-rose-200 text-rose-700 border rounded-lg p-2 text-sm mb-3" x-show="awsError" data-testid="aws-error">
          <span x-text="awsError && awsError.message"></span>
          <div x-show="awsError && awsError.missing" class="mt-1">Missing: <span x-text="awsError && (awsError.missing || []).join(', ')"></span></div>
          <div x-show="awsError && awsError.extra" class="mt-1">Extra: <span x-text="awsError && (awsError.extra || []).join(', ')"></span></div>
          <div x-show="awsError && awsError.typeMismatches" class="mt-1">
            Type mismatches:
            <template x-for="m in (awsError && awsError.typeMismatches) || []" :key="m.column">
              <span class="inline-block mr-2" x-text="m.column + ': expected ' + m.expected_type + ', actual ' + m.actual_type"></span>
            </template>
          </div>
        </div>
      </template>

      <div x-show="awsResult" data-testid="aws-result">
        <template x-if="awsResult && awsResult.kind === 'metadata'">
          <div class="overflow-x-auto">
            <table class="results-table text-sm" aria-label="aws table 1">
              <tbody>
                <tr><th scope="col">Size (bytes)</th><td x-text="awsResult.data.size_bytes"></td></tr>
                <tr><th scope="col">Content type</th><td x-text="awsResult.data.content_type"></td></tr>
                <tr><th scope="col">Storage class</th><td x-text="awsResult.data.storage_class"></td></tr>
                <tr><th scope="col">ETag</th><td x-text="awsResult.data.etag"></td></tr>
                <tr><th scope="col">Last modified</th><td x-text="awsResult.data.last_modified"></td></tr>
              </tbody>
            </table>
          </div>
        </template>

        <template x-if="awsResult && awsResult.kind === 'row_count'">
          <div class="flex items-center gap-2 text-sm">
            <span>Rows: <strong x-text="awsResult.data.row_count"></strong></span>
            <span class="badge badge-blue" x-text="awsResult.data.engine"></span>
          </div>
        </template>

        <template x-if="awsResult && awsResult.kind === 'partitions'">
          <div class="overflow-x-auto">
            <table class="results-table text-xs" aria-label="aws table 2">
              <thead>
                <tr>
                  <template x-for="col in awsResult.data.columns" :key="col">
                    <th x-text="col" scope="col"></th>
                  </template>
                  <th scope="col">objects</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(e, awsPartIdx) in awsResult.data.entries" :key="awsPartIdx">
                  <tr>
                    <template x-for="col in awsResult.data.columns" :key="col">
                      <td x-text="e.values[col]"></td>
                    </template>
                    <td x-text="e.object_count"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>

        <template x-if="awsResult && awsResult.kind === 'validate_format'">
          <div class="flex items-center gap-2 text-sm">
            <span>Parsed: <strong x-text="awsResult.data.parsed"></strong></span>
            <span>Schema OK: <strong x-text="awsResult.data.schema_ok"></strong></span>
          </div>
        </template>
      </div>
    </div>
  </div>

  <div x-show="awsService === 'glue'">
    <div class="card mb-4">
      <div class="flex items-center justify-between mb-3">
        <div class="font-semibold text-slate-700">AWS Glue Catalog</div>
        <span class="badge badge-blue">Catalog Compare</span>
      </div>
      <div class="grid-2 mb-3">
        <div><label  class="field-label" for="a11y-aws-source-database">Source Database</label><input x-model="awsGlueSourceDatabase" class="field-input" data-testid="aws-glue-source-database-input" id="a11y-aws-source-database" /></div>
        <div><label  class="field-label" for="a11y-aws-source-table">Source Table</label><input x-model="awsGlueSourceTable" class="field-input" data-testid="aws-glue-source-table-input" id="a11y-aws-source-table" /></div>
      </div>
      <div class="grid-2 mb-3">
        <div><label  class="field-label" for="a11y-aws-target-database">Target Database</label><input x-model="awsGlueTargetDatabase" class="field-input" data-testid="aws-glue-target-database-input" id="a11y-aws-target-database" /></div>
        <div><label  class="field-label" for="a11y-aws-target-table">Target Table</label><input x-model="awsGlueTargetTable" class="field-input" data-testid="aws-glue-target-table-input" id="a11y-aws-target-table" /></div>
      </div>
      <div class="flex gap-4 text-sm mb-3">
        <label><input type="checkbox" x-model="awsGlueCompareLocation" data-testid="aws-glue-compare-location-checkbox" aria-label="aws glue compare location checkbox" /> Compare location</label>
        <label><input type="checkbox" x-model="awsGlueCompareFormats" data-testid="aws-glue-compare-formats-checkbox" aria-label="aws glue compare formats checkbox" /> Compare formats</label>
        <label><input type="checkbox" x-model="awsGlueComparePartitions" data-testid="aws-glue-compare-partitions-checkbox" aria-label="aws glue compare partitions checkbox" /> Compare partitions</label>
      </div>
      <div class="grid-2 mb-3">
        <div><label  class="field-label" for="a11y-aws-job-name-optional-2">Job Name (optional)</label><input x-model="awsGlueJobName" class="field-input" data-testid="aws-glue-job-name-input" id="a11y-aws-job-name-optional-2" /></div>
      </div>
      <div class="flex gap-2 flex-wrap mb-3">
        <button @click="awsGlueCompareTables()" :disabled="awsGlueLoading || !awsConfigId || !awsGlueSourceDatabase || !awsGlueSourceTable || !awsGlueTargetDatabase || !awsGlueTargetTable" class="btn-primary" data-testid="aws-glue-compare-btn">Compare Glue Catalog Tables</button>
        <button @click="awsCreateGlueCatalogCompareJob()" :disabled="awsGlueLoading || !awsConfigId || !awsGlueSourceDatabase || !awsGlueSourceTable || !awsGlueTargetDatabase || !awsGlueTargetTable" class="btn-secondary" data-testid="aws-glue-create-job-btn">Create Glue Catalog Compare Job</button>
      </div>
      <div x-show="awsGlueError" class="bg-rose-50 border-rose-200 text-rose-700 border rounded-lg p-2 text-sm mb-3" data-testid="aws-glue-error" x-text="awsGlueError"></div>
      <div x-show="awsGlueResult" data-testid="aws-glue-result" class="text-sm">
        <div>Match: <strong x-text="awsGlueResult && awsGlueResult.match"></strong></div>
        <template x-if="awsGlueResult && awsGlueResult.diff">
          <div class="mt-2 space-y-1">
            <div>Missing columns: <span x-text="(awsGlueResult.diff.missing_columns || []).join(', ')"></span></div>
            <div>Extra columns: <span x-text="(awsGlueResult.diff.extra_columns || []).join(', ')"></span></div>
            <div>Type mismatches: <span x-text="(awsGlueResult.diff.type_mismatches || []).map(m => m.column + ': ' + m.expected_type + ' -> ' + m.actual_type).join(', ')"></span></div>
            <div x-show="awsGlueResult.diff.location_mismatch">Location mismatch</div>
            <div x-show="awsGlueResult.diff.format_mismatch">Format mismatch</div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <div x-show="awsService === 'athena'">
    <div class="card mb-4">
      <div class="flex items-center justify-between mb-3">
        <div class="font-semibold text-slate-700">Amazon Athena</div>
        <span class="badge badge-blue">Query</span>
      </div>

      <div class="grid-2 mb-3">
        <div>
          <label  class="field-label" for="a11y-aws-database-optional">Database (optional)</label>
          <input x-model="awsAthenaDatabase" class="field-input" placeholder="analytics" data-testid="aws-athena-database-input" id="a11y-aws-database-optional" />
        </div>
        <div>
          <label  class="field-label" for="a11y-aws-workgroup-optional">Workgroup (optional)</label>
          <input x-model="awsAthenaWorkgroup" class="field-input" placeholder="primary" data-testid="aws-athena-workgroup-input" id="a11y-aws-workgroup-optional" />
        </div>
      </div>

      <div class="mb-3">
        <label  class="field-label" for="a11y-aws-sql-query">SQL Query</label>
        <textarea x-model="awsAthenaQuery" rows="5" class="field-input" placeholder="select * from table limit 100" data-testid="aws-athena-query-input" id="a11y-aws-sql-query"></textarea>
      </div>

      <div class="mb-3">
        <label  class="field-label" for="a11y-aws-output-location">Output Location</label>
        <input x-model="awsAthenaOutputLocation" class="field-input" placeholder="s3://bucket/athena-results/" data-testid="aws-athena-output-location-input" id="a11y-aws-output-location" />
      </div>

      <div class="grid-2 mb-3">
        <div>
          <label  class="field-label" for="a11y-aws-max-rows-2">Max Rows</label>
          <input x-model="awsAthenaMaxRows" type="number" min="1" class="field-input" placeholder="100" data-testid="aws-athena-max-rows-input" id="a11y-aws-max-rows-2" />
        </div>
        <div>
          <label  class="field-label" for="a11y-aws-job-name-optional-3">Job Name (optional)</label>
          <input x-model="awsAthenaJobName" class="field-input" placeholder="auto-generated from database" data-testid="aws-athena-job-name-input" id="a11y-aws-job-name-optional-3" />
        </div>
      </div>

      <div class="grid-2 mb-3">
        <div>
          <label  class="field-label" for="a11y-aws-min-rows-assertion">Min Rows Assertion</label>
          <input x-model="awsAthenaMinRows" type="number" min="0" class="field-input" placeholder="0" data-testid="aws-athena-min-rows-input" id="a11y-aws-min-rows-assertion" />
        </div>
        <div>
          <label  class="field-label" for="a11y-aws-max-rows-assertion">Max Rows Assertion</label>
          <input x-model="awsAthenaMaxRowsAssert" type="number" min="0" class="field-input" placeholder="1000000" data-testid="aws-athena-max-rows-assert-input" id="a11y-aws-max-rows-assertion" />
        </div>
      </div>

      <div class="flex gap-2 flex-wrap mb-3">
        <button @click="awsAthenaRunQuery()" :disabled="awsAthenaLoading || !awsConfigId || !awsAthenaQuery || !awsAthenaOutputLocation" class="btn-primary" data-testid="aws-athena-run-query-btn">Run Athena Query</button>
        <button @click="awsCreateAthenaQueryJob()" :disabled="awsAthenaLoading || !awsConfigId || !awsAthenaQuery || !awsAthenaOutputLocation" class="btn-secondary" data-testid="aws-athena-create-job-btn">Create Athena Query Job</button>
      </div>

      <div x-show="awsAthenaLoading" class="text-muted mb-3" data-testid="aws-athena-loading">Running...</div>
      <div x-show="awsAthenaError" class="bg-rose-50 border-rose-200 text-rose-700 border rounded-lg p-2 text-sm mb-3" data-testid="aws-athena-error" x-text="awsAthenaError"></div>

      <div x-show="awsAthenaResult" data-testid="aws-athena-result" class="text-sm">
        <div class="flex gap-2 flex-wrap mb-2">
          <span>Status: <strong x-text="awsAthenaResult && awsAthenaResult.status && (awsAthenaResult.status.state || 'completed')"></strong></span>
          <span x-show="awsAthenaResult && awsAthenaResult.status && awsAthenaResult.status.query_execution_id">Execution ID: <strong x-text="awsAthenaResult && awsAthenaResult.status && awsAthenaResult.status.query_execution_id"></strong></span>
          <span>Rows: <strong x-text="awsAthenaResult && awsAthenaResult.results && awsAthenaResult.results.rows ? awsAthenaResult.results.rows.length : 0"></strong></span>
          <span x-show="awsAthenaResult && awsAthenaResult.execution_time_ms">Execution ms: <strong x-text="awsAthenaResult && awsAthenaResult.execution_time_ms"></strong></span>
        </div>
        <template x-if="awsAthenaResult && awsAthenaResult.dq_metrics">
          <pre class="bg-slate-50 rounded-lg p-2 overflow-x-auto" x-text="JSON.stringify(awsAthenaResult.dq_metrics, null, 2)"></pre>
        </template>
        <template x-if="awsAthenaResult && awsAthenaResult.results && awsAthenaResult.results.rows && awsAthenaResult.results.rows.length">
          <pre class="bg-slate-50 rounded-lg p-2 overflow-x-auto" x-text="JSON.stringify(awsAthenaResult.results.rows.slice(0, 10), null, 2)"></pre>
        </template>
      </div>
    </div>
  </div>
</div></template>
