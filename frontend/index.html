              <input readonly :value="badgeUrl(selectedRun.run_id)"
                     class="field-input text-xs py-1 flex-1 font-mono bg-slate-50" aria-label="input" />
              <button @click="copyBadgeUrl(selectedRun.run_id)" class="btn-secondary btn-sm text-xs px-2">Copy</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Per-test reconcile report -->
      <div class="card overflow-hidden">
        <template x-if="selectedResultCount() > 0">
          <div class="flex items-center gap-3 px-4 py-2 bg-indigo-50 border-b border-indigo-100">
            <span class="text-xs font-semibold text-indigo-700" x-text="'Selected: ' + selectedResultCount() + ' tests'"></span>
            <div class="flex gap-2 ml-auto">
              <button @click="openBulkDecisionForm('bulk-accept')"
                      class="btn-accept-confirm text-xs px-3 py-1.5">Accept all mismatches</button>
              <button @click="openBulkDecisionForm('bulk-override')"
                      class="btn-primary btn-sm text-xs">Pass with actions (bulk)</button>
              <button @click="clearResultSelection()" class="btn-secondary btn-sm text-xs">Clear</button>
            </div>
          </div>
        </template>
        <table class="data-table" aria-label="history table 1">
          <thead>
            <tr>
              <th class="w-10" scope="col">
                <input type="checkbox" @change="$el.checked ? selectAllResults() : deselectAllResults()"
                       :checked="selectedResultCount() === selectedRun.results.length && selectedRun.results.length  aria-label="input"> 0" />
              </th>
              <th scope="col">Test Name</th>
              <th scope="col">Status</th>
              <th scope="col">Duration</th>
              <th scope="col">Files</th>
              <th scope="col">Src Rows</th>
              <th scope="col">Tgt Rows</th>
              <th scope="col">Mismatches</th>
              <th scope="col"></th>
            </tr>
          </thead>
          <template x-for="r in selectedRun.results" :key="r.id">
            <tbody>
              <tr>
                  <td class="font-mono text-xs" x-text="r.query_name"></td>
                  <td>
                    <span class="badge" :class="statusBadgeClass(r.effective_status || r.status)" x-text="r.effective_status || r.status"></span>
                    <span x-show="r.override_reason" class="text-xs text-amber-500 block mt-1">Original: <span x-text="r.status"></span></span>
                  </td>
                  <td x-text="r.duration_seconds != null ? r.duration_seconds.toFixed(2)+'s' : '—'"></td>
                  <td class="font-mono text-xs" x-text="((r.source_file_name || selectedRun.file_name_a) || (r.target_file_name || selectedRun.file_name_b)) ? ((r.source_file_name || selectedRun.file_name_a) || 'N/A') + ' → ' + ((r.target_file_name || selectedRun.file_name_b) || 'N/A') : '—'"></td>
                  <td x-text="r.source_row_count ?? '—'"></td>
                  <td x-text="r.target_row_count ?? '—'"></td>
                  <td>
                    <span :class="totalMismatches(r) > 0 ? 'text-rose-600 font-bold' : 'text-slate-400'"
                          x-text="totalMismatches(r)"></span>
                    <div x-show="totalMismatches(r) > 0"
                         class="text-xs text-slate-400"
                         x-text="mismatchBreakdownText(r)"></div>
                  </td>
                  <td class="flex gap-2 items-center">
                    <button x-show="totalMismatches(r) > 0"
                            @click="toggleMismatchExpand(selectedRun.run_id, r)"
                            :class="expandedMismatches[r.id] !== undefined ? 'text-slate-400' : 'text-indigo-500'"
                            class="hover:underline text-xs">
                      <span x-text="expandedMismatches[r.id] !== undefined ? '▲ Collapse' : (expandingMismatch[r.id] ? '…' : '▼ Expand')"></span>
                    </button>
                    <button x-show="r.sample_rows && r.sample_rows.length > 0"
                            @click="toggleSampleRowsExpand(r.id)"
                            :class="expandedSampleRows[r.id] ? 'text-slate-400' : 'text-indigo-500'"
                            class="hover:underline text-xs">
                      <span x-text="(expandedSampleRows[r.id] ? '▲ Hide' : '▼ View') + ' read rows'"></span>
                    </button>
                    <button x-show="r.status === 'FAILED' && !r.override_reason"
                            @click="toggleOutcomeOverrideForm(r.id)"
                            class="text-emerald-500 hover:underline text-xs">Pass with actions</button>
                    <button x-show="r.override_reason"
                            @click="removeOutcomeOverride(selectedRun.run_id, r)"
                            class="text-amber-500 hover:underline text-xs">Remove pass</button>
                  </td>
                </tr>
                <tr x-show="outcomeOverrideForms[r.id]?.open || r.override_reason">
                  <td colspan="8" class="px-4 py-3 bg-amber-50">
                    <template x-if="r.override_reason">
                      <div class="text-xs">
                        <strong>Agreed actions:</strong> <span x-text="r.override_reason"></span>
                        <span class="text-muted ml-2" x-text="r.overridden_by ? 'by ' + r.overridden_by : ''"></span>
                      </div>
                    </template>
                    <template x-if="outcomeOverrideForms[r.id]?.open">
                      <div class="flex gap-2 items-start">
                        <textarea x-model="outcomeOverrideForms[r.id].reason" maxlength="4000" rows="2"
                                  class="field-input flex-1" placeholder="Describe the agreed actions required to accept this failed outcome" aria-label="describe the agreed actions required to accept this failed outcome"></textarea>
                        <button @click="passWithAgreedActions(selectedRun.run_id, r)"
                                :disabled="outcomeOverrideForms[r.id].saving"
                                class="btn-primary btn-sm">Save pass</button>
                        <button @click="toggleOutcomeOverrideForm(r.id)" class="btn-secondary btn-sm">Cancel</button>
                      </div>
                    </template>
                  </td>
                </tr>
                <!-- Error row -->
                <tr x-show="r.error_message">
                  <td colspan="8" class="font-mono text-xs bg-rose-50 text-rose-700 px-4 py-2" x-text="r.error_message"></td>
                </tr>
                <!-- Inline mismatch diff rows -->
                <template x-if="expandedMismatches[r.id] !== undefined">
                  <tr>
                    <td colspan="8" class="p-0">
                      <div class="mismatch-expand-panel">
                        <div class="mismatch-expand-header">
                          <span x-text="'Mismatch details - ' + detailRowsLabel(expandedMismatches[r.id], r)"></span>
                          <span x-show="totalMismatches(r) > 0"
                                class="text-xs text-slate-400 ml-2"
                                x-text="mismatchBreakdownText(r)"></span>
                        </div>
                        <table class="mismatch-diff-table" aria-label="history table 2">
                          <thead>
                            <tr>
                              <th scope="col">Type</th>
                              <th scope="col">Row Key</th>
                              <th scope="col">Column</th>
                              <th scope="col">Source Value</th>
                              <th scope="col">Target Value</th>
                              <th scope="col">Delta</th>
                              <th scope="col">Decision</th>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-if="expandedMismatches[r.id].length === 0">
                              <tr><td colspan="8" class="text-muted text-center py-3">No mismatch rows stored</td></tr>
                            </template>
                            <!-- Rendering matches the HTML report, the Compare tab and the
                                 Differences Explorer: red marks the side that is wrong, not
                                 the side a value came from, so this table and the report
                                 downloaded beside it read the same. Only a decision
                                 (accepted) tints the row. See features/diff-render.js. -->
                            <template x-for="m in expandedMismatches[r.id]" :key="m.id">
                              <tr :class="m.accepted ? 'diff-accepted' : ''">
                                <td><span class="badge" :class="isPresenceType(m.mismatch_type) ? 'badge-rose' : 'badge-amber'" x-text="m.mismatch_type || 'value'"></span></td>
                                <td class="font-mono text-xs" x-text="m.key_values ? JSON.stringify(m.key_values) : '—'"></td>
                                <td class="font-mono text-xs" x-text="m.column_name || '—'"></td>
                                <td class="font-mono text-xs" x-html="renderSrc(m.source_value, m.target_value, m.mismatch_type)"></td>
                                <td class="font-mono text-xs" x-html="renderTgt(m.source_value, m.target_value, m.mismatch_type)"></td>
                                <td class="text-xs font-mono" x-text="m.delta != null ? (m.delta > 0 ? '+' : '') + m.delta.toFixed(4) : '—'"></td>
                                <td>
                                  <template x-if="m.accepted">
                                    <span class="accepted-badge">Accepted</span>
                                  </template>
                                  <template x-if="!m.accepted">
                                    <div>
                                      <button @click="toggleAcceptForm(m.id)" class="btn-accept-sm">Accept</button>
                                      <template x-if="acceptForms[m.id]?.open">
                                        <div class="accept-form-inline">
                                          <input x-model="acceptForms[m.id].note" class="accept-note-input" placeholder="Reason" aria-label="reason" />
                                          <button @click="submitAccept(selectedRun.run_id, r.id, m.id)" class="btn-accept-confirm">Save</button>
                                          <button @click="toggleAcceptForm(m.id)" class="btn-cancel-sm">Cancel</button>
                                        </div>
                                      </template>
                                    </div>
                                  </template>
                                </td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                        <template x-if="expandedMismatches[r.id] && expandedMismatches[r.id].length > 0 && expandedMismatches[r.id].length % 50 === 0">
                          <div class="flex justify-center mt-2">
                            <button @click="loadMoreInlineMismatches(selectedRun.run_id, r)"
                                    :disabled="expandingMismatch[r.id]"
                                    class="btn-secondary btn-sm text-xs">
                              <span x-show="!expandingMismatch[r.id]">Load More</span>
                              <span x-show="expandingMismatch[r.id]">Loading…</span>
                            </button>
                          </div>
                        </template>
                        <!-- Complete column statistics -->
                        <div class="px-3 py-2 border-t border-slate-100 mt-2">
                          <div class="flex items-center justify-between gap-2 mb-2">
                            <div class="text-xs text-muted font-semibold">All columns</div>
                            <input x-model="columnStatFilters[columnStatKey('history', r)]"
                                   class="field-input text-xs py-1 max-w-48"
                                   placeholder="Filter columns" aria-label="filter columns" />
                          </div>
                          <div class="overflow-auto max-h-48 border border-slate-100 rounded">
                            <table class="mismatch-diff-table" aria-label="history table 3">
                              <thead>
                                <tr>
                                  <th @click="setColumnStatSort('history', r, 'column')" class="cursor-pointer" scope="col" tabindex="0" role="button" @keydown.enter="$el.click()" @keydown.space.prevent="$el.click()">Column</th>
                                  <th @click="setColumnStatSort('history', r, 'mismatch_count')" class="cursor-pointer" scope="col" tabindex="0" role="button" @keydown.enter="$el.click()" @keydown.space.prevent="$el.click()">Mismatches</th>
                                  <th @click="setColumnStatSort('history', r, 'compared_rows')" class="cursor-pointer" scope="col" tabindex="0" role="button" @keydown.enter="$el.click()" @keydown.space.prevent="$el.click()">Compared</th>
                                  <th @click="setColumnStatSort('history', r, 'match_pct')" class="cursor-pointer" scope="col" tabindex="0" role="button" @keydown.enter="$el.click()" @keydown.space.prevent="$el.click()">Match %</th>
                                </tr>
                              </thead>
                              <tbody>
                                <template x-if="!r.column_stats || !r.column_stats.length">
                                  <tr><td colspan="4" class="text-muted text-center py-2">No column statistics available</td></tr>
                                </template>
                                <template x-for="stat in columnStatsFor(r, 'history')" :key="stat.column">
                                  <tr>
                                    <td class="font-mono text-xs" x-text="stat.column"></td>
                                    <td class="font-semibold text-rose-600" x-text="stat.mismatch_count"></td>
                                    <td x-text="stat.compared_rows"></td>
                                    <td x-text="matchPctText(stat.match_pct)"></td>
                                  </tr>
                                </template>
                              </tbody>
                            </table>
                          </div>
                        </div>
                        <!-- Segment breakdown (stored at run time) -->
                        <template x-if="r.segment_summary">
                          <div class="px-3 py-2 border-t border-slate-100 mt-2">
                            <div class="text-xs text-muted font-semibold mb-1">Stored detail rows by segment</div>
                            <template x-for="[segCol, buckets] in Object.entries(r.segment_summary || {})" :key="segCol">
                              <div class="mb-2">
                                <div class="flex items-center gap-2 mb-1">
                                  <span class="text-xs font-mono text-indigo-600" x-text="segCol"></span>
                                  <button @click="loadSegmentDrill(selectedRun.run_id, r, segCol)"
                                          :disabled="isSegDrillBusy(r, segCol)"
                                          class="text-indigo-500 hover:underline text-xs ml-auto">
                                    <span x-show="!segmentDrillLoading[r.id + ':' + segCol]">🔄 Re-query now</span>
                                    <span x-show="segmentDrillLoading[r.id + ':' + segCol]">Loading…</span>
                                  </button>
                                </div>
                                <template x-for="b in buckets" :key="b.value">
                                  <div class="flex items-center gap-2 text-xs py-0.5">
                                    <span class="font-mono w-28 truncate" x-text="b.value"></span>
                                    <div class="flex-1 bg-slate-100 rounded h-2 max-w-56">
                                      <div class="h-2 rounded bg-rose-400"
                                           :style="'width:' + Math.min(100, 100 * b.mismatch_count / segmentMax(buckets)) + '%'"></div>
                                    </div>
                                    <span class="text-slate-500 font-semibold" x-text="b.mismatch_count + 'x'"></span>
                                    <span class="text-muted" x-text="'(' + b.pct_of_total + '%)'"></span>
                                  </div>
                                </template>
                                <template x-if="segmentDrill[r.id + ':' + segCol]">
                                  <div class="mt-1 pl-2 border-l-2 border-indigo-200">
                                    <div class="text-xs text-muted mb-0.5">Live counts (source vs target)</div>
                                    <template x-for="row in segmentDrill[r.id + ':' + segCol]" :key="row.value">
                                      <div class="flex items-center gap-2 text-xs py-0.5">
                                        <span class="font-mono w-28 truncate" x-text="row.value"></span>
                                        <span class="text-slate-600" x-text="row.source_count"></span>
                                        <span class="text-muted">vs</span>
                                        <span class="text-slate-600" x-text="row.target_count"></span>
                                        <span class="font-semibold"
                                              :class="row.delta === 0 ? 'text-emerald-600' : 'text-rose-500'"
                                              x-text="(row.delta > 0 ? '+' : '') + row.delta"></span>
                                      </div>
                                    </template>
                                  </div>
                                </template>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </td>
                  </tr>
                </template>
                <!-- Sample of rows actually read from the source -->
                <template x-if="expandedSampleRows[r.id]">
                  <tr>
                    <td colspan="8" class="p-0">
                      <div class="mismatch-expand-panel">
                        <div class="mismatch-expand-header">
                          <span x-text="'Rows read from source — showing ' + (r.sample_rows || []).length + ' of ' + (r.source_row_count ?? (r.sample_rows || []).length)"></span>
                        </div>
                        <table class="mismatch-diff-table" aria-label="history table 4">
                          <thead>
                            <tr>
                              <template x-for="col in sampleRowColumns(r.sample_rows)" :key="col">
                                <th x-text="col" scope="col"></th>
                              </template>
                            </tr>
                          </thead>
                          <tbody>
                            <template x-if="!r.sample_rows || r.sample_rows.length === 0">
                              <tr><td :colspan="Math.max(sampleRowColumns(r.sample_rows).length, 1)" class="text-muted text-center py-3">No rows stored</td></tr>
                            </template>
                            <template x-for="(row, idx) in (r.sample_rows || [])" :key="idx">
                              <tr>
                                <template x-for="col in sampleRowColumns(r.sample_rows)" :key="col">
                                  <td class="font-mono text-xs" x-text="row[col] ?? '∅'"></td>
                                </template>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </td>
                  </tr>
                </template>
            </tbody>
          </template>
        </table>
      </div>
    </div>
  </template>

  <!-- History list / trends / lineage -->
  <template x-if="!selectedRun">
    <div>
      <!-- Sub-tab switcher -->
      <div class="flex gap-1 mb-4 border-b border-slate-200 pb-2">
        <button @click="historySubTab='runs'" :class="historySubTab==='runs' ? 'text-indigo-600 border-b-2 border-indigo-600 pb-2 -mb-2' : 'text-slate-500'" class="px-3 py-1 text-sm font-medium" data-testid="history-subtab-runs">Runs</button>
        <button @click="historySubTab='trends'; if(!trendsData && trendsJobName) loadTrends()" :class="historySubTab==='trends' ? 'text-indigo-600 border-b-2 border-indigo-600 pb-2 -mb-2' : 'text-slate-500'" class="px-3 py-1 text-sm font-medium" data-testid="history-subtab-trends">Trends</button>
        <button @click="historySubTab='lineage'; loadLineage()" :class="historySubTab==='lineage' ? 'text-indigo-600 border-b-2 border-indigo-600 pb-2 -mb-2' : 'text-slate-500'" class="px-3 py-1 text-sm font-medium" data-testid="history-subtab-lineage">Lineage</button>
        <button @click="historySubTab='audit'; loadAudit()" :class="historySubTab==='audit' ? 'text-indigo-600 border-b-2 border-indigo-600 pb-2 -mb-2' : 'text-slate-500'" class="px-3 py-1 text-sm font-medium" data-testid="history-subtab-audit">Audit</button>
        <button @click="historySubTab='profile'; loadProfile()" :class="historySubTab==='profile' ? 'text-indigo-600 border-b-2 border-indigo-600 pb-2 -mb-2' : 'text-slate-500'" class="px-3 py-1 text-sm font-medium" data-testid="history-subtab-profile">Profile</button>
        <button @click="historySubTab='schema'; loadSchemaHistory()" :class="historySubTab==='schema' ? 'text-indigo-600 border-b-2 border-indigo-600 pb-2 -mb-2' : 'text-slate-500'" class="px-3 py-1 text-sm font-medium" data-testid="history-subtab-schema">Schema</button>
        <button @click="historySubTab='coverage'; loadCoverage()" :class="historySubTab==='coverage' ? 'text-indigo-600 border-b-2 border-indigo-600 pb-2 -mb-2' : 'text-slate-500'" class="px-3 py-1 text-sm font-medium" data-testid="history-subtab-coverage">Coverage</button>
      </div>

      <!-- Trends panel -->
      <div x-show="historySubTab==='trends'">
        <div class="card mb-4">
          <div class="font-semibold text-slate-700 mb-3">Metric Trends</div>
          <div class="grid grid-cols-3 gap-3 mb-3">
            <div>
              <label  class="field-label" for="a11y-history-job-name">Job Name</label>
              <select x-model="trendsJobName" class="field-input field-select" id="a11y-history-job-name">
                <option value="">— Select job —</option>
                <template x-for="job in jobs" :key="job.name">
                  <option :value="job.name" x-text="job.name"></option>
                </template>
              </select>
            </div>
            <div>
              <label  class="field-label" for="a11y-history-metric">Metric</label>
              <select x-model="trendsMetric" class="field-input field-select" id="a11y-history-metric">
                <option value="mismatch_rate">mismatch_rate</option>
                <option value="row_count_delta">row_count_delta</option>
                <option value="duration_seconds">duration_seconds</option>
                <option value="total_issues">total_issues</option>
              </select>
            </div>
            <div>
              <label  class="field-label" for="a11y-history-window-days">Window (days)</label>
              <input x-model="trendsWindow" type="number" min="7" max="365" class="field-input" id="a11y-history-window-days" />
            </div>
          </div>
          <button @click="loadTrends()" :disabled="!trendsJobName || trendsLoading" class="btn-primary btn-sm mb-3">
            <span x-show="!trendsLoading">Load Trends</span>
            <span x-show="trendsLoading">Loading…</span>
          </button>
          <template x-if="trendsData">
            <div>
              <div class="flex items-center gap-3 mb-2">
                <span class="text-muted text-sm" x-text="trendsData.points.length + ' data points'"></span>
                <template x-if="trendsData.drift_detected">
                  <span class="badge badge-rose text-xs">⚠ Drift detected</span>
                </template>
              </div>
              <div style="position:relative;height:200px">
                <canvas id="trendsChart"></canvas>
              </div>
            </div>
          </template>
          <template x-if="trendsData && trendsData.points.length === 0">
            <div class="empty-state py-4">
              <div class="empty-state-title">No data for selected job/window</div>
            </div>
          </template>
        </div>
      </div>

      <!-- Lineage panel -->
      <div x-show="historySubTab==='lineage'">
        <div class="card mb-4">
          <div class="flex items-center justify-between mb-3">
            <div class="font-semibold text-slate-700">Job Dependency Graph</div>
            <button @click="loadLineage()" class="btn-secondary btn-sm" :disabled="lineageLoading">
              <span x-show="!lineageLoading">↻ Refresh</span>
              <span x-show="lineageLoading">Loading…</span>
            </button>
          </div>
          <template x-if="lineageGraph && lineageGraph.nodes.length > 0">
            <div class="overflow-auto" x-html="lineageSvg()"></div>
          </template>
          <template x-if="!lineageGraph || lineageGraph.nodes.length === 0">
            <div class="empty-state py-8">
              <div class="empty-state-icon">🔗</div>
              <div class="empty-state-title">No job dependencies configured</div>
              <div class="empty-state-sub">Add <code>depends_on</code> to jobs to see their lineage here</div>
            </div>
          </template>
        </div>
      </div>

      <!-- Audit panel -->
      <div x-show="historySubTab==='audit'">
        <div class="card mb-4">
          <div class="flex flex-wrap gap-2 items-end mb-3">
            <div>
              <label  class="field-label" for="a11y-history-resource-type">Resource Type</label>
              <input x-model="auditFilterResourceType" class="field-input" placeholder="run, job, config" id="a11y-history-resource-type" />
            </div>
            <div>
              <label  class="field-label" for="a11y-history-resource-id">Resource ID</label>
              <input x-model="auditFilterResourceId" class="field-input" placeholder="optional" id="a11y-history-resource-id" />
            </div>
            <button @click="loadAudit()" :disabled="auditLoading" class="btn-secondary btn-sm">
              <span x-show="!auditLoading">Refresh</span>
              <span x-show="auditLoading">Loading...</span>
            </button>
          </div>
          <template x-if="auditEvents.length === 0 && !auditLoading">
            <div class="empty-state py-6">
              <div class="empty-state-title">No audit events found</div>
            </div>
          </template>
          <template x-if="auditEvents.length > 0">
            <div class="overflow-auto">
              <table class="data-table" aria-label="history table 5">
                <thead>
                  <tr>
                    <th scope="col">Time</th>
                    <th scope="col">Actor</th>
                    <th scope="col">Action</th>
                    <th scope="col">Resource</th>
                    <th scope="col">Diff</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="event in auditEvents" :key="event.id">
                    <tr>
                      <td class="text-muted" x-text="fmtDate(event.created_at)"></td>
                      <td class="font-mono text-xs" x-text="event.actor || '-'"></td>
                      <td><span class="badge badge-blue text-xs" x-text="event.action"></span></td>
                      <td class="font-mono text-xs" x-text="event.resource_type + (event.resource_id ? ':' + event.resource_id : '')"></td>
                      <td class="font-mono text-xs" x-text="event.diff ? JSON.stringify(event.diff) : ''"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
        </div>
      </div>

      <!-- Profile panel -->
      <div x-show="historySubTab==='profile'">
        <div class="card mb-4">
          <div class="font-semibold text-slate-700 mb-3">Column Profile</div>
          <div class="flex flex-wrap gap-2 items-end mb-3">
            <div>
              <label  class="field-label" for="a11y-history-job-name-2">Job Name</label>
              <select x-model="profileJobName" class="field-input field-select" id="a11y-history-job-name-2">
                <option value="">— Select job —</option>
                <template x-for="job in jobs" :key="job.name">
                  <option :value="job.name" x-text="job.name"></option>
                </template>
              </select>
            </div>
            <button @click="loadProfile()" :disabled="!profileJobName || profileLoading" class="btn-primary btn-sm">
              <span x-show="!profileLoading">Load Profile</span>
              <span x-show="profileLoading">Loading…</span>
            </button>
            <button x-show="profileJobName" @click="suggestDQRules()" :disabled="profileLoading" class="btn-secondary btn-sm">✨ Suggest DQ Rules</button>
          </div>
          <template x-if="profileData && profileData.length === 0">
            <div class="empty-state py-4"><div class="empty-state-title">No profile data — run a profile job first</div></div>
          </template>
          <template x-if="profileData && profileData.length > 0">
            <div class="overflow-auto">
              <table class="data-table" aria-label="history table 6">
                <thead>
                  <tr>
                    <th scope="col">Column</th>
                    <th scope="col">Null Rate</th>
                    <th scope="col">Distinct</th>
                    <th scope="col">Min</th>
                    <th scope="col">Max</th>
                    <th scope="col">Mean</th>
                    <th scope="col">Std Dev</th>
                    <th scope="col">p25</th>
                    <th scope="col">p50</th>
                    <th scope="col">p75</th>
                    <th scope="col">p95</th>
                    <th scope="col">Captured</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="col in profileData" :key="col.column_name">
                    <tr>
                      <td class="font-mono text-xs font-semibold" x-text="col.column_name"></td>
                      <td x-text="col.null_rate != null ? (col.null_rate * 100).toFixed(1) + '%' : '—'"></td>
                      <td x-text="col.distinct_count ?? '—'"></td>
                      <td class="font-mono text-xs" x-text="col.min_val ?? '—'"></td>
                      <td class="font-mono text-xs" x-text="col.max_val ?? '—'"></td>
                      <td class="font-mono text-xs" x-text="col.mean_val != null ? Number(col.mean_val).toFixed(4) : '—'"></td>
                      <td class="font-mono text-xs" x-text="col.std_val != null ? Number(col.std_val).toFixed(4) : '—'"></td>
                      <td class="font-mono text-xs" x-text="col.p25 ?? '—'"></td>
                      <td class="font-mono text-xs" x-text="col.p50 ?? '—'"></td>
                      <td class="font-mono text-xs" x-text="col.p75 ?? '—'"></td>
                      <td class="font-mono text-xs" x-text="col.p95 ?? '—'"></td>
                      <td class="text-muted text-xs" x-text="fmtDate(col.captured_at)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
          <template x-if="suggestedRules && suggestedRules.length > 0">
            <div class="mt-4 border-t border-slate-100 pt-3">
              <div class="text-xs font-semibold text-slate-600 mb-2">Suggested DQ Rules</div>
              <pre class="bg-slate-50 rounded p-3 text-xs font-mono overflow-auto max-h-48" x-text="JSON.stringify(suggestedRules, null, 2)"></pre>
            </div>
          </template>
        </div>
      </div>

      <!-- Schema History panel -->
      <div x-show="historySubTab==='schema'">
        <div class="card mb-4">
          <div class="font-semibold text-slate-700 mb-3">Schema Snapshot History</div>
          <div class="flex flex-wrap gap-2 items-end mb-3">
            <div>
              <label  class="field-label" for="a11y-history-job-name-3">Job Name</label>
              <select x-model="schemaJobName" class="field-input field-select" id="a11y-history-job-name-3">
                <option value="">— Select job —</option>
                <template x-for="job in jobs" :key="job.name">
                  <option :value="job.name" x-text="job.name"></option>
                </template>
              </select>
            </div>
            <div>
              <label  class="field-label" for="a11y-history-environment">Environment</label>
              <select x-model="schemaEnvironment" class="field-input field-select" id="a11y-history-environment">
                <option value="source">source</option>
                <option value="target">target</option>
                <option value="both">both</option>
              </select>
            </div>
            <button @click="loadSchemaHistory()" :disabled="!schemaJobName || schemaLoading" class="btn-primary btn-sm">
              <span x-show="!schemaLoading">Load History</span>
              <span x-show="schemaLoading">Loading…</span>
            </button>
          </div>
          <template x-if="schemaHistory && schemaHistory.length === 0">
            <div class="empty-state py-4"><div class="empty-state-title">No schema snapshots — run a schema_snapshot job first</div></div>
          </template>
          <template x-if="schemaHistory && schemaHistory.length > 0">
            <div class="space-y-3">
              <template x-for="snap in schemaHistory" :key="snap.id">
                <div class="border border-slate-200 rounded p-3">
                  <div class="flex items-center gap-3 mb-2">
                    <span class="font-mono text-xs text-muted" x-text="fmtDate(snap.captured_at)"></span>
                    <span class="badge badge-blue text-xs" x-text="snap.environment"></span>
                    <span class="text-xs text-muted">Run: <span class="font-mono" x-text="snap.run_id"></span></span>
                  </div>
                  <template x-if="snap.diff && (snap.diff.added?.length || snap.diff.removed?.length || snap.diff.changed?.length)">
                    <div class="text-xs space-y-1 mb-2">
                      <template x-if="snap.diff.added?.length">
                        <div class="text-emerald-600">+ Added: <span x-text="snap.diff.added.join(', ')"></span></div>
                      </template>
                      <template x-if="snap.diff.removed?.length">
                        <div class="text-rose-600">- Removed: <span x-text="snap.diff.removed.join(', ')"></span></div>
                      </template>
                      <template x-if="snap.diff.changed?.length">
                        <div class="text-amber-600">~ Changed: <span x-text="snap.diff.changed.join(', ')"></span></div>
                      </template>
                    </div>
                  </template>
                  <div class="flex flex-wrap gap-1">
                    <template x-for="col in (snap.columns || [])" :key="col.name">
                      <span class="bg-slate-100 text-slate-600 text-xs font-mono px-1.5 py-0.5 rounded" x-text="col.name + ' (' + col.dtype + ')'"></span>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>

      <!-- Coverage sub-tab -->
      <div x-show="historySubTab==='coverage'">
        <div class="flex items-center gap-4 mb-3">
          <template x-if="coverageData">
            <div class="text-sm text-muted">
              <span x-text="coverageData.summary.tables"></span> tables ·
              <span x-text="coverageData.summary.columns"></span> columns ·
              <span class="text-emerald-600 font-semibold" x-text="coverageData.summary.tested_pct + '% tested'"></span> ·
              <span class="text-amber-600" x-text="coverageData.summary.observed_pct + '% observed only'"></span>
            </div>
          </template>
          <label class="flex items-center gap-1 text-xs text-muted ml-auto">
            <input type="checkbox" x-model="coverageGapsOnly" aria-label="coveragegapsonly"> Gaps only
          </label>
          <button @click="coverageData=null; loadCoverage()" class="btn-secondary btn-sm text-xs">Refresh</button>
        </div>
        <div x-show="coverageLoading" class="text-muted text-sm">Loading…</div>
        <template x-if="coverageData && coverageData.tables.length === 0">
          <div class="text-muted text-sm">No coverage data yet — save jobs with SQL queries first.</div>
        </template>
        <template x-for="t in (coverageData?.tables || [])" :key="t.table">
          <div class="mb-4 border border-slate-200 rounded-lg overflow-hidden">
            <div class="px-3 py-2 bg-slate-50 flex items-center gap-3">
              <span class="font-mono font-semibold text-sm" x-text="t.table"></span>
              <span class="text-xs text-muted" x-text="t.job_count + ' job(s)'"></span>
              <span class="ml-auto text-xs font-semibold"
                    :class="t.tested_pct >= 70 ? 'text-emerald-600' : (t.tested_pct >= 30 ? 'text-amber-600' : 'text-rose-600')"
                    x-text="t.tested_pct + '% tested'"></span>
            </div>
            <div class="px-3 py-2 flex flex-wrap gap-1">
              <template x-for="c in coverageColumns(t)" :key="c.column">
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-mono"
                      :class="coverageLevelClass(c.level)"
                      :title="'jobs: ' + c.jobs.join(', ') + (c.rules.length ? ' | rules: ' + c.rules.join(', ') : '')">
                  <span x-text="c.column"></span>
                </span>
              </template>
              <span x-show="coverageColumns(t).length === 0" class="text-xs text-muted">No gaps 🎉</span>
            </div>
          </div>
        </template>
        <!-- Flaky tests -->
        <template x-if="flakyData && flakyData.length > 0">
          <div class="mt-6">
            <div class="text-sm font-semibold mb-2">Flaky tests (last 20 runs)</div>
            <template x-for="f in flakyData" :key="f.query_name">
              <div class="flex items-center gap-3 text-xs py-1">
                <span class="font-mono w-48 truncate" x-text="f.query_name"></span>
                <div class="flex-1 bg-slate-100 rounded h-2 max-w-48">
                  <div class="h-2 rounded" :class="f.flaky ? 'bg-rose-500' : 'bg-amber-400'"
                       :style="'width:' + Math.min(100, f.score * 100) + '%'"></div>
                </div>
                <span class="font-semibold w-12" x-text="f.score"></span>
                <span class="text-muted" x-text="f.transitions + ' flips / ' + f.window + ' runs'"></span>
              </div>
            </template>
          </div>
        </template>
      </div>

      <!-- Runs list (default) -->
      <div x-show="historySubTab==='runs'">
      <div class="section-header mb-4">
        <div class="section-title">Run History</div>
        <div class="flex flex-wrap gap-2 items-center">
          <select x-model="historyFilterStatus" @change="loadRuns()" class="field-input field-select text-sm py-1" style="width:auto" data-testid="history-status-filter" aria-label="history status filter">
            <option value="">All statuses</option>
            <option value="PENDING">PENDING</option>
            <option value="RUNNING">RUNNING</option>
            <option value="COMPLETED">COMPLETED</option>
            <option value="FAILED">FAILED</option>
            <option value="ERROR">ERROR</option>
          </select>
          <select x-model="historyFilterRunType" @change="loadRuns()" class="field-input field-select text-sm py-1" style="width:auto" data-testid="history-runtype-filter" aria-label="history runtype filter">
            <option value="">All types</option>
            <option value="reconciliation">reconciliation</option>
            <option value="bo_comparison">bo_comparison</option>
          </select>
          <button @click="historyFilterStatus=''; historyFilterRunType=''; loadRuns()" class="btn-secondary btn-sm" data-testid="history-clear-btn">Clear</button>
          <button @click="loadRuns()" class="btn-secondary btn-sm" data-testid="history-refresh-btn">↻ Refresh</button>
          <button @click="compareMode = !compareMode; compareResult = null"
                  :class="compareMode ? 'btn-primary btn-sm' : 'btn-secondary btn-sm'">
            ⇄ Compare Runs
          </button>
        </div>
      </div>

      <!-- Compare panel -->
      <template x-if="compareMode">
        <div class="card mb-4">
          <div class="font-semibold text-slate-700 mb-3">Compare Two Runs</div>
          <div class="flex gap-3 mb-3 flex-wrap">
            <div class="flex-1" style="min-width:200px">
              <label  class="field-label" for="a11y-history-run-a-baseline">Run A (baseline)</label>
              <select x-model="compareRunA" class="field-input field-select" id="a11y-history-run-a-baseline">
                <option value="">— Select —</option>
                <template x-for="run in runs" :key="run.run_id">
                  <option :value="run.run_id"
                          x-text="runLabel(run) + ' [' + run.status + '] ' + fmtDate(run.started_at)">
                  </option>
                </template>
              </select>
            </div>
            <div class="flex-1" style="min-width:200px">
              <label  class="field-label" for="a11y-history-run-b-target">Run B (target)</label>
              <select x-model="compareRunB" class="field-input field-select" id="a11y-history-run-b-target">
                <option value="">— Select —</option>
                <template x-for="run in runs" :key="run.run_id">
                  <option :value="run.run_id"
                          x-text="runLabel(run) + ' [' + run.status + '] ' + fmtDate(run.started_at)">
                  </option>
                </template>
              </select>
            </div>
            <div class="flex items-end">
              <button @click="loadCompare()"
                      :disabled="!compareRunA || !compareRunB || compareLoading"
                      class="btn-primary">
                <span x-show="!compareLoading">Compare →</span>
                <span x-show="compareLoading">Loading…</span>
              </button>
            </div>
          </div>

          <!-- Compare result -->
          <template x-if="compareResult">
            <div>
              <!-- Summary chips -->
              <div class="flex gap-2 flex-wrap mb-3">
                <span class="compare-chip chip-improved">▲ Improved: <strong x-text="compareResult.summary.improved"></strong></span>
                <span class="compare-chip chip-regressed">▼ Regressed: <strong x-text="compareResult.summary.regressed"></strong></span>
                <span class="compare-chip chip-unchanged">— Unchanged: <strong x-text="compareResult.summary.unchanged"></strong></span>
                <template x-if="compareResult.summary.only_in_a > 0">
                  <span class="compare-chip chip-gray">Only in A: <strong x-text="compareResult.summary.only_in_a"></strong></span>
                </template>
                <template x-if="compareResult.summary.only_in_b > 0">
                  <span class="compare-chip chip-sky">Only in B: <strong x-text="compareResult.summary.only_in_b"></strong></span>
                </template>
              </div>

              <!-- Run headers -->
              <div class="compare-run-headers mb-2">
                <div class="compare-col-label">Test</div>
                <div class="compare-col-a">
                  <span class="font-mono text-xs" x-text="compareResult.run_a.run_id.substring(0,8)+'…'"></span>
                  <span class="badge ml-1" :class="statusBadgeClass(compareResult.run_a.status)" x-text="compareResult.run_a.status"></span>
                </div>
                <div class="compare-col-b">
                  <span class="font-mono text-xs" x-text="compareResult.run_b.run_id.substring(0,8)+'…'"></span>
                  <span class="badge ml-1" :class="statusBadgeClass(compareResult.run_b.status)" x-text="compareResult.run_b.status"></span>
                </div>
                <div class="compare-col-delta">Delta</div>
              </div>

              <!-- Comparison rows -->
              <div class="compare-table">
                <template x-for="t in compareResult.tests" :key="t.test_name">
                  <div class="compare-row" x-data="{ d: compareDelta(t) }"
                       :class="d.cls.includes('rose') ? 'compare-row-regressed' : d.cls.includes('green') ? 'compare-row-improved' : ''">
                    <div class="compare-col-label font-mono text-xs" x-text="t.test_name"></div>
                    <div class="compare-col-a">
                      <template x-if="t.status_a">
                        <span>
                          <span class="badge" :class="statusBadgeClass(t.status_a)" x-text="t.status_a"></span>
                          <span class="text-muted text-xs ml-1" x-text="t.duration_a != null ? t.duration_a.toFixed(2)+'s' : ''"></span>
                          <template x-if="t.mismatches_a > 0">
                            <span class="text-rose-500 text-xs ml-1" x-text="t.mismatches_a + ' mm'"></span>
                          </template>
                        </span>
                      </template>
                      <template x-if="!t.status_a"><span class="text-muted text-xs">—</span></template>
                    </div>
                    <div class="compare-col-b">
                      <template x-if="t.status_b">
                        <span>
                          <span class="badge" :class="statusBadgeClass(t.status_b)" x-text="t.status_b"></span>
                          <span class="text-muted text-xs ml-1" x-text="t.duration_b != null ? t.duration_b.toFixed(2)+'s' : ''"></span>
                          <template x-if="t.mismatches_b > 0">
                            <span class="text-rose-500 text-xs ml-1" x-text="t.mismatches_b + ' mm'"></span>
                          </template>
                        </span>
                      </template>
                      <template x-if="!t.status_b"><span class="text-muted text-xs">—</span></template>
                    </div>
                    <div class="compare-col-delta flex items-center gap-2">
                      <span :class="d.cls" x-text="d.label"></span>
                      <template x-if="t.result_id_b && t.mismatches_b > 0">
                        <button class="text-indigo-500 hover:underline text-xs"
                          @click="openMismatchDrawer(compareResult.run_b.run_id, { id: t.result_id_b, query_name: t.test_name })">
                          View →
                        </button>
                      </template>
                      <template x-if="t.result_id_a && !t.result_id_b && t.mismatches_a > 0">
                        <button class="text-indigo-500 hover:underline text-xs"
                          @click="openMismatchDrawer(compareResult.run_a.run_id, { id: t.result_id_a, query_name: t.test_name })">
                          View →
                        </button>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </template>

      <template x-if="runs.length === 0">
        <div class="card empty-state">
          <div class="empty-state-icon">📋</div>
          <div class="empty-state-title">No test runs yet</div>
        </div>
      </template>
      <div class="card overflow-hidden">
        <table class="data-table" aria-label="history table 7">
          <thead>
            <tr>
              <th scope="col">Run ID</th>
              <th scope="col">Report Name</th>
              <th scope="col">Status</th>
              <th scope="col">Environments</th>
              <th scope="col">Started</th>
              <th scope="col">P / F / S</th>
              <th scope="col"></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="run in runs" :key="run.run_id">
              <tr class="cursor-pointer" @click="viewRunDetail(run.run_id)" :data-testid="'history-run-row-' + run.run_id">
                <td class="text-xs text-slate-500">
                  <span x-text="runLabel(run)" :title="run.run_id"></span>
                  <span x-show="run.is_baseline" class="text-amber-500 ml-1" title="Baseline run">★</span>
                </td>
                <td class="text-xs font-mono text-slate-600" x-text="run.report_name" :data-testid="'history-run-report-name-' + run.run_id"></td>
                <td><span class="badge" :class="statusBadgeClass(run.status)" x-text="run.status"></span></td>
                <td class="text-muted" x-text="(run.source_env||'?') + ' → ' + (run.target_env||'?')"></td>
                <td class="text-muted" x-text="fmtDate(run.started_at)"></td>
                <td>
                  <span class="text-emerald-600 font-semibold" x-text="run.passed"></span> /
                  <span class="text-rose-600 font-semibold" x-text="run.failed"></span> /
                  <span class="text-amber-500 font-semibold" x-text="run.slow"></span>
                </td>
                <td class="flex gap-2">
                  <button @click.stop="viewRunDetail(run.run_id)" class="text-indigo-500 hover:underline text-xs" :aria-label="'View run ' + runLabel(run)">View →</button>
                  <button @click.stop="deleteRun(run.run_id)" class="text-rose-500 hover:underline text-xs" :aria-label="'Delete run ' + runLabel(run)">Delete</button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      </div><!-- end runs sub-tab -->
    </div>
  </template>
</div></template>


<!-- ====================================================================
     TAB 5 – ADAPTERS
     ==================================================================== -->
<template x-if="currentView === 'adapters'"><div>
  <div class="section-header">
    <div>
      <div class="section-title">Integration Hub</div>
      <div class="section-sub">Browse SAP BO reports, SAP Data Services jobs, and Automic jobs, then push to Job Catalog</div>
    </div>
  </div>

  <div class="grid-3 gap-6">

    <!-- SAP BO Panel -->
    <div>
      <div class="card mb-4">
        <div class="flex items-center justify-between mb-3">
          <div class="font-semibold text-slate-700">SAP BusinessObjects</div>
          <span class="badge badge-purple">RESTful SDK</span>
        </div>
        <div class="grid-2 mb-3">
          <div>
            <label  class="field-label" for="a11y-adapters-config">Config</label>
            <select x-model="boConfigId" class="field-input field-select" data-testid="bo-config-select" id="a11y-adapters-config">
              <option value="">— Select —</option>
              <template x-for="cfg in configs" :key="cfg.id">
                <option :value="cfg.id" x-text="cfg.name"></option>
              </template>
            </select>
          </div>
          <div class="flex items-end">
            <button @click="testBOConnection()" :disabled="!boConfigId || boTesting" class="btn-primary w-full" data-testid="bo-test-connection-btn">
              <span x-show="!boTesting">Test Connection</span>
              <span x-show="boTesting">Testing…</span>
            </button>
          </div>
        </div>
        <template x-if="boTestResult">
          <div :class="boTestResult.ok ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-rose-50 border-rose-200 text-rose-700'"
               class="border rounded-lg p-2 text-sm mb-3" data-testid="bo-test-result">
            <span x-text="boTestResult.ok ? '✓ ' + boTestResult.message : '✗ ' + boTestResult.message"></span>
            <span x-show="boTestResult.latency_ms" class="text-muted ml-2" x-text="boTestResult.latency_ms + 'ms'"></span>
          </div>
        </template>
        <button @click="loadBODocuments()" :disabled="!boConfigId || boLoading" class="btn-secondary w-full">
          <span x-show="!boLoading">Browse Documents</span>
          <span x-show="boLoading">Loading…</span>
        </button>
      </div>

      <!-- Document tree -->
      <div class="card" x-show="boDocs.length > 0">
        <div class="flex items-center justify-between mb-3">
          <div class="font-semibold text-slate-700">
            Documents (<span x-text="filteredBODocs.length"></span><template x-if="filteredBODocs.length !== boDocs.length"><span> of <span x-text="boDocs.length"></span></span></template>)
          </div>
        </div>
        <div class="mb-3">
          <input x-model="boFilterQuery" class="field-input" placeholder="Search documents and reports…"
                 data-testid="bo-doc-search-input" aria-label="search documents and reports" />
          <p class="text-xs text-muted mt-1">Matches document name/folder/id, and report names once a document has been expanded.</p>
        </div>
        <div class="mb-3">
          <label  class="field-label" for="a11y-adapters-ran-on-date">Ran on date</label>
          <input type="date" x-model="boRanOnDate" @change="loadBORanOnDocIds()" class="field-input"
                 data-testid="bo-doc-ran-on-input" id="a11y-adapters-ran-on-date" />
          <template x-if="boRanOnDate && !boRanOnSupported">
            <p class="text-xs text-rose-600 mt-1">Run-date filtering isn't available against this SAP BO server.</p>
          </template>
        </div>
        <template x-if="(boFilterQuery.trim() || boRanOnDocIds) && filteredBODocs.length === 0">
          <div class="text-muted text-sm px-3 py-2">
            <span x-show="boFilterQuery.trim()">No documents or loaded reports match "<span x-text="boFilterQuery"></span>"</span>
            <span x-show="!boFilterQuery.trim() && boRanOnDocIds">No documents ran on <span x-text="boRanOnDate"></span></span>
          </div>
        </template>
        <div class="space-y-1">
          <template x-for="(doc, boDocIdx) in filteredBODocs" :key="doc.id ? 'doc-' + doc.id : 'doc-idx-' + boDocIdx">
            <div>
              <div class="bo-doc-item flex items-center justify-between px-3 py-2"
                   @click="toggleBODoc(doc)">
                <div class="flex items-center gap-2">
                  <span x-text="expandedBODocs.includes(doc.id) ? '▾' : '▸'" class="text-slate-400 w-3"></span>
                  <span class="font-medium text-sm" x-html="highlightMatch(doc.name, boFilterQuery)"></span>
                  <span class="badge badge-gray text-xs" x-html="highlightMatch(doc.folder, boFilterQuery)"></span>
                </div>
                <span class="text-muted text-xs" x-text="doc.id"></span>
              </div>
              <!-- Report list -->
              <div x-show="expandedBODocs.includes(doc.id)" class="ml-4 mt-1 space-y-1">
                <!-- Report prompts (parameters). Shown only when the report has any. -->
                <template x-if="(boReportParams[doc.id] || []).length > 0">
                  <div class="px-3 py-1 space-y-1">
                    <div class="text-muted text-xs">Prompts</div>
                    <template x-for="(p, promptIdx) in (boReportParams[doc.id] || [])" :key="p.id">
                      <label class="field-label block" :for="`bo-report-prompt-${doc.id}-${promptIdx}`">
                        <span x-text="(p.name || ('Prompt ' + p.id)) + (p.mandatory ? ' *' : '')"></span>
                        <input x-show="p.type === 'DateTime'" type="date"
                               x-model="boParamValues[doc.id][p.id]" class="field-input" :id="`bo-report-prompt-${doc.id}-${promptIdx}`" />
                        <input x-show="p.type !== 'DateTime'" type="text"
                               x-model="boParamValues[doc.id][p.id]" class="field-input"
                               :placeholder="p.type" :id="`bo-report-prompt-${doc.id}-${promptIdx}`" />
                      </label>
                    </template>
                  </div>
                </template>
                <template x-if="!boReports[doc.id]">
                  <div class="text-muted text-xs px-3 py-1">Loading reports…</div>
                </template>
                <template x-if="boReports[doc.id] && boReports[doc.id].length === 0">
                  <div class="text-muted text-xs px-3 py-1">No reports found</div>
                </template>
                <!-- SAP's whole-document export: every tab in one workbook.
                     Only offered when there is more than one tab, since for a
                     single-tab document it is the per-tab button already below.
                     Hidden while a filter is active: "All tabs" ignores the
                     filter, so next to a filtered list — or next to "No reports
                     match" — it reads as a claim about what is on screen. -->
                <template x-if="boReports[doc.id] && boReports[doc.id].length > 1 && !boFilterQuery">
                  <div class="bo-report-item">
                    <span class="text-muted text-xs">All tabs</span>
                    <div class="flex gap-1">
                      <button @click="downloadBOReport(doc.id, '', 'xlsx')"
                              :aria-label="`Download every tab of ${doc.name} as XLSX`"
                              class="btn-secondary btn-sm py-0.5">XLSX</button>
                      <button @click="downloadBOReport(doc.id, '', 'pdf')"
                              :aria-label="`Download every tab of ${doc.name} as PDF`"
                              class="btn-secondary btn-sm py-0.5">PDF</button>
                      <button @click="openAddBOJobModal(doc, null)"
                              :aria-label="`Add a job for every tab of ${doc.name}`"
                              class="btn-primary btn-sm py-0.5">+ Job</button>
                    </div>
                  </div>
                </template>
                <template x-if="boReports[doc.id] && boReports[doc.id].length > 0 && boFilteredReports(doc).length === 0">
                  <div class="text-muted text-xs px-3 py-1">No reports match "<span x-text="boFilterQuery"></span>"</div>
                </template>
                <template x-for="(rep, boRepIdx) in boFilteredReports(doc)" :key="rep.id ? 'rep-' + rep.id : 'rep-idx-' + boRepIdx">
                  <div class="bo-report-item">
                    <span x-html="highlightMatch(rep.name, boFilterQuery)"></span>
                    <div class="flex gap-1">
                      <button @click="downloadBOReport(doc.id, rep.id, 'xlsx')" class="btn-secondary btn-sm py-0.5">XLSX</button>
                      <button @click="downloadBOReport(doc.id, rep.id, 'pdf')" class="btn-secondary btn-sm py-0.5">PDF</button>
                      <button @click="openAddBOJobModal(doc, rep)" class="btn-primary btn-sm py-0.5">+ Job</button>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- SAP DS Panel -->
    <div>
      <div class="card mb-4">
        <div class="flex items-center justify-between mb-3">
          <div class="font-semibold text-slate-700">SAP Data Services</div>
          <span class="badge badge-purple">Management Console</span>
        </div>
        <div class="grid-2 mb-3">
          <div>
            <label class="field-label" for="a11y-adapters-config-ds">Config</label>
            <select x-model="dsConfigId" class="field-input field-select" data-testid="ds-config-select" id="a11y-adapters-config-ds">
              <option value="">— Select —</option>
              <template x-for="cfg in configs" :key="cfg.id">
                <option :value="cfg.id" x-text="cfg.name"></option>
              </template>
            </select>
          </div>
          <div class="flex items-end">
            <button @click="testDSConnection()" :disabled="!dsConfigId || dsTesting" class="btn-primary w-full" data-testid="ds-test-connection-btn">
              <span x-show="!dsTesting">Test Connection</span>

            </button>
          </div>
        </div>
        <template x-if="dsTestResult">
          <div :class="dsTestResult.ok ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-rose-50 border-rose-200 text-rose-700'"

            <span x-text="dsTestResult.ok ? '✓ ' + dsTestResult.message : '✗ ' + dsTestResult.message"></span>
            <span x-show="dsTestResult.latency_ms" class="text-muted ml-2" x-text="dsTestResult.latency_ms + 'ms'"></span>
          </div>
        </template>
        <div class="border-t pt-3 mt-3">
          <div class="font-medium text-xs text-slate-500 uppercase tracking-wider mb-2">Job Status Lookup</div>
          <div class="grid-2 mb-2 gap-2">
            <div>
              <label class="field-label" for="a11y-ds-id-type">Lookup Type</label>
              <select x-model="dsIdType" class="field-input field-select" id="a11y-ds-id-type">
                <option value="job_name">Job Name</option>
                <option value="run_id">Run ID</option>
              </select>
            </div>
            <div>
              <label class="field-label" for="a11y-ds-repository">Repository (Optional)</label>
              <input x-model="dsRepository" class="field-input" placeholder="Config Default" id="a11y-ds-repository" />
            </div>
          </div>
          <div class="flex gap-2 mb-3">
            <input x-model="dsIdentifier" class="field-input" :placeholder="dsIdType === 'run_id' ? 'e.g. run-123' : 'e.g. JOB_ETL_NIGHTLY'" data-testid="ds-identifier-input" />
            <button @click="lookupSAPDS()" :disabled="!dsConfigId || !dsIdentifier || dsLoading" class="btn-primary flex-shrink-0" data-testid="ds-lookup-btn">
              <span x-show="!dsLoading">Lookup</span>
              <span x-show="dsLoading">…</span>
            </button>
          </div>
          <template x-if="dsResult">
            <div class="border rounded-lg p-3 text-sm" :class="dsResult.status==='PASSED' ? 'border-emerald-200 bg-emerald-50' : 'border-slate-200 bg-slate-50'" data-testid="ds-result">
              <div class="flex items-center justify-between">
                <span class="font-medium" x-text="dsResult.identifier"></span>
                <span class="badge" :class="statusBadgeClass(dsResult.status)" x-text="dsResult.status"></span>
              </div>
              <div class="text-muted mt-1" x-text="'Repo: ' + (dsResult.repository || 'default') + ' · Env: ' + dsResult.environment + ' · Checked: ' + fmtDate(dsResult.checked_at)"></div>
              <button @click="openAddDSJobModal()" class="btn-primary btn-sm mt-2">+ Add to Job Catalog</button>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- Automic Panel -->
    <div>
      <div class="card mb-4">
        <div class="flex items-center justify-between mb-3">
          <div class="font-semibold text-slate-700">Automic Workload</div>
          <span class="badge badge-amber">Job Lookup</span>
        </div>
        <div class="grid-2 mb-3">
          <div>
            <label  class="field-label" for="a11y-adapters-config-3">Config</label>
            <select x-model="automicConfigId" class="field-input field-select" data-testid="automic-config-select" aria-label="automic config select" id="a11y-adapters-config-3">
              <option value="">— Select —</option>
              <template x-for="cfg in configs" :key="cfg.id">
                <option :value="cfg.id" x-text="cfg.name"></option>
              </template>
            </select>
          </div>
          <div>
            <label  class="field-label" for="a11y-adapters-lookup-type">Lookup Type</label>
            <select x-model="automicIdType" class="field-input field-select" data-testid="automic-lookup-type-select" id="a11y-adapters-lookup-type">
              <option value="job_name">Job Name</option>
              <option value="run_id">Run ID</option>
            </select>
          </div>
        </div>
        <div class="flex gap-2">
          <input x-model="automicIdentifier" class="field-input" :placeholder="automicIdType === 'run_id' ? 'e.g. RUN_42' : 'e.g. ETL_NIGHTLY'" data-testid="automic-identifier-input" aria-label="automicidtype run id e g run 42 e g etl nightly" />
          <button @click="lookupAutomic()" :disabled="!automicConfigId || !automicIdentifier || automicLoading" class="btn-primary flex-shrink-0" data-testid="automic-lookup-btn">
            <span x-show="!automicLoading">Lookup</span>
            <span x-show="automicLoading">…</span>
          </button>
        </div>
        <template x-if="automicResult">
          <div class="mt-3 border rounded-lg p-3 text-sm" :class="automicResult.status==='PASSED' ? 'border-emerald-200 bg-emerald-50' : 'border-slate-200 bg-slate-50'" data-testid="automic-result">
            <div class="flex items-center justify-between">
              <span class="font-medium" x-text="automicResult.identifier"></span>
              <span class="badge" :class="statusBadgeClass(automicResult.status)" x-text="automicResult.status"></span>
            </div>
            <div class="text-muted mt-1" x-text="'Env: ' + automicResult.environment + ' · Checked: ' + fmtDate(automicResult.checked_at)"></div>
            <button @click="addAutomicJob()" class="btn-primary btn-sm mt-2">+ Add to Job Catalog</button>
          </div>

      </div>

      <!-- Automic lookup history (sessionStorage) -->
      <div class="card" x-show="automicHistory.length > 0">

              <span class="font-mono text-xs" x-text="h.identifier"></span>
              <span class="badge" :class="statusBadgeClass(h.status)" x-text="h.status"></span>
            </div>
          </template>
        </div>

  <!-- Import Jobs from File panel -->
  <div x-show="currentView === 'adapters'" class="card mt-4">
    <button type="button" class="card-toggle" @click="fileImportOpen = !fileImportOpen" :aria-expanded="fileImportOpen.toString()">
      <div class="font-semibold text-slate-700">📂 Import Jobs from File</div>
      <span class="text-muted text-sm" x-text="fileImportOpen ? '▲ collapse' : '▼ expand'"></span>
    </button>
    <template x-if="fileImportOpen">
      <div class="mt-3 space-y-3">
        <p class="text-muted text-sm">Upload a <strong>.json</strong> array or <strong>.csv</strong> file. CSV columns: <code>name, job_type, job_name, run_id, tags, description</code> — <code>job_type</code> defaults to <code>automic_job</code>.</p>
        <input type="file" accept=".json,.csv" @change="onFileSelected($event)" class="field-input" aria-label="input" />
        <template x-if="fileImportErrors.length > 0">
          <div class="space-y-1">
            <template x-for="err in fileImportErrors" :key="err">
              <p class="text-rose-600 text-sm" x-text="err"></p>
            </template>
          </div>
        </template>
        <template x-if="fileImportJobs.length > 0">
          <div>
            <div class="flex items-center gap-2 mb-2">
              <span class="badge badge-blue" x-text="fileImportJobs.length + ' job(s) parsed'"></span>
              <template x-if="fileImportJobs.filter(j => jobs.some(x => x.name === j.name)).length > 0">
                <span class="badge badge-amber" x-text="fileImportJobs.filter(j => jobs.some(x => x.name === j.name)).length + ' will update existing'"></span>
              </template>

            <div class="overflow-x-auto">
              <table class="results-table text-xs" aria-label="adapters table 1">
                <thead><tr><th scope="col">Name</th><th scope="col">Type</th><th scope="col">Tags</th></tr></thead>
                <tbody>
                  <template x-for="(job, idx) in fileImportJobs" :key="idx">
                    <tr :class="!job.name ? 'bg-rose-50' : ''">
                      <td x-text="job.name || '⚠ missing'"></td>
                      <td x-text="job.job_type || 'automic_job'"></td>
                      <td x-text="(job.tags || []).join(', ')"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <div class="flex justify-end mt-2">
              <button @click="importFromFile()" :disabled="fileImportErrors.length > 0 || fileImportLoading" class="btn-primary">

    <template x-if="browseAutomicOpen">
      <div class="mt-3 space-y-3">
        <template x-if="!configs.length">
          <p class="text-muted text-sm">No configs available. <button @click="currentView='config'" class="link">Go to Config tab</button> to add Automic credentials first.</p>
        </template>
        <template x-if="configs.length">
          <div class="space-y-3">
            <div class="grid-2">
              <div>
                <label  class="field-label" for="a11y-adapters-config-2">Config</label>
                <select x-model="browseAutomicConfigId" class="field-input field-select" id="a11y-adapters-config-2">
                  <option value="">— Select —</option>
                  <template x-for="cfg in configs" :key="cfg.id">
                    <option :value="cfg.id" x-text="cfg.name"></option>
                  </template>
                </select>
              </div>
              <div>
                <label  class="field-label" for="a11y-adapters-filter">Filter</label>

          <label class="field-label" for="a11y-adapters-ds-job-name">Job Name *</label>

        </div>
        <div>
          <label class="field-label" for="a11y-adapters-ds-target-job">DS Job Name *</label>

        <div>

        <div>

      <div class="flex justify-end gap-3 mt-4">
        <button @click="showDSJobModal=false" class="btn-secondary">Cancel</button>

        </button>

    </div>
  </div>

<template x-if="currentView === 'aws'"><div>

          <div x-show="awsError && awsError.typeMismatches" class="mt-1">

            <template x-for="m in (awsError && awsError.typeMismatches) || []" :key="m.column">

                <tr><th scope="col">Storage class</th><td x-text="awsResult.data.storage_class"></td></tr>
                <tr><th scope="col">ETag</th><td x-text="awsResult.data.etag"></td></tr>
                <tr><th scope="col">Last modified</th><td x-text="awsResult.data.last_modified"></td></tr>

              <thead>

                  <template x-for="col in awsResult.data.columns" :key="col">

                  </template>
                  <th scope="col">objects</th>

              </thead>
              <tbody>

                    </template>
                    <td x-text="e.object_count"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          </div>
        </template>

              <option value=">=">&gt;=</option>
