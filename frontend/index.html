<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <title>ETL Test Framework</title>
  <link rel="stylesheet" href="vendor/tailwind.css" />
  <script defer src="vendor/alpine.min.js"></script>
  <script defer src="vendor/chart.umd.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-shell" x-data="app()" x-init="init()">
<aside class="sidebar" :class="sidebarCollapsed ? 'is-collapsed' : ''" data-testid="app-sidebar">
  <div class="sidebar-brand">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
    <span class="sidebar-brand-label" x-show="!sidebarCollapsed">ETL Framework</span>
  </div>

  <nav class="sidebar-nav">
    <template x-for="tab in tabs.filter(t => !t.group)" :key="tab.id">
      <button @click="onTabEnter(tab.id)" :class="currentView === tab.id ? 'active' : ''"
              class="sidebar-nav-item" :data-testid="'nav-tab-' + tab.id">
        <span class="sidebar-nav-icon" x-html="tab.icon"></span>
        <span class="sidebar-nav-label" x-show="!sidebarCollapsed" x-text="tab.label"></span>
      </button>
    </template>

    <template x-for="grp in tabGroups" :key="grp.id">
      <div class="sidebar-group" :data-group="grp.id">
        <div class="sidebar-group-header" x-show="!sidebarCollapsed" x-text="grp.label"></div>
        <template x-for="tab in tabs.filter(t => t.group === grp.id)" :key="tab.id">
          <button @click="onTabEnter(tab.id)" :class="currentView === tab.id ? 'active' : ''"
                  class="sidebar-nav-item" :data-group="grp.id" :data-testid="'nav-tab-' + tab.id">
            <span class="sidebar-nav-icon" x-html="tab.icon"></span>
            <span class="sidebar-nav-label" x-show="!sidebarCollapsed" x-text="tab.label"></span>
          </button>
        </template>
      </div>
    </template>
  </nav>

  <button class="sidebar-collapse-btn" data-testid="sidebar-collapse-btn"
          @click="sidebarCollapsed = !sidebarCollapsed"
          :aria-label="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" :style="sidebarCollapsed ? 'transform: rotate(180deg)' : ''"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </button>
</aside>

<div class="app-content">

<!-- ============================================================
     TOP NAV
     ============================================================ -->
<nav class="top-nav">
  <div class="top-nav-inner">
    <h1 class="page-title" x-text="currentTabLabel"></h1>
    <div class="flex items-center gap-3 ml-auto">
      <span class="text-xs" :class="apiOk ? 'text-emerald-500' : 'text-rose-400'" x-text="apiOk ? '● Connected' : '● Offline'"></span>
    </div>
  </div>
</nav>

<!-- ============================================================
     AUTH STATUS
     ============================================================ -->
<section class="auth-status-bar" :class="storedToken ? 'is-connected' : 'is-missing'">
  <div class="auth-status-inner">
    <template x-if="!storedToken">
      <div class="auth-status-content">
        <span class="auth-status-dot">🔑</span>
        <span>No API token set</span>
        <button class="auth-status-action" data-testid="auth-status-open-btn" @click="openAuthModal()">Set up access →</button>
      </div>
    </template>
    <template x-if="storedToken">
      <div class="auth-status-content" data-testid="auth-status-connected">
        <span class="auth-status-dot">●</span>
        <span x-text="activeTokenName ? 'Connected as ' + activeTokenName + (activeTokenIsAdmin ? ' (Administrator)' : ' (Standard user)') : 'Connected'"></span>
        <button class="auth-status-action" @click="goToTokenManagement()">Manage →</button>
      </div>
    </template>
  </div>
</section>

<!-- ============================================================
     MAIN CONTENT
     ============================================================ -->
<main class="main-content">

<!-- ====================================================================
     TAB 0 – HOME / OVERVIEW
     ==================================================================== -->
<template x-if="currentView === 'home'"><div data-testid="home-view">
  <div class="section-header">
    <div>
      <div class="section-title">Overview</div>
      <div class="section-sub">At-a-glance status and quick actions</div>
    </div>
  </div>

  <div class="stat-row">
    <button class="home-stat-card" data-testid="home-stat-active-runs" @click="onTabEnter('monitor')">
      <div class="home-stat-card-label">Active Runs</div>
      <div class="home-stat-card-value" x-text="homeStats.activeRuns"></div>
    </button>
    <button class="home-stat-card" data-testid="home-stat-last-run" @click="onTabEnter('history')">
      <div class="home-stat-card-label">Last Run Status</div>
      <div class="home-stat-card-value">
        <span x-show="homeStats.lastRunStatus" class="badge" :class="statusBadgeClass(homeStats.lastRunStatus)" x-text="homeStats.lastRunStatus"></span>
        <span x-show="!homeStats.lastRunStatus" class="text-muted text-sm">No runs yet</span>
      </div>
    </button>
    <button class="home-stat-card" data-testid="home-stat-environments" @click="onTabEnter('config')">
      <div class="home-stat-card-label">Connected Environments</div>
      <div class="home-stat-card-value" x-text="homeStats.connectedEnvironments"></div>
    </button>
    <button class="home-stat-card" data-testid="home-stat-pending-runs" @click="onTabEnter('monitor')">
      <div class="home-stat-card-label">Pending Runs</div>
      <div class="home-stat-card-value" x-text="homeStats.pendingRuns"></div>
    </button>
  </div>

  <div class="flex gap-2 mt-4 mb-4">
    <button class="btn-primary" data-testid="home-quick-action-new-config" @click="onTabEnter('config'); openNewConfigModal()">+ New Config</button>
    <button class="btn-primary" data-testid="home-quick-action-launch" @click="onTabEnter('jobs')">▶ Launch Job</button>
    <button class="btn-primary" data-testid="home-quick-action-reports" @click="onTabEnter('reports')">📊 View Reports</button>
  </div>

  <div class="card overflow-hidden mb-4">
    <div class="section-header" style="padding: 0.75rem 1rem 0;">
      <div class="section-title" style="font-size: 0.9375rem;">Recent Activity</div>
    </div>
    <table class="data-table" data-testid="home-recent-runs-table" aria-label="home table 1">
      <thead>
        <tr>
          <th scope="col">Run ID</th>
          <th scope="col">Status</th>
          <th scope="col">Environments</th>
          <th scope="col">Started</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="run in homeRecentRuns" :key="run.run_id">
          <tr class="cursor-pointer" tabindex="0" role="button" @click="onTabEnter('history'); viewRunDetail(run.run_id)" @keydown.enter="onTabEnter('history'); viewRunDetail(run.run_id)" @keydown.space.prevent="onTabEnter('history'); viewRunDetail(run.run_id)" :data-testid="'home-recent-run-row-' + run.run_id">
            <td class="font-mono text-xs text-slate-500" x-text="run.run_id.substring(0,8)+'…'"></td>
            <td><span class="badge" :class="statusBadgeClass(run.status)" x-text="run.status"></span></td>
            <td class="text-muted" x-text="(run.source_env||'?') + ' → ' + (run.target_env||'?')"></td>
            <td class="text-muted" x-text="fmtDate(run.started_at)"></td>
          </tr>
        </template>
        <template x-if="homeRecentRuns.length === 0">
          <tr><td colspan="4" class="text-muted text-center py-4">No runs yet — launch a job to get started.</td></tr>
        </template>
      </tbody>
    </table>
  </div>

  <div class="card" data-testid="home-health-card">
    <div class="section-title" style="font-size: 0.9375rem;">Connection Health</div>
    <div class="flex items-center gap-2 mt-2">
      <span x-show="!storedToken" class="text-muted text-sm">No API token set —
        <button class="text-indigo-500 hover:underline" @click="openAuthModal()">set up access</button>
      </span>
      <span x-show="storedToken" class="text-sm" x-text="activeTokenName ? 'Connected as ' + activeTokenName + (activeTokenIsAdmin ? ' (Administrator)' : ' (Standard user)') : 'Connected'"></span>
      <button x-show="storedToken" class="text-indigo-500 hover:underline text-sm" @click="goToTokenManagement()">Manage →</button>
    </div>
  </div>
</div></template>

<!-- ====================================================================
     TAB 1 – CONFIG EDITOR
     ==================================================================== -->
<template x-if="currentView === 'config'"><div>
  <div class="section-header">
    <div>
      <div class="section-title">Configuration Editor</div>
      <div class="section-sub">Manage environment credentials and settings</div>
    </div>
    <button @click="openNewConfigModal()" class="btn-primary" data-testid="config-new-btn">+ New Config</button>
  </div>

  <template x-if="configs.length === 0">
    <div class="card empty-state">
      <div class="empty-state-icon">🔧</div>
      <div class="empty-state-title">No configurations yet</div>
      <div class="empty-state-sub">Click "New Config" to define an environment</div>
    </div>
  </template>

  <div class="grid gap-3">
    <template x-for="cfg in configs" :key="cfg.id">
      <div class="card flex items-center justify-between gap-4" :data-testid="'config-row-' + cfg.id">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-9 h-9 rounded-lg flex items-center justify-center text-lg flex-shrink-0"
               style="background:#ede9fe">🗃️</div>
          <div class="min-w-0">
            <div class="font-semibold text-slate-800 truncate" x-text="cfg.name"></div>
            <div class="flex items-center gap-2 mt-0.5">
              <span class="badge badge-blue" x-text="cfg.env_name"></span>
              <span class="text-muted" x-text="'Updated ' + fmtDate(cfg.updated_at)"></span>
            </div>
          </div>
        </div>
        <div class="flex gap-2 flex-shrink-0">
          <button @click="editConfig(cfg)" class="btn-secondary btn-sm" :data-testid="'config-row-' + cfg.id + '-edit-btn'">Edit</button>
          <button @click="deleteConfig(cfg.id)" class="btn-danger btn-sm" :data-testid="'config-row-' + cfg.id + '-delete-btn'">Delete</button>
          <button @click="openSchemaExplorer(cfg)" class="btn-secondary btn-sm"
                  :class="schemaExplorerId === cfg.id ? 'ring-2 ring-indigo-400' : ''">
            Browse Schema <span x-text="schemaExplorerId === cfg.id ? '▲' : '▼'"></span>
          </button>
        </div>
      </div>
    </template>
  </div>

  <!-- Schema Explorer Panel -->
  <template x-if="schemaExplorerId !== null">
    <div class="card mt-3" data-testid="schema-explorer-panel">
      <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
        <div class="flex items-center gap-3">
          <div class="font-semibold text-slate-700">
            Schema Explorer —
            <span x-text="configs.find(c => c.id === schemaExplorerId)?.name ?? ''"></span>
          </div>
          <template x-if="getSchemaConnections(schemaExplorerId).length > 1">
            <div class="flex items-center gap-1.5 text-xs text-slate-600">
              <label for="schema-explorer-conn-select" class="font-medium">Data Source:</label>
              <select id="schema-explorer-conn-select"
                      x-model="schemaExplorerConnection"
                      @change="openSchemaExplorer(configs.find(c => c.id === schemaExplorerId), schemaExplorerConnection)"
                      class="field-input field-select text-xs py-1 px-2"
                      data-testid="schema-explorer-connection-select">
                <template x-for="conn in getSchemaConnections(schemaExplorerId)" :key="conn.name">
                  <option :value="conn.name" x-text="conn.label"></option>
                </template>
              </select>
            </div>
          </template>
        </div>
        <button @click="closeSchemaExplorer()" class="text-muted hover:text-slate-700 text-sm" data-testid="schema-explorer-close-btn">✕ Close</button>
      </div>

      <div x-show="schemaExplorerLoading" class="text-muted text-sm">Loading schema…</div>

      <template x-if="!schemaExplorerLoading && schemaExplorerData.length === 0">
        <div class="text-muted text-sm">No tables found or connection failed.</div>
      </template>

      <template x-if="!schemaExplorerLoading && schemaExplorerData.length > 0">
        <div>
          <template x-for="schemaGroup in [...new Set(schemaExplorerData.map(t => t.schema))]" :key="schemaGroup">
            <div class="mb-2">
              <button @click="toggleSchemaGroup(schemaGroup)"
                      class="flex items-center gap-1 text-sm font-semibold text-slate-700 hover:text-indigo-600 w-full text-left">
                <span x-text="schemaExpandedSchemas[schemaGroup] ? '▼' : '▶'"></span>
                <span x-text="schemaGroup"></span>
                <span class="text-muted font-normal ml-1"
                      x-text="'(' + schemaExplorerData.filter(t => t.schema === schemaGroup).length + ' tables)'"></span>
              </button>
              <template x-if="schemaExpandedSchemas[schemaGroup]">
                <div class="ml-4 mt-1 space-y-1">
                  <template x-for="tbl in schemaExplorerData.filter(t => t.schema === schemaGroup)" :key="tbl.schema + '.' + tbl.table">
                    <div>
                      <div class="flex items-center gap-2 py-0.5">
                        <button @click="toggleSchemaTable(tbl.schema + '.' + tbl.table)"
                                class="text-xs text-slate-600 hover:text-indigo-600 font-mono">
                          <span x-text="schemaExpandedTables[tbl.schema + '.' + tbl.table] ? '▼' : '▶'"></span>
                          <span x-text="tbl.table"></span>
                        </button>
                        <button @click="previewSchemaTable(schemaExplorerId, tbl.schema, tbl.table)"
                                class="btn-secondary btn-sm text-xs">▶ Preview</button>
                        <button @click="useTableInJob(tbl.schema, tbl.table)"
                                class="btn-secondary btn-sm text-xs">Use in Job</button>
                      </div>
                      <template x-if="schemaExpandedTables[tbl.schema + '.' + tbl.table]">
                        <div class="ml-6 text-xs text-muted font-mono flex flex-wrap gap-x-3 mt-0.5">
                          <template x-for="col in tbl.columns" :key="col.name">
                            <span><span x-text="col.name"></span> <span class="text-slate-400" x-text="'(' + col.type + ')'"></span></span>
                          </template>
                        </div>
                      </template>
                      <template x-if="schemaTablePreviews[tbl.schema + '.' + tbl.table]">
                        <div class="mt-1 ml-4">
                          <template x-if="schemaTablePreviews[tbl.schema + '.' + tbl.table] === 'loading'">
                            <div class="text-xs text-muted">Loading preview…</div>
                          </template>
                          <template x-if="typeof schemaTablePreviews[tbl.schema + '.' + tbl.table] === 'string' && schemaTablePreviews[tbl.schema + '.' + tbl.table].startsWith('error:')">
                            <div class="text-xs text-red-500" x-text="schemaTablePreviews[tbl.schema + '.' + tbl.table].replace('error:', '')"></div>
                          </template>
                          <template x-if="schemaTablePreviews[tbl.schema + '.' + tbl.table] && typeof schemaTablePreviews[tbl.schema + '.' + tbl.table] === 'object'">
                            <div class="overflow-x-auto border rounded" style="max-height:200px;overflow-y:auto">
                              <table class="data-table text-xs" aria-label="config table 1">
                                <thead>
                                  <tr>
                                    <template x-for="col in schemaTablePreviews[tbl.schema + '.' + tbl.table].columns" :key="col">
                                      <th x-text="col" scope="col"></th>
                                    </template>
                                  </tr>
                                </thead>
                                <tbody>
                                  <template x-for="(row, ri) in schemaTablePreviews[tbl.schema + '.' + tbl.table].rows" :key="ri">
                                    <tr>
                                      <template x-for="(cell, ci) in row" :key="ci">
                                        <td x-text="cell ?? '—'"></td>
                                      </template>
                                    </tr>
                                  </template>
                                </tbody>
                              </table>
                            </div>
                          </template>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>

  <!-- YAML Import card -->
  <div class="card mt-4">
    <button type="button" class="card-toggle" @click="yamlImportOpen = !yamlImportOpen" :aria-expanded="yamlImportOpen.toString()">
      <div class="font-semibold text-slate-700">Import YAML</div>
      <span class="text-muted text-sm" x-text="yamlImportOpen ? '▲ collapse' : '▼ expand'"></span>
    </button>
    <template x-if="yamlImportOpen">
      <div class="mt-3 space-y-3">
        <p class="text-muted text-sm">Paste a YAML block defining one or more named environments. Each top-level key becomes a saved config.</p>
        <textarea x-model="yamlImportText" rows="8" class="field-input font-mono text-xs" placeholder="dev:&#10;  db_host: sql-dev.internal&#10;  db_port: 1433&#10;  bo_url: http://bo-dev:6405" data-testid="config-yaml-textarea" aria-label="dev 10 db host sql dev internal 10 db port 1433 10 bo url http bo dev 6405"></textarea>
        <div class="flex justify-end">
          <button :disabled="!yamlImportText.trim() || yamlImporting" class="btn-primary" @click="importYaml()" data-testid="config-yaml-import-btn">
            <span x-show="!yamlImporting">Import</span>
            <span x-show="yamlImporting">Importing…</span>
          </button>
        </div>
      </div>
    </template>
  </div>

  <!-- Security – API Tokens -->
  <div class="card mt-4">
    <button type="button" class="card-toggle" data-testid="security-card-header" @click="securityOpen = !securityOpen; if(securityOpen) loadTokens()" :aria-expanded="securityOpen.toString()">
      <div class="font-semibold text-slate-700">🔑 Security — Users &amp; API Access</div>
      <span class="text-muted text-sm" x-text="securityOpen ? '▲ collapse' : '▼ expand'"></span>
    </button>
    <template x-if="securityOpen">
      <div class="mt-3 space-y-3">
        <p class="text-muted text-sm">Each user receives a personal bearer token. Administrators can create and revoke standard-user or administrator access.</p>
        <div class="flex items-center gap-2">
          <input type="password" :value="storedToken" @change="setStoredToken($event.target.value)" class="field-input flex-1" data-testid="security-token-input" placeholder="Paste token here to authenticate…" aria-label="paste token here to authenticate" />
          <span class="badge text-xs" :class="activeTokenIsAdmin ? 'badge-blue' : 'badge-gray'" x-text="activeTokenIsAdmin ? 'Administrator' : 'Standard user'"></span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-muted text-xs" x-text="activeTokenIsAdmin ? tokens.length + ' user credential(s)' : 'Administrator access is required to manage users'"></span>
          <button x-show="activeTokenIsAdmin" @click="showCreateToken = !showCreateToken" class="btn-primary btn-sm" data-testid="security-add-user-btn">+ Add User Access</button>
        </div>
        <template x-if="showCreateToken && activeTokenIsAdmin">
          <div class="grid gap-2 md:grid-cols-4 items-end">
            <div class="md:col-span-2">
              <label  class="field-label" for="a11y-config-user-service-name">User / service name</label>
              <input x-model="newTokenName" class="field-input" data-testid="security-new-token-name-input" placeholder="e.g. jane.smith or ci-pipeline" @keydown.enter="createToken()" id="a11y-config-user-service-name" />
            </div>
            <div>
              <label  class="field-label" for="a11y-config-role">Role</label>
              <select x-model="newTokenRole" class="field-input field-select" data-testid="security-new-token-role-select" id="a11y-config-role">
                <option value="user">Standard user</option>
                <option value="admin">Administrator</option>
              </select>
            </div>
            <div>
              <label  class="field-label" for="a11y-config-expires-optional">Expires (optional)</label>
              <input x-model="newTokenExpiresAt" type="datetime-local" class="field-input" id="a11y-config-expires-optional" />
            </div>
            <button @click="createToken()" :disabled="!newTokenName.trim()" class="btn-primary btn-sm md:col-span-4" data-testid="security-create-access-btn">Create Access</button>
          </div>
        </template>
        <template x-if="createdToken">
          <div class="bg-amber-50 border border-amber-300 rounded-lg p-3 text-sm space-y-1">
            <div class="font-semibold text-amber-800">Access created for <span x-text="createdTokenRole === 'admin' ? 'an administrator' : 'a standard user'"></span> — copy this token now:</div>
            <div class="text-xs text-amber-700">Give it to the intended user securely. Your current administrator session has not changed.</div>
            <div class="font-mono text-xs break-all text-amber-900 select-all" data-testid="security-created-token-value" x-text="createdToken"></div>
            <template x-if="createdTokenHint">
              <div class="text-xs text-amber-700">Hint (last 8 chars): <span class="font-mono" x-text="'…' + createdTokenHint"></span></div>
            </template>
            <button @click="createdToken = null; createdTokenHint = null" class="text-xs text-amber-700 underline">Dismiss</button>
          </div>
        </template>
        <div class="space-y-1">
          <template x-for="tok in tokens" :key="tok.id">
            <div class="flex items-center gap-3 px-3 py-2 rounded border border-slate-100 bg-slate-50 text-sm" :data-testid="'security-token-row-' + tok.id">
              <div class="flex-1 min-w-0">
                <span class="font-medium text-slate-700" x-text="tok.name"></span>
                <span class="ml-1 text-xs font-medium" :class="tok.is_admin ? 'text-indigo-600' : 'text-slate-500'" x-text="tok.is_admin ? '(administrator)' : '(standard user)'"></span>
                <span class="text-muted ml-2 text-xs" x-text="'created ' + fmtDate(tok.created_at)"></span>
                <span x-show="tok.last_used_at" class="text-muted ml-2 text-xs" x-text="'last used ' + fmtDate(tok.last_used_at)"></span>
                <span x-show="tok.token_hint" class="text-muted ml-2 text-xs font-mono" x-text="'…' + tok.token_hint"></span>
                <span x-show="tok.expires_at" class="text-muted ml-2 text-xs" x-text="'expires ' + fmtDate(tok.expires_at)"></span>
              </div>
              <span :class="tok.enabled ? 'badge-green' : 'badge-gray'" class="badge text-xs" x-text="tok.enabled ? 'Active' : 'Revoked'"></span>
              <button @click="revokeToken(tok.id)" :disabled="!tok.enabled" class="btn-danger btn-sm text-xs" :data-testid="'security-revoke-btn-' + tok.id">Revoke</button>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>

  <!-- Diagnostics – Support Bundle -->
  <div class="card mt-4">
    <button type="button" class="card-toggle" @click="diagnosticsOpen = !diagnosticsOpen; if(diagnosticsOpen && !diagnosticsData) loadDiagnostics()" :aria-expanded="diagnosticsOpen.toString()">
      <div class="font-semibold text-slate-700">Diagnostics — Support Bundle</div>
      <span class="text-muted text-sm" x-text="diagnosticsOpen ? '▲ collapse' : '▼ expand'"></span>
    </button>
    <template x-if="diagnosticsOpen">
      <div class="mt-3 space-y-3">
        <p class="text-muted text-sm">Collect runtime, package, database, and optional recent log details for troubleshooting.</p>
        <div class="flex items-center justify-between gap-3">
          <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
            <input type="checkbox" class="rounded" x-model="diagnosticsIncludeLogs" aria-label="diagnosticsincludelogs" /> Include recent logs
          </label>
          <button @click="loadDiagnostics()" class="btn-secondary btn-sm" :disabled="diagnosticsLoading">
            <span x-show="!diagnosticsLoading">Refresh Diagnostics</span>
            <span x-show="diagnosticsLoading">Loading...</span>
          </button>
        </div>
        <template x-if="diagnosticsError">

        <p class="text-muted text-sm">All timestamps across the dashboard, run history, and generated reports are shown in this timezone. Scheduled runs also fire according to it — a cron expression of <code>0 9 * * *</code> means 9am in this zone.</p>

          <div class="text-sm">Current: <span class="font-medium" x-text="appTimezone"></span> <span class="text-muted text-xs">(administrator access required to change)</span></div>

        <template x-if="activeTokenIsAdmin">

  <!-- SAP BO – server-side copy of downloads -->

      <div class="font-semibold text-slate-700">💾 SAP BO — download directory</div>
      <span class="text-muted text-sm" x-text="boDownloadDirOpen ? '▲ collapse' : '▼ expand'"></span>
    </button>
    <template x-if="boDownloadDirOpen">
      <div class="mt-3 space-y-3">
        <p class="text-muted text-sm">When set, every SAP BO report downloaded from the Adapters tab is also written here on the server, with a timestamp in the filename so nothing is ever overwritten. Files are never deleted. Leave empty to keep downloads browser-only. The path must already exist on the machine running this app, and must be absolute — on Windows that means a drive letter (<code>C:\reports\sapbo</code>) or a UNC share (<code>\\server\share\reports</code>), not a rooted path like <code>/var/reports</code>.</p>
        <template x-if="!activeTokenIsAdmin">
          <div class="text-sm">Current: <span class="font-medium" x-text="boDownloadDir || '(browser only)'"></span> <span class="text-muted text-xs">(administrator access required to change)</span></div>

          </div>

  <!-- Notifications – Webhook Hooks -->

  <!-- Step Release Modal -->

        <div>
          <label  class="field-label" for="a11y-config-action-approve-and-continue-skip-and-continue-cancel-run-your-name">Action *</label>

            </label>

        <div><label  class="field-label" for="a11y-config-url">URL *</label><input x-model="hookModal.url" class="field-input" placeholder="https://hooks.slack.com/…" id="a11y-config-url" /></div>

        <div class="grid-2">

          <div><label  class="field-label" for="a11y-config-db-name">DB Name</label><input x-model="configModal.db_name" class="field-input" data-testid="config-modal-db-name-input" id="a11y-config-db-name" /></div>

                </div>
                <!-- Request/response inspector. An endpoint that works in Bruno and
                     fails here reports only "Cannot parse API response as json" - no
                     status, no content type, no body. Showing the request as actually
                     sent next to the response as actually received turns that into a
                     diff against Bruno rather than a guess. -->
                <div x-show="ep.exchange" class="border border-slate-200 rounded">
                  <button type="button"
                          @click="ep.exchangeOpen = !ep.exchangeOpen"

                    <span class="font-medium text-slate-700">Request / response</span>
                    <!-- Colour AND the numeric status: the signal is never colour-only. -->
                    <span :data-testid="'api-exchange-status-' + idx"
                          class="px-1.5 py-0.5 rounded border font-mono"
                          :class="(ep.exchange?.response?.status || 0) >= 400 ? 'bg-red-50 border-red-200 text-red-700' : 'bg-emerald-50 border-emerald-200 text-emerald-700'"
                          x-text="'HTTP ' + (ep.exchange?.response?.status ?? '?')"></span>
                    <span class="text-slate-500" x-text="(ep.exchange?.response?.elapsed_ms ?? 0) + ' ms'"></span>
                    <span class="text-slate-500" x-text="(ep.exchange?.response?.bytes ?? 0) + ' bytes'"></span>
                    <span class="text-slate-500 ml-auto" x-text="ep.exchangeOpen ? 'Hide' : 'Show'"></span>
                  </button>
                  <div x-show="ep.exchangeOpen"
                       :id="'api-exchange-panel-' + idx"
                       :data-testid="'api-exchange-panel-' + idx"
                       class="border-t border-slate-200 p-2 space-y-2">
                    <div class="flex items-center gap-2 flex-wrap">
                      <button type="button"
                              @click="ep.exchangePretty = !ep.exchangePretty"

                              :aria-label="ep.exchangePretty ? 'Pretty: bodies are formatted, activate to show them raw' : 'Raw: bodies are unformatted, activate to pretty-print them'"
                              class="btn-secondary btn-sm text-xs"
                              x-text="ep.exchangePretty ? 'Pretty' : 'Raw'"></button>
                    </div>
                    <!-- Say plainly what the masking does and does not cover. A user
                         must not read "<n chars, redacted>" as proof that everything
                         sensitive was caught, and the URL is shown verbatim by design. -->
                    <p class="text-[11px] text-slate-500">
                      Masked header values are redacted by name: matching is on the header
                      name pattern only, so a credential under a name the pattern does not
                      recognise is shown here in full. The URL is shown exactly as sent,
                      query string included, so a credential passed as a query parameter is
                      visible in cleartext.
                    </p>
                    <div :data-testid="'api-exchange-request-' + idx" class="border border-slate-200 rounded">
                      <div class="flex items-center gap-2 flex-wrap px-2 py-1 bg-slate-50 border-b border-slate-200">
                        <span class="text-[11px] uppercase tracking-wide font-medium text-slate-500">Request</span>
                        <span x-show="ep.exchange?.request?.truncated" class="text-[11px] text-amber-700">body truncated</span>
                        <button type="button"
                                class="btn-secondary btn-sm text-xs ml-auto"
                                aria-label="Copy the request as sent"
                                :data-testid="'api-exchange-copy-request-' + idx"
                                @click="navigator.clipboard.writeText(
                                  (ep.exchange?.request?.method || '') + ' ' + (ep.exchange?.request?.url || '') + '\n' +
                                  Object.entries(ep.exchange?.request?.headers || {}).map(([k, v]) => k + ': ' + v).join('\n') + '\n\n' +
                                  exchangeBody(ep.exchange?.request?.body, ep.exchangePretty)
                                ).catch(() => {})">Copy</button>
                      </div>
                      <div class="p-2 space-y-1">
                        <div class="exchange-pre-wrap overflow-x-auto">
                          <pre class="text-xs font-mono text-slate-700" x-text="(ep.exchange?.request?.method || '') + ' ' + (ep.exchange?.request?.url || '')"></pre>
                        </div>
                        <div class="exchange-pre-wrap overflow-x-auto">
                          <pre class="text-xs font-mono text-slate-600" x-text="Object.entries(ep.exchange?.request?.headers || {}).map(([k, v]) => k + ': ' + v).join('\n')"></pre>
                        </div>
                        <!-- A request body that was never sent is the dropped-body
                             signal, so it is called out rather than shown as blank. -->
                        <p x-show="ep.exchange?.request?.body === null || ep.exchange?.request?.body === undefined"
                           :data-testid="'api-exchange-request-none-' + idx"
                           class="text-xs font-mono font-bold text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1">&lt;NONE SENT&gt;</p>
                        <div x-show="ep.exchange?.request?.body !== null && ep.exchange?.request?.body !== undefined"
                             class="exchange-pre-wrap overflow-x-auto max-h-40 overflow-y-auto">
                          <pre class="text-xs font-mono text-slate-700"
                               :data-testid="'api-exchange-request-body-' + idx"
                               x-text="exchangeBody(ep.exchange?.request?.body, ep.exchangePretty)"></pre>
                        </div>
                      </div>
                    </div>
                    <div :data-testid="'api-exchange-response-' + idx" class="border border-slate-200 rounded">
                      <div class="flex items-center gap-2 flex-wrap px-2 py-1 bg-slate-50 border-b border-slate-200">
                        <span class="text-[11px] uppercase tracking-wide font-medium text-slate-500">Response</span>
                        <span class="text-[11px] font-mono text-slate-500" x-text="ep.exchange?.response?.content_type || '(no content type)'"></span>
                        <span x-show="ep.exchange?.response?.binary" class="text-[11px] text-slate-500">hex preview</span>
                        <span x-show="ep.exchange?.response?.truncated" class="text-[11px] text-amber-700">body truncated</span>
                        <span x-show="(ep.exchange?.response?.redirects || 0) > 0" class="text-[11px] text-amber-700"
                              x-text="(ep.exchange?.response?.redirects || 0) + ' redirect(s) followed'"></span>
                        <button type="button"
                                class="btn-secondary btn-sm text-xs ml-auto"
                                aria-label="Copy the response as received"
                                :data-testid="'api-exchange-copy-response-' + idx"
                                @click="navigator.clipboard.writeText(
                                  'HTTP ' + (ep.exchange?.response?.status ?? '') + '\n' +
                                  Object.entries(ep.exchange?.response?.headers || {}).map(([k, v]) => k + ': ' + v).join('\n') + '\n\n' +
                                  exchangeBody(ep.exchange?.response?.body, ep.exchangePretty)
                                ).catch(() => {})">Copy</button>
                      </div>
                      <div class="p-2 space-y-1">
                        <div class="exchange-pre-wrap overflow-x-auto">
                          <pre class="text-xs font-mono text-slate-600" x-text="Object.entries(ep.exchange?.response?.headers || {}).map(([k, v]) => k + ': ' + v).join('\n')"></pre>
                        </div>
                        <div class="exchange-pre-wrap overflow-x-auto max-h-40 overflow-y-auto">
                          <pre class="text-xs font-mono text-slate-700"
                               :data-testid="'api-exchange-response-body-' + idx"
                               x-text="exchangeBody(ep.exchange?.response?.body, ep.exchangePretty)"></pre>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <p x-show="ep.previewError" x-text="ep.previewError" class="text-xs text-red-600"></p>
                <div x-show="ep.previewResult" class="overflow-x-auto max-h-40 border border-slate-200 rounded">

                      <template x-for="(row, ri) in (ep.previewResult?.rows || [])" :key="ri">

                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </template>
        </div>
        <div class="divider"></div>
        <div class="grid-2">
          <div><label  class="field-label" for="a11y-config-sap-bo-url">SAP BO URL</label><input x-model="configModal.bo_url" class="field-input" placeholder="http://bi-server:6405" id="a11y-config-sap-bo-url" /></div>
          <div><label  class="field-label" for="a11y-config-bo-user">BO User</label><input x-model="configModal.bo_user" class="field-input" id="a11y-config-bo-user" /></div>
          <div><label  class="field-label" for="a11y-config-bo-password">BO Password</label><input x-model="configModal.bo_password" type="password" class="field-input" id="a11y-config-bo-password" /></div>
          <div>
            <label  class="field-label" for="a11y-config-bo-auth-type">BO Auth Type</label>
            <select x-model="configModal.bo_auth_type" class="field-input" id="a11y-config-bo-auth-type">
              <option value="secEnterprise">Enterprise</option>

        </div>
        <div class="divider"></div>
        <div class="grid-2">

        <div>

        <div>

    <div class="settings-group">

          <input type="checkbox" class="rounded" x-model="launchSettings.health_check" aria-label="launchsettings health check" /> Health gate
        </label>
        <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
          <input type="checkbox" class="rounded" x-model="launchSettings.metrics_enabled" aria-label="launchsettings metrics enabled" /> Metrics
        </label>
        <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer"
               title="Treat two NULL values as equal during comparison">
          <input type="checkbox" class="rounded" x-model="launchSettings.null_equals_null" aria-label="launchsettings null equals null" /> NULL = NULL
        </label>
        <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer"
               title="Use hash comparison before full value comparison to speed up processing">
          <input type="checkbox" class="rounded" x-model="launchSettings.use_hash_precheck" aria-label="launchsettings use hash precheck" /> Hash precheck
        </label>
      </div>
      <!-- Retry policy -->
      <div class="grid grid-cols-2 gap-4 mt-4">
        <div>
          <label  class="field-label" for="a11y-launch-max-retries-0-off">Max Retries (0 = off)</label>
          <input x-model="launchSettings.max_retries" type="number" min="0" max="10" class="field-input" id="a11y-launch-max-retries-0-off" />
        </div>
        <div>
          <label  class="field-label" for="a11y-launch-retry-delay-seconds">Retry Delay (seconds)</label>

  </div>

  <!-- Job catalog -->
  <div class="card mb-4">
    <div class="flex items-center justify-between mb-3">
      <div class="font-semibold text-slate-700">Job Catalog</div>
      <div class="flex items-center gap-3">
        <span class="text-muted" x-text="jobCatalogCountLabel"></span>
        <button @click="openNewJobModal()" class="btn-primary btn-sm" data-testid="job-new-btn">+ New Job</button>
      </div>
    </div>

    <div class="px-0 py-2 border-b mb-2">
      <div class="relative">
        <input type="text"
               x-model="jobSearchQuery"
               @input="shiftLastIndex = -1"
               placeholder="Search jobs by name, tags, or description..."
               class="field-input pl-8 w-full text-sm"
               data-testid="job-search-input" aria-label="search jobs by name tags or description">
        <svg class="absolute left-2 top-2.5 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </div>

    <div class="flex gap-2 py-1.5 border-b bg-slate-50 text-xs mb-2 -mx-0 px-1">
      <button @click="selectAllJobs()" class="btn-link btn-sm text-slate-600">Select All</button>
      <span class="text-slate-400">|</span>
      <button @click="selectNoneJobs()" class="btn-link btn-sm text-slate-600">Select None</button>
    </div>

    <template x-if="jobs.length === 0">
      <div class="empty-state"><div class="empty-state-title">No jobs yet. Create one or add from the Adapters tab.</div></div>
    </template>
    <template x-if="jobs.length > 0 && filteredJobList.length === 0">
      <div class="empty-state"><div class="empty-state-title">No jobs match your search.</div></div>
    </template>
    <div class="space-y-1">
      <template x-for="(job, $index) in filteredJobList" :key="job.name">
        <div class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-50 border border-transparent hover:border-slate-200 transition-colors"
             :data-testid="'job-row-' + job.name">
          <input type="checkbox" class="rounded flex-shrink-0" :checked="isJobSelected(job.name)" @click="toggleJobWithShift($index, $event)" :data-testid="'job-row-' + job.name + '-checkbox'" aria-label="job row job name checkbox" />
          <label class="flex-1 min-w-0 cursor-pointer" @click.prevent="toggleJobWithShift($index, $event)">
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full flex-shrink-0 inline-block"
                    :class="{
                      'bg-emerald-500': getJobLastStatus(job) === 'passed',
                      'bg-rose-500': getJobLastStatus(job) === 'failed',
                      'bg-amber-400 animate-pulse': getJobLastStatus(job) === 'running',
                      'bg-slate-400': !getJobLastStatus(job)
                    }">
              </span>
              <span class="font-medium text-slate-800 truncate" x-text="job.name"></span>
              <span class="badge text-xs" :class="'jtype-' + (job.job_type || 'reconciliation')" x-text="job.job_type || 'reconciliation'"></span>
            </div>
            <div class="text-muted truncate" x-text="job.description"></div>
            <template x-if="job.tags && job.tags.length">
              <div class="flex flex-wrap gap-1 mt-0.5">
                <template x-for="tag in job.tags" :key="tag">
                  <span class="px-1.5 py-0.5 rounded text-xs bg-indigo-100 text-indigo-700" x-text="tag"></span>
                </template>
              </div>
            </template>
          </label>
          <div class="flex items-center gap-1 flex-shrink-0">
            <span x-show="jobGateVerdicts[job.name]" class="badge text-xs"
                  :class="(jobGateVerdicts[job.name] || {}).verdict === 'PROMOTE' ? 'text-emerald-700 bg-emerald-50' : 'text-rose-700 bg-rose-50'"
                  :data-testid="'job-row-' + job.name + '-gate-verdict'"
                  x-text="(jobGateVerdicts[job.name] || {}).verdict"></span>
            <button @click.stop="checkJobGate(job.name)" class="btn-secondary btn-sm text-xs" :data-testid="'job-row-' + job.name + '-gate-btn'">Gate</button>
            <button x-show="job.job_type === 'bo_report' || job.job_type === 'reconciliation'"
                    @click.stop="openCompareForJob(job)" class="btn-secondary btn-sm text-xs"
                    :data-testid="'job-row-' + job.name + '-compare-btn'">Compare</button>
            <button @click.stop="job.job_type === 'compare' ? openCompareForJob(job) : openEditJobModal(job)" class="btn-secondary btn-sm text-xs" :data-testid="'job-row-' + job.name + '-edit-btn'">Edit</button>
            <button @click.stop="deleteJob(job.name)" class="btn-danger btn-sm text-xs" :data-testid="'job-row-' + job.name + '-delete-btn'">Del</button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Job Modal -->
  <div x-show="showJobModal" x-cloak class="modal-backdrop" @click.self="showJobModal = false" data-testid="job-modal">

      <div class="flex items-center mb-4">
        <h2 id="jobDialogTitle" class="text-lg font-bold" x-text="jobModalEditing ? 'Edit Job' : 'New Job'"></h2>
        <button @click="showSaveTemplatePrompt = !showSaveTemplatePrompt"
                class="btn-outline btn-sm ml-auto text-xs">
          Save as Template
        </button>
      </div>

      <div x-show="showSaveTemplatePrompt" class="mb-3 flex gap-2">
        <input type="text"
               x-model="jobTemplateName"
               placeholder="Template name..."
               class="field-input text-sm flex-1" aria-label="template name">
        <button @click="saveJobAsTemplate()" class="btn-primary btn-sm text-sm">Save</button>
        <button @click="showSaveTemplatePrompt = false" class="btn-outline btn-sm text-sm">Cancel</button>
      </div>

      <template x-if="jobTemplates && jobTemplates.length > 0">
        <div class="mb-3">
          <select @change="loadJobTemplate($event.target.value); $event.target.value=''"
                  class="field-input text-sm" aria-label="select">
            <option value="">-- Use template --</option>
            <template x-for="tmpl in jobTemplates" :key="tmpl.name">
              <option :value="tmpl.name" x-text="tmpl.name"></option>
            </template>
          </select>
        </div>
      </template>

      <div class="flex border-b mb-4 overflow-x-auto">
        <template x-for="tab in jobModalTabs" :key="tab.id">
          <button @click="jobModalTab = tab.id"
                  class="px-4 py-2 text-sm whitespace-nowrap border-b-2 -mb-px transition-colors"
                  :class="jobModalTab === tab.id ? 'border-indigo-500 text-indigo-600 font-medium' : 'border-transparent text-slate-500 hover:text-slate-700'"
                  :data-testid="'job-modal-tab-' + tab.id">
            <span x-text="tab.label"></span>
          </button>
        </template>
      </div>

      <div x-show="jobModalTab === 'basic'" class="space-y-3">
        <div>
          <label  class="field-label" for="a11y-launch-job-name">Job Name *</label>
          <input x-model="jobModal.name" class="field-input" :disabled="jobModalEditing" placeholder="orders_reconciliation" data-testid="job-modal-name-input" id="a11y-launch-job-name" />
        </div>
        <div>
          <label  class="field-label" for="a11y-launch-description">Description</label>
          <input x-model="jobModal.description" class="field-input" id="a11y-launch-description" />
        </div>
        <div>
          <label  class="field-label" for="a11y-launch-job-type">Job Type</label>
          <select x-model="jobModal.job_type" class="field-input field-select" data-testid="job-modal-type-select" id="a11y-launch-job-type">
            <option value="reconciliation">reconciliation</option>
            <option value="compare">compare</option>
            <option value="bo_report">bo_report</option>
            <option value="bo_job">bo_job</option>
            <option value="ds_job">ds_job</option>
            <option value="automic_job">automic_job</option>
            <option value="dbt_artifact">dbt_artifact</option>
            <option value="freshness">freshness</option>
            <option value="schema_snapshot">schema_snapshot</option>
            <option value="profile">profile</option>
            <option value="cross_job_assertion">cross_job_assertion</option>
            <option value="api_reconciliation">api_reconciliation</option>
          </select>
        </div>
        <div x-show="['reconciliation','freshness','schema_snapshot','profile'].includes(jobModal.job_type)">
          <label  class="field-label" for="a11y-launch-input-source">Input Source</label>
          <select x-model="jobModal.source_mode" class="field-input field-select" data-testid="job-modal-source-mode-select" id="a11y-launch-input-source">
            <option value="sql">SQL Query</option>
            <option value="files">Files</option>
            <option value="bo_live">Live BO Report</option>
            <option value="multi_file" x-show="jobModal.job_type === 'reconciliation'">Multiple Files</option>
          </select>
        </div>
        <label class="flex items-center gap-2 text-sm cursor-pointer">
          <input type="checkbox" class="rounded" x-model="jobModal.enabled" aria-label="jobmodal enabled" /> Enabled
        </label>
      </div>

      <div x-show="jobModalTab === 'settings'" class="space-y-3">
        <div x-show="jobModal.job_type === 'reconciliation' && !['files', 'bo_live'].includes(jobModal.source_mode)">
          <label  class="field-label" for="a11y-launch-sql-query">SQL Query</label>
          <textarea x-model="jobModal.query" rows="4" class="field-input font-mono text-xs"
                    placeholder="SELECT * FROM orders WHERE date = :run_date"
                    @input="validateJobModal()"
                    data-testid="job-modal-query-textarea" id="a11y-launch-sql-query"></textarea>
          <p x-show="jobModalValidation && jobModalValidation.sql"
             class="text-xs mt-1"
             :class="jobModalValidation && jobModalValidation.sql && jobModalValidation.sql.startsWith('✓') ? 'text-emerald-600' : 'text-amber-600'"
             x-text="jobModalValidation && jobModalValidation.sql ? jobModalValidation.sql : ''">
          </p>
          <div class="flex items-center mt-1">
            <button @click="showHelp('sqlQuery')" class="btn-link btn-sm text-slate-400 ml-1" title="Learn more about SQL queries">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </button>
          </div>
          <div class="mt-3 border border-slate-200 rounded-lg overflow-hidden">
            <div class="flex items-center gap-2 px-3 py-2 bg-slate-50 border-b border-slate-200">

              <button @click="previewJobQuery()"
                      :disabled="jobModal.previewLoading || !jobModal.query?.trim()"
                      class="btn-sm btn-secondary text-xs px-3 py-1 disabled:opacity-40">
                <span x-show="!jobModal.previewLoading">Run Preview</span>
                <span x-show="jobModal.previewLoading">Loading…</span>

                      <th x-text="col" class="px-2 py-1 text-left font-medium text-slate-600 whitespace-nowrap border-r border-slate-200 last:border-r-0" scope="col"></th>
                    </template>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="(row, ri) in (jobModal.previewResult?.rows || [])" :key="ri">

                      <template x-for="(cell, ci) in row" :key="ci">
                        <td x-text="cell ?? 'NULL'" class="px-2 py-1 border-r border-slate-100 last:border-r-0 whitespace-nowrap max-w-xs truncate"

                      </template>
                    </tr>
                  </template>

              </table>

            </div>
            <div>
              <label  class="field-label" for="a11y-launch-source-label">Source Label</label>
              <input x-model="jobModal.source_file_label" class="field-input" placeholder="Source file" id="a11y-launch-source-label" />
            </div>
            <div x-show="jobModal.job_type === 'reconciliation'">
              <label  class="field-label" for="a11y-launch-target-label">Target Label</label>

            </div>

        <div x-show="['reconciliation','bo_report','api_reconciliation'].includes(jobModal.job_type)">

          <input x-model="jobModal.key_columns_raw" class="field-input" placeholder="id" @input="validateJobModal()" data-testid="job-modal-key-columns-input" id="a11y-launch-key-columns-comma-separated" />
        </div>
        <div x-show="['reconciliation','bo_report','api_reconciliation'].includes(jobModal.job_type)">

          <input x-model="jobModal.exclude_columns_raw" class="field-input" placeholder="loaded_at" data-testid="job-modal-exclude-columns-input" id="a11y-launch-exclude-columns-comma-separated" />
        </div>

            <div class="flex gap-2">
              <button @click="loadBoParametersFromDocument()" data-testid="job-modal-bo-params-load-btn"

          <template x-if="jobModal.bo_parameters && jobModal.bo_parameters.length > 0">

<template x-if="currentView === 'sequences'"><div data-testid="sequences-panel">

          <span class="field-label">Tags (comma separated)</span>
          <input class="field-input" x-model="sequenceMeta.tags_raw" aria-label="sequence tags" />
        </label>
      </div>

<details class="card card-compact mb-3" data-testid="sequence-preconditions">
  <summary class="text-sm cursor-pointer">Preconditions — when may this sequence run?</summary>

    Checked once before the sequence starts. If a gate says no, nothing runs and no run is recorded.
  </p>

  <label class="field-inline mt-3">
    <input type="checkbox" x-model="sequencePreconditions.time_window_enabled"
           data-testid="precondition-window-toggle" aria-label="restrict to a time window" />

  </label>
  <div class="grid grid-cols-2 gap-3" x-show="sequencePreconditions.time_window_enabled">
    <label class="field">
      <span class="field-label">From</span>
      <input type="time" class="field-input" data-testid="precondition-window-start"
             x-model="sequencePreconditions.time_window_start" aria-label="window start" />
    </label>
    <label class="field">
      <span class="field-label">Until</span>
      <input type="time" class="field-input" data-testid="precondition-window-end"
             x-model="sequencePreconditions.time_window_end" aria-label="window end" />
    </label>
  </div>
  <p class="text-xs text-muted" x-show="sequencePreconditions.time_window_enabled">
    Uses the application timezone. An end time earlier than the start wraps past midnight.
  </p>

  <label class="field-inline mt-3">
    <input type="checkbox" x-model="sequencePreconditions.weekdays_enabled"
           data-testid="precondition-weekdays-toggle" aria-label="restrict to weekdays" />

  <div class="flex flex-wrap gap-2" x-show="sequencePreconditions.weekdays_enabled"
       data-testid="precondition-weekdays">

      <label class="chip cursor-pointer">
        <input type="checkbox" :checked="sequencePreconditions.weekdays.includes(day.value)"
               @change="toggleWeekday(day.value)" :aria-label="day.label" />
        <span x-text="day.label"></span>
      </label>
    </template>
  </div>

  <label class="field-inline mt-3">
    <input type="checkbox" x-model="sequencePreconditions.require_run_enabled"
           data-testid="precondition-upstream-toggle" aria-label="require a recent successful job" />
    <span>Only after another job has succeeded recently</span>
  </label>
  <div class="grid grid-cols-2 gap-3" x-show="sequencePreconditions.require_run_enabled">
    <label class="field">
      <span class="field-label">Job</span>
      <select class="field-input" data-testid="precondition-upstream-job"
              x-model="sequencePreconditions.require_run_job" aria-label="upstream job">
        <option value="">Select a job…</option>
        <template x-for="job in jobs" :key="job.name">
          <option :value="job.name" x-text="job.name"></option>
        </template>
      </select>
    </label>
    <label class="field">
      <span class="field-label">Within the last (hours)</span>
      <input type="number" min="1" class="field-input" data-testid="precondition-upstream-hours"
             x-model.number="sequencePreconditions.require_run_hours" aria-label="within hours" />
    </label>
  </div>
</details>

      <div class="space-y-3" data-testid="sequence-step-editor">
        <template x-for="(step, index) in sequenceSteps" :key="index">
          <div class="card card-compact">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <label class="field">
                <span class="field-label">Job</span>
                <select class="field-input" :data-testid="'sequence-step-job-' + index"
                        x-model="step.job_name" @change="onSequenceJobPicked(step)"
                        aria-label="step job">
                  <option value="">Select a job…</option>
                  <template x-for="job in jobs" :key="job.name">
                    <option :value="job.name" x-text="job.name"></option>
                  </template>
                </select>
              </label>
              <label class="field">
                <span class="field-label">Step id</span>
                <input class="field-input" :data-testid="'sequence-step-id-' + index"
                       x-model="step.step_id" @input="validateSequenceSteps()"
                       aria-label="step id" />
              </label>
              <div class="field">
                <span class="field-label">Runs after</span>
                <div class="flex flex-wrap gap-2" :data-testid="'sequence-step-deps-' + index">
                  <template x-for="parent in sequenceParentOptions(step)" :key="parent">
                    <label class="chip cursor-pointer">
                      <input type="checkbox" :checked="(step.depends_on || []).includes(parent)"
                             @change="toggleSequenceDependency(step, parent)"
                             :aria-label="'depends on ' + parent" />
                      <span x-text="parent"></span>
                    </label>
                  </template>
                  <span class="text-xs text-muted" x-show="sequenceParentOptions(step).length === 0">
                    No other steps yet
                  </span>
                </div>
              </div>
              <label class="field" x-show="(step.depends_on || []).length > 0">
                <span class="field-label">Run this step when</span>
                <select class="field-input" :data-testid="'sequence-step-trigger-' + index"
                        x-model="step.trigger_rule" @change="validateSequenceSteps()"
                        aria-label="trigger rule">
                  <option value="all_success">All parents succeeded</option>
                  <option value="all_done">All parents finished, whatever the outcome</option>
                  <option value="any_success">At least one parent succeeded</option>
                  <option value="all_failed">All parents failed</option>
                </select>
              </label>
            </div>

            <details class="mt-2">
              <summary class="text-sm cursor-pointer">Advanced</summary>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-2">
                <label class="field-inline">
                  <input type="checkbox" x-model="step.hold_after" aria-label="hold after this step" />
                  <span>Hold after this step</span>
                </label>
                <label class="field">
                  <span class="field-label">Wait before this step (seconds)</span>
                  <input type="number" min="0" class="field-input" x-model.number="step.wait_seconds"
                         aria-label="wait seconds" />
                </label>
                <label class="field">
                  <span class="field-label">Retries on error</span>
                  <input type="number" min="0" max="10" class="field-input"
                         :data-testid="'sequence-step-retries-' + index"
                         x-model.number="step.max_retries" placeholder="Inherit from run settings"
                         aria-label="max retries" />
                </label>
                <label class="field">
                  <span class="field-label">Delay between retries (seconds)</span>
                  <input type="number" min="0" class="field-input"
                         x-model.number="step.retry_delay_seconds" placeholder="Inherit from run settings"
                         aria-label="retry delay seconds" />
                </label>
                <label class="field">
                  <span class="field-label">If this step fails</span>
                  <select class="field-input" :data-testid="'sequence-step-onfailure-' + index"
                          x-model="step.on_failure" aria-label="on failure">
                    <option value="skip_downstream">Carry on — dependent steps decide for themselves</option>
                    <option value="continue">Carry on and don't count this failure against the run</option>
                    <option value="stop">Stop the whole run</option>
                  </select>
                </label>
              </div>
              <p class="text-xs text-muted mt-2">
                Only errors are retried. A failed data comparison is a real result, so re-running it cannot change the outcome.
              </p>
            </details>

            <template x-for="issue in sequenceIssuesFor(step.step_id)" :key="issue.field + issue.message">
              <div class="text-xs text-danger mt-1" x-text="issue.message"></div>
            </template>

            <div class="mt-2 text-right">
              <button class="btn btn-ghost btn-xs" :data-testid="'sequence-step-remove-' + index"
                      @click="removeSequenceStep(index)">Remove step</button>
            </div>
          </div>
        </template>
      </div>

      <button class="btn btn-secondary btn-sm mt-3" data-testid="sequence-add-step"
              @click="addSequenceStep()">Add step</button>

      <template x-for="issue in sequenceGlobalIssues" :key="issue.field + issue.message">
        <div class="text-sm text-danger mt-2" data-testid="sequence-global-error" x-text="issue.message"></div>
      </template>

      <!-- Read-only graph preview, laid out by dependency depth. -->
      <div class="mt-4" x-show="sequenceOrder.length" data-testid="sequence-graph-preview">
        <div class="field-label">Execution order preview</div>
        <div class="flex flex-col gap-2">
          <template x-for="level in sequenceLevels" :key="level.index">
            <div class="flex items-center gap-2">
              <span class="text-xs text-muted w-16" x-text="'level ' + (level.index + 1)"></span>
              <div class="flex flex-wrap gap-2">
                <template x-for="step in level.steps" :key="step.step_id">
                  <span class="chip" x-text="step.step_id"></span>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" @click="sequenceEditorOpen = false">Cancel</button>
        <button class="btn btn-primary" data-testid="sequence-save-btn"
                :disabled="!sequenceIsValid || sequenceSaving"
                @click="saveSequence()">Save</button>
      </div>
    </div>
  </div>
</div></template>


<!-- ====================================================================

     ==================================================================== -->
<template x-if="currentView === 'monitor'"><div>
  <div class="section-header">
    <div>
      <div class="section-title">Execution Monitor</div>
      <div class="section-sub">Live progress of running and recent tests</div>
    </div>

      <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>

    </div>
  </div>

  <template x-if="activeRuns.length === 0">
    <div class="card empty-state">
      <div class="empty-state-icon">📡</div>
      <div class="empty-state-title">No active runs</div>

        <button @click="currentView='jobs'" data-testid="monitor-launch-link" class="text-indigo-500 hover:underline">Launch a test →</button>
      </div>
    </div>
  </template>

  <div class="space-y-4">
    <template x-for="run in activeRuns" :key="run.run_id">
      <div class="card" :data-testid="'monitor-run-' + run.run_id">
        <div class="flex items-start justify-between mb-4">
          <div>
            <div class="flex items-center gap-2">
              <span class="font-mono text-sm text-slate-400" x-text="run.run_id.substring(0,8)+'…'"></span>
              <span class="badge" :class="statusBadgeClass(run.status)" :data-testid="'monitor-run-status-' + run.run_id" x-text="run.status"></span>
            </div>
            <div class="text-muted mt-1">
              <span x-text="run.source_env||'?'"></span> → <span x-text="run.target_env||'?'"></span>
              <span class="ml-2" x-text="run.started_at ? 'Started ' + fmtDate(run.started_at) : 'Pending…'"></span>
            </div>
            <template x-if="run._progress && run._progress.current_job">
              <div class="text-muted mt-1 text-xs">
                Running: <span class="font-mono text-indigo-600" x-text="run._progress.current_job"></span>
              </div>
            </template>
          </div>
          <div class="text-right space-y-2">
            <div class="text-2xl font-bold text-slate-700" x-text="run.total_tests"></div>
            <div class="text-muted">tests</div>
            <button @click="cancelRun(run.run_id)"
                    x-show="!isTerminalStatus(run.status)"
                    :disabled="cancellingRuns[run.run_id] || run.cancel_requested"
                    :data-testid="'monitor-cancel-btn-' + run.run_id"
                    class="btn-danger btn-sm text-xs disabled:opacity-50"
                    x-text="run.cancel_requested ? 'Cancel requested' : (cancellingRuns[run.run_id] ? 'Cancelling...' : 'Cancel')"></button>
          </div>
        </div>

        <!-- Progress bar -->
        <div class="progress-track mb-4">
          <div class="progress-fill" :style="'width:' + runProgress(run) + '%'"></div>
        </div>

        <!-- Stat mini-cards -->
        <div class="grid-stat">
          <div class="stat-card stat-emerald">
            <div class="stat-card-label">Passed</div>
            <div class="stat-card-value" x-text="run.passed"></div>
          </div>
          <div class="stat-card stat-rose">
            <div class="stat-card-label">Failed</div>
            <div class="stat-card-value" x-text="run.failed"></div>
          </div>
          <div class="stat-card stat-amber">
            <div class="stat-card-label">Slow</div>
            <div class="stat-card-value" x-text="run.slow"></div>
          </div>
          <div class="stat-card stat-indigo">
            <div class="stat-card-label">Error</div>
            <div class="stat-card-value" x-text="run.error"></div>
          </div>
        </div>

        <!-- Step timeline (shown when run has step data) -->
        <template x-if="runStepsCache[run.run_id] && runStepsCache[run.run_id].length > 0">
          <div class="mt-4">
            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Execution Steps</div>
            <div class="space-y-1.5">
              <template x-for="step in runStepsCache[run.run_id]" :key="step.step_index">
                <div class="flex items-center gap-3 px-3 py-2 rounded-lg bg-slate-50 border border-slate-100">
                  <span class="text-xs font-bold text-slate-400 w-5 text-center" x-text="step.step_index + 1"></span>
                  <span class="flex-1 text-sm font-medium text-slate-700" x-text="step.job_name"></span>
                  <span class="badge text-xs" :class="stepStatusBadgeClass(step.status)" x-text="step.status"></span>
                  <template x-if="step.status === 'HELD'">
                    <button @click="openStepRelease(run.run_id, step.step_index)" class="btn-primary btn-sm text-xs py-1 px-3">Release</button>
                  </template>
                </div>
              </template>
            </div>
            <div class="mt-3" data-testid="monitor-step-timeline">
              <div class="field-label">Step timeline</div>
              <template x-for="level in monitorStepLevels(runStepsCache[run.run_id])" :key="level.index">
                <div class="flex items-start gap-3 py-1">
                  <span class="text-xs text-muted w-16 pt-1" x-text="'level ' + (level.index + 1)"></span>
                  <div class="flex flex-wrap gap-2">
                    <template x-for="step in level.steps" :key="step.step_id || step.step_index">
                      <div class="chip flex items-center gap-2"
                           :data-testid="'monitor-step-' + (step.step_id || step.step_index)">
                        <span x-text="step.step_id || step.job_name"></span>
                        <span :class="monitorStepBadgeClass(step.status)" x-text="step.status"></span>
                        <span class="text-xs text-muted" x-show="(step.attempt || 0) > 1"
                              x-text="'try ' + step.attempt"></span>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- HELD alert -->
        <template x-if="run._progress && run._progress.held_step != null">
          <div class="mt-3 flex items-center gap-3 p-3 rounded-lg bg-amber-50 border border-amber-200">
            <span class="text-amber-600 font-semibold text-sm">⏸ Sequence held at step <span x-text="(run._progress.held_step + 1)"></span></span>
            <button @click="loadRunSteps(run.run_id)" class="btn-secondary btn-sm text-xs">Load steps</button>
          </div>
        </template>
      </div>
    </template>
  </div>
</div></template>
