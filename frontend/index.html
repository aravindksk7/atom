        <label  class="field-label" for="a11y-aws-expected-status">Expected Run Status</label>
        <select x-model="awsAirflowExpectedStatus" class="field-input field-select" data-testid="aws-airflow-expected-status-select" id="a11y-aws-expected-status">
          <option value="success">success</option>
          <option value="failed">failed</option>
        </select>
      </div>

      <div class="mt-4 mb-3">
        <label class="block text-sm font-medium text-slate-700 mb-2">Task Assertions (optional)</label>
        <template x-for="(ta, index) in awsAirflowTaskAssertions" :key="index">
          <div class="flex items-center gap-2 mb-2">
            <input x-model="ta.task_id" class="field-input w-48" placeholder="task_id e.g. extract" data-testid="aws-airflow-task-assertion-id" />
            <select x-model="ta.state" class="field-input w-36" data-testid="aws-airflow-task-assertion-state">
              <option value="success">success</option>
              <option value="failed">failed</option>
              <option value="skipped">skipped</option>
              <option value="upstream_failed">upstream_failed</option>
            </select>
            <button type="button" @click="awsAirflowRemoveTaskAssertion(index)" class="text-rose-500 hover:bg-rose-50 px-2 py-1 rounded" data-testid="aws-airflow-remove-task-assertion-btn">&times;</button>
          </div>
        </template>
        <button type="button" @click="awsAirflowAddTaskAssertion()" class="text-sm text-blue-600 hover:underline" data-testid="aws-airflow-add-task-assertion-btn">+ Add Task Assertion</button>
      </div>

      <div class="flex gap-2 flex-wrap mb-3">
        <button @click="awsAirflowLoadDags()" :disabled="awsAirflowLoading || !awsConfigId" class="btn-secondary" data-testid="aws-airflow-load-dags-btn">Load DAGs</button>
        <button @click="awsAirflowTriggerDag()" :disabled="awsAirflowLoading || !awsConfigId || !awsAirflowDagId" class="btn-secondary" data-testid="aws-airflow-trigger-btn">Trigger DAG Run</button>
        <button @click="awsAirflowRunDag()" :disabled="awsAirflowLoading || !awsConfigId || !awsAirflowDagId" class="btn-primary" data-testid="aws-airflow-run-btn">Run DAG to Completion</button>
        <button @click="awsCreateAirflowRunJob()" :disabled="awsAirflowLoading || !awsConfigId || !awsAirflowDagId" class="btn-secondary" data-testid="aws-airflow-create-job-btn">Create Airflow Run Job</button>
      </div>

      <div x-show="awsAirflowLoading" class="text-muted mb-3" data-testid="aws-airflow-loading">Running...</div>
      <div x-show="awsAirflowError" class="bg-rose-50 border-rose-200 text-rose-700 border rounded-lg p-2 text-sm mb-3" data-testid="aws-airflow-error" x-text="awsAirflowError"></div>

      <div x-show="awsAirflowResult" data-testid="aws-airflow-result" class="text-sm">
        <div class="flex gap-2 flex-wrap mb-2">
          <span>State: <strong x-text="awsAirflowResult && awsAirflowResult.state"></strong></span>
          <span>DAG: <strong x-text="awsAirflowResult && awsAirflowResult.dag_id"></strong></span>
          <span>DAG Run ID: <strong x-text="awsAirflowResult && awsAirflowResult.dag_run_id"></strong></span>
        </div>
        <template x-if="awsAirflowResult && awsAirflowResult.task_instances && awsAirflowResult.task_instances.length">
          <div class="overflow-x-auto">
            <table class="results-table text-sm" aria-label="aws table airflow">
              <thead>
                <tr>
                  <th scope="col">Task</th>
                  <th scope="col">State</th>
                  <th scope="col">Duration</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="ti in awsAirflowResult.task_instances" :key="ti.task_id">
                  <tr>
                    <td x-text="ti.task_id"></td>
                    <td x-text="ti.state"></td>
                    <td x-text="ti.duration != null ? ti.duration : ''"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
        <template x-if="awsAirflowResult && awsAirflowResult.task_instances && !awsAirflowResult.task_instances.length">
          <div class="text-muted">No task instances.</div>
        </template>
      </div>
    </div>
  </div>
</div></template>


<!-- ====================================================================
     TAB 6 – REPORTS
     ==================================================================== -->
<template x-if="currentView === 'reports'"><div>
  <div class="section-header">
    <div>
      <div class="section-title">Report Viewer</div>
      <div class="section-sub">View generated HTML reports for completed runs</div>
    </div>
  </div>

  <div class="card mb-4">
    <div class="font-semibold text-slate-700 mb-3">Select a Run</div>
    <div class="flex gap-3">
      <select data-testid="reports-run-select" x-model="reportRunId" @change="resetReportArtifacts()" class="field-input field-select flex-1" aria-label="reports run select">
        <option value="">— Choose run —</option>
        <template x-for="run in runs" :key="run.run_id">
          <option :value="run.run_id" x-text="run.run_id.substring(0,8) + '… [' + run.status + ']'"></option>
        </template>
      </select>
      <button data-testid="reports-load-btn" @click="loadReport()" :disabled="!reportRunId" class="btn-primary">Load</button>
    </div>
  </div>

  <template x-if="reportRunId">
    <div class="compare-subtabs mb-4">
      <button data-testid="reports-subtab-report" @click="switchReportView('report')" :class="reportView === 'report' ? 'sub-tab active' : 'sub-tab'">Report</button>
      <button data-testid="reports-subtab-metrics" @click="switchReportView('metrics')" :class="reportView === 'metrics' ? 'sub-tab active' : 'sub-tab'">Metrics</button>
      <button data-testid="reports-subtab-logs" @click="switchReportView('logs')" :class="reportView === 'logs' ? 'sub-tab active' : 'sub-tab'">Logs</button>
    </div>
  </template>

  <template x-if="reportRunId && reportLoaded && reportView === 'report'">
    <div>
      <div class="card p-0 overflow-hidden report-frame-card">
      <iframe data-testid="reports-iframe" :src="reportBlobUrl" class="w-full h-full border-none"></iframe>
      </div>
    </div>
  </template>

  <template x-if="reportRunId && reportLoaded && reportView === 'metrics'">
    <div class="space-y-4">
      <div class="flex gap-2 mb-3 flex-wrap">
        <button data-testid="reports-metrics-refresh-btn" @click="loadRunMetrics()" :disabled="reportMetricsLoading" class="btn-secondary btn-sm">
          <span x-text="reportMetricsLoading ? 'Refreshing…' : 'Refresh Metrics'"></span>
        </button>
      </div>
      <template x-if="reportMetricsLoading">
        <div class="card empty-state"><div class="empty-state-title">Loading metrics…</div></div>
      </template>
      <template x-if="!reportMetricsLoading && reportMetrics">
        <div>
          <div class="metric-grid mb-4">
            <div class="metric-card metric-cyan">
              <div class="metric-label">Pass Rate</div>
              <div class="metric-value" x-text="metricsPassRate(reportMetrics) + '%'"></div>
              <div class="metric-bar"><span :style="'width:' + metricsPassRate(reportMetrics) + '%'"></span></div>
            </div>
            <div class="metric-card metric-green"><div class="metric-label">Passed</div><div class="metric-value" x-text="reportMetrics.passed || 0"></div></div>
            <div class="metric-card metric-rose"><div class="metric-label">Failed</div><div class="metric-value" x-text="reportMetrics.failed || 0"></div></div>
            <div class="metric-card metric-amber"><div class="metric-label">Slow</div><div class="metric-value" x-text="reportMetrics.slow || 0"></div></div>
            <div class="metric-card metric-violet"><div class="metric-label">Duration</div><div class="metric-value" x-text="(reportMetrics.total_duration_seconds || 0).toFixed(3) + 's'"></div></div>
          </div>
          <div class="card overflow-hidden p-0">
            <table class="data-table" aria-label="reports table 1">
              <thead><tr><th scope="col">Test</th><th scope="col">Status</th><th scope="col">Duration</th><th scope="col">Files</th><th scope="col">Source Rows</th><th scope="col">Target Rows</th><th scope="col">Issues</th><th scope="col"></th></tr></thead>
              <tbody>
                <template x-if="!reportMetrics.tests || reportMetrics.tests.length === 0">
                  <tr><td colspan="9" class="text-center text-muted py-4">No per-test metrics were recorded.</td></tr>
                </template>
                <template x-for="t in (reportMetrics.tests || [])" :key="t.name">
                  <tr :class="(t.status||'').toUpperCase()==='FAILED' ? 'metric-row-failed' : (t.status||'').toUpperCase()==='SLOW' ? 'metric-row-slow' : ''">
                    <td class="font-mono text-xs" x-text="t.name"></td>
                    <td><span class="badge" :class="statusBadgeClass(t.status)" x-text="t.status"></span></td>
                    <td :class="(t.status||'').toUpperCase()==='SLOW' ? 'text-amber-400 font-semibold' : ''" x-text="t.duration_seconds != null ? t.duration_seconds.toFixed(3) + 's' : '-'"></td>
                    <td class="font-mono text-xs" x-text="(t.source_file_name || t.target_file_name) ? (t.source_file_name || 'N/A') + ' → ' + (t.target_file_name || 'N/A') : 'N/A'"></td>
                    <td x-text="t.source_row_count ?? 0"></td>
                    <td x-text="t.target_row_count ?? 0"></td>
                    <td :class="(t.total_issues ?? 0) > 0 ? 'text-rose-400 font-bold' : 'text-emerald-400'" x-text="t.total_issues ?? 0"></td>
                    <td>
                      <div class="metric-mini-bar">
                        <span :style="'width:100%;background:' + ((t.status||'').toUpperCase()==='FAILED' ? 'var(--rose)' : (t.status||'').toUpperCase()==='SLOW' ? 'var(--amber)' : 'var(--emerald)')"></span>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </template>
      <template x-if="!reportMetricsLoading && !reportMetrics">
        <div class="card empty-state"><div class="empty-state-title">Metrics are not available for this run</div></div>
      </template>
    </div>
  </template>

  <template x-if="reportRunId && reportLoaded && reportView === 'logs'">
    <div class="space-y-4">
      <!-- Search bar + level chips -->
      <div class="card">
        <div class="flex flex-col gap-3">
          <input
            x-model.debounce.300ms="logFilterQuery"
            class="field-input"
            data-testid="reports-logs-search-input"
            placeholder="Search logs… (live)"
          aria-label="search logs live" />
          <div class="flex gap-2 flex-wrap items-center">
            <button class="level-chip" :class="logFilterLevel === '' ? 'chip-active-ALL' : ''" @click="logFilterLevel = ''" data-testid="reports-logs-level-ALL">ALL</button>
            <button class="level-chip" :class="logFilterLevel === 'ERROR' ? 'chip-active-ERROR' : ''" @click="logFilterLevel = logFilterLevel === 'ERROR' ? '' : 'ERROR'" data-testid="reports-logs-level-ERROR">ERROR</button>
            <button class="level-chip" :class="logFilterLevel === 'WARNING' ? 'chip-active-WARNING' : ''" @click="logFilterLevel = logFilterLevel === 'WARNING' ? '' : 'WARNING'" data-testid="reports-logs-level-WARNING">WARN</button>
            <button class="level-chip" :class="logFilterLevel === 'INFO' ? 'chip-active-INFO' : ''" @click="logFilterLevel = logFilterLevel === 'INFO' ? '' : 'INFO'" data-testid="reports-logs-level-INFO">INFO</button>
            <button class="level-chip" :class="logFilterLevel === 'DEBUG' ? 'chip-active-DEBUG' : ''" @click="logFilterLevel = logFilterLevel === 'DEBUG' ? '' : 'DEBUG'" data-testid="reports-logs-level-DEBUG">DEBUG</button>
            <span class="text-muted text-xs ml-2" x-text="filteredLogEvents().length + ' / ' + allLogEvents.length + ' events'"></span>
            <template x-if="allLogEventsTruncated">
              <span class="text-xs text-amber ml-2" x-text="'Showing first 5,000 of ' + allLogEventsTotalLines.toLocaleString() + ' events'"></span>
            </template>
          </div>
        </div>
      </div>

      <!-- Loading state -->
      <template x-if="allLogEventsLoading">
        <div class="card empty-state"><div class="empty-state-title">Loading logs…</div></div>
      </template>

      <!-- No events for this run -->
      <template x-if="!allLogEventsLoading && allLogEvents.length === 0">
        <div class="card empty-state"><div class="empty-state-title">No log events for this run.</div></div>
      </template>

      <!-- Log list -->
      <template x-if="!allLogEventsLoading && allLogEvents.length > 0">
        <div class="card p-0 overflow-hidden">
          <div class="log-list" tabindex="0" aria-label="Run log events">
            <template x-if="filteredLogEvents().length === 0">
              <div class="empty-state"><div class="empty-state-title">No events match the current filter.</div></div>
            </template>
            <template x-for="line in filteredLogEvents()" :key="line.number">
              <div class="log-entry" :class="logLevelClass(line.level)">
                <div class="log-entry-meta">
                  <span class="font-mono" x-text="'#' + line.number"></span>
                  <span class="badge" x-text="line.level"></span>
                </div>
                <pre x-html="highlightMatch(line.text, logFilterQuery)"></pre>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </template>

  <template x-if="!reportLoaded && reportRunId">
    <div class="card empty-state">
      <div class="empty-state-title">Click "Load Report" to display the HTML report</div>
    </div>
  </template>
  <template x-if="!reportRunId">
    <div class="card empty-state">
      <div class="empty-state-icon">📊</div>
      <div class="empty-state-title">Select a run to view its report</div>
    </div>
  </template>
</div></template>

<!-- ====================================================================
     TAB - SCHEDULER REPORTS
     ==================================================================== -->
<template x-if="currentView === 'scheduler-reports'"><div data-testid="scheduler-reports-tab">
  <div class="section-header">
    <div>
      <div class="section-title">Scheduler Reports</div>
      <div class="section-sub">Monitor scheduled jobs, inspect timelines, analyze outcomes, export telemetry, and manage schedules.</div>
    </div>
    <div class="flex gap-2 flex-wrap">
      <button class="btn-secondary" @click="schedulerReportDownload('json')">Export JSON</button>
      <button class="btn-secondary" @click="schedulerReportDownload('csv')">Export CSV</button>
      <button class="btn-primary" @click="loadSchedulerReports()" :disabled="schedulerReportLoading">
        <span x-show="!schedulerReportLoading">Refresh</span>
        <span x-show="schedulerReportLoading">Refreshing...</span>
      </button>
    </div>
  </div>

  <div class="card scheduler-report-filters mb-4">
    <select class="field-input field-select" x-model.number="schedulerReportFilters.days" @change="loadSchedulerReports()" aria-label="schedulerreportfilters days">
      <option :value="7">Last 7 days</option>
      <option :value="30">Last 30 days</option>
      <option :value="90">Last 90 days</option>
    </select>
    <input class="field-input" x-model.debounce.300ms="schedulerReportFilters.job" @input="loadSchedulerReports()" placeholder="Filter by job or schedule" aria-label="filter by job or schedule" />
    <select class="field-input field-select" x-model="schedulerReportFilters.status" @change="loadSchedulerReports()" aria-label="schedulerreportfilters status">
      <option value="">All statuses</option>
      <option value="PASSED">Passed</option>
      <option value="FAILED">Failed</option>
      <option value="ERROR">Error</option>
      <option value="CANCELLED">Cancelled</option>
      <option value="BLOCKED">Blocked</option>
    </select>
    <input class="field-input" type="number" x-model="schedulerReportFilters.exitCode" @input.debounce.300ms="loadSchedulerReports()" placeholder="Exit code" aria-label="exit code" />
  </div>

  <template x-if="schedulerReportError">
    <div class="alert-error mb-4" x-text="schedulerReportError"></div>
  </template>

  <template x-if="schedulerReportWarnings.length">
    <div class="alert-warn mb-4">
      <template x-for="warning in schedulerReportWarnings" :key="warning"><div x-text="warning"></div></template>
    </div>
  </template>

  <div class="scheduler-report-cards mb-4" x-show="schedulerReportSummary">
    <div class="metric-card metric-slate"><div class="metric-label">Scheduler</div><div class="metric-value" x-text="schedulerReportSummary?.scheduler?.running ? 'Running' : 'Stopped'"></div></div>
    <div class="metric-card metric-emerald"><div class="metric-label">Success Rate</div><div class="metric-value" x-text="(schedulerReportSummary?.summary?.success_rate ?? 'N/A') + (schedulerReportSummary?.summary?.success_rate == null ? '' : '%')"></div></div>
    <div class="metric-card metric-rose"><div class="metric-label">Failures</div><div class="metric-value" x-text="(schedulerReportSummary?.summary?.failed || 0) + (schedulerReportSummary?.summary?.error || 0)"></div></div>
    <div class="metric-card metric-indigo"><div class="metric-label">Query Time</div><div class="metric-value" x-text="(schedulerReportSummary?.performance?.report_query_ms || 0) + ' ms'"></div></div>
  </div>

  <div class="card mb-4">
    <div class="font-semibold mb-3">Live Status Grid</div>
    <div class="table-scroll">
      <table class="data-table" aria-label="scheduler reports table 1">
        <thead><tr><th scope="col">Schedule</th><th scope="col">Status</th><th scope="col">Enabled</th><th scope="col">Cron</th><th scope="col">Next Run</th><th scope="col">Duration</th><th scope="col">Exit</th><th scope="col">Actions</th></tr></thead>
        <tbody>
          <template x-for="row in schedulerReportGrid" :key="row.schedule_id">
            <tr>
              <td x-text="row.schedule_name"></td>
              <td><span :class="schedulerStatusClass(row.last_status)" x-text="row.last_status || 'No telemetry'"></span></td>
              <td x-text="row.enabled ? 'Yes' : 'No'"></td>
              <td class="font-mono text-xs" x-text="row.cron_expr"></td>
              <td x-text="row.next_run_at ? fmtDate(row.next_run_at) : 'Not scheduled'"></td>
              <td x-text="row.last_duration_seconds == null ? 'N/A' : row.last_duration_seconds + 's'"></td>
              <td x-text="row.last_exit_code == null ? 'N/A' : row.last_exit_code"></td>
              <td class="flex gap-1 flex-wrap">
                <button class="btn-secondary btn-sm" @click="schedulerReportRunNow(row)">Run</button>
                <button class="btn-secondary btn-sm" @click="schedulerReportToggle(row)" x-text="row.enabled ? 'Disable' : 'Enable'"></button>
                <button class="btn-secondary btn-sm" @click="schedulerReportEdit(row)">Edit</button>
                <button class="btn-danger btn-sm" @click="schedulerReportDelete(row)">Delete</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

  <div class="scheduler-report-panels">
    <div class="card">
      <div class="font-semibold mb-3">Execution Timeline</div>
      <div class="scheduler-timeline">
        <template x-for="segment in schedulerReportTimeline" :key="segment.schedule_name + '-' + segment.started_at + '-' + segment.status">
          <div class="scheduler-timeline-row">
            <div class="scheduler-timeline-label" x-text="segment.schedule_name"></div>
            <div class="scheduler-timeline-bar" :class="schedulerStatusClass(segment.status)" :title="segment.status + ' · ' + (segment.duration_seconds || 0) + 's'" x-text="segment.status"></div>
          </div>
        </template>
      </div>
    </div>
    <div class="card">
      <div class="font-semibold mb-3">Outcome Analytics</div>
      <canvas id="scheduler-report-outcomes-chart" height="180"></canvas>
    </div>
  </div>

  <!-- x-if, not x-show: schedulerReportEditing is null while the modal is closed,
       and x-show keeps the subtree mounted, so the x-model bindings below would
       keep dereferencing null and log an Alpine expression error per field. -->
  <template x-if="schedulerReportEditing">
      <div class="modal-backdrop" @click.self="schedulerReportEditing = null">
       <div class="modal-box" x-ref="schedulerReportDialog" role="dialog" aria-modal="true" aria-labelledby="schedulerReportDialogTitle">
        <div class="drawer-header"><div id="schedulerReportDialogTitle" class="drawer-title">Edit Schedule</div><button class="drawer-close" aria-label="Close edit schedule" @click="schedulerReportEditing = null">x</button></div>
        <label  class="field-label" for="a11y-scheduler-reports-cron-expression">Cron expression</label>
        <input class="field-input mb-3" x-model="schedulerReportEditing.cron_expr" id="a11y-scheduler-reports-cron-expression" />
        <label class="inline-flex items-center gap-2 mb-4"><input type="checkbox" x-model="schedulerReportEditing.enabled" aria-label="schedulerreportediting enabled" /> Enabled</label>
        <div class="flex gap-2 justify-end"><button class="btn-secondary" @click="schedulerReportEditing = null">Cancel</button><button class="btn-primary" @click="schedulerReportSaveEdit()">Save</button></div>
      </div>
    </div>
  </template>
</div></template>

<!-- ====================================================================
     TAB - DIFFERENCES EXPLORER
     ==================================================================== -->
<template x-if="currentView === 'differences'"><div>
  <div class="section-header">
    <div>
      <div class="section-title">Differences Explorer</div>
      <div class="section-sub">Search and browse stored mismatch rows across a run, with insights</div>
    </div>
  </div>

  <div class="card mb-4">
    <div class="font-semibold text-slate-700 mb-3">Select a Run &amp; Test</div>
    <div class="flex gap-3 flex-wrap">
      <select data-testid="diff-run-select" x-model="diffRunId" @change="selectDifferenceRun(diffRunId)" class="field-input field-select flex-1" aria-label="diff run select">
        <option value="">— Choose run —</option>
        <template x-for="run in runs" :key="run.run_id">
          <option :value="run.run_id" x-text="runLabel(run) + ' [' + run.status + ']'"></option>
        </template>
      </select>
      <select data-testid="diff-test-select" x-model="diffResultId" @change="selectDifferenceResult(diffResultId)" :disabled="!diffTestOptions.length" class="field-input field-select flex-1" aria-label="diff test select">
        <option value="">— Choose test —</option>
        <template x-for="t in diffTestOptions" :key="t.id">
          <option :value="t.id" x-text="t.query_name + ' (' + t.total_issues + ' issues)'"></option>
        </template>
      </select>
    </div>
  </div>

  <template x-if="diffInsights">
    <div class="space-y-4 mb-4">
      <div class="metric-grid">
        <div class="metric-card metric-green"><div class="metric-label">Accepted</div><div class="metric-value" x-text="diffInsights.accepted_count"></div></div>
        <div class="metric-card metric-rose"><div class="metric-label">Open</div><div class="metric-value" x-text="diffInsights.open_count"></div></div>
      </div>
      <div class="flex gap-3 flex-wrap">
        <div class="card flex-1" style="min-width:280px">
          <div class="font-semibold text-slate-700 mb-2">Top Columns by Mismatch Count</div>
          <canvas id="diffColumnsChart" height="160"></canvas>
        </div>
        <div class="card flex-1" style="min-width:280px">
          <div class="font-semibold text-slate-700 mb-2">Mismatch Type Breakdown</div>
          <canvas id="diffTypeChart" height="160"></canvas>
        </div>
      </div>
    </div>
  </template>

  <template x-if="diffResultId">
    <div>
      <template x-if="!diffStoredComplete">
        <div class="card mb-4" style="border-left:3px solid #fbbf24">
          <div class="flex items-center justify-between gap-3 flex-wrap">
            <div>Showing <strong x-text="diffTotal"></strong> stored rows for this test — more differences exist than are stored. Run a full export for the rest.</div>
            <button class="btn-secondary btn-sm" @click="downloadAllDifferences(diffRunId, 'csv')" :disabled="isDifferenceExportBusy(diffRunId, 'csv')">
              <span x-text="differenceExportLabel(diffRunId, 'csv')"></span>
            </button>
          </div>
        </div>
      </template>

      <div class="card mb-4">
        <div class="flex items-center gap-3 flex-wrap">
          <span class="text-xs font-semibold text-slate-600" x-text="diffTotal + ' matching rows'"></span>
          <div class="flex gap-2 ml-auto">

          <button data-testid="compare-matrix-source-b-mode-api" @click="matrixSourceBType = 'api'" :class="matrixSourceBType === 'api' ? 'pill active' : 'pill'">API</button>
        </div>
        <input data-testid="compare-matrix-source-b-label-input" x-model="matrixSourceB.label" class="field-input mb-2" placeholder="Source B label" aria-label="source b label" />

        <template x-if="matrixSourceBType === 'sql'">
          <div class="space-y-2">
            <select data-testid="compare-matrix-source-b-config-select" x-model="matrixSourceB.configId" class="field-input field-select mb-2" aria-label="source b config">
              <option value="">Select config / connection</option>
              <template x-for="cfg in configs" :key="cfg.id"><option :value="cfg.id" x-text="cfg.name"></option></template>
            </select>
            <textarea data-testid="compare-matrix-source-b-query-textarea" x-model="matrixSourceB.queryOrTable" class="field-input" rows="3" placeholder="SELECT * FROM table_b" aria-label="sql query b"></textarea>
          </div>
        </template>

        <template x-if="matrixSourceBType === 'file'">
          <div class="space-y-2">
            <input data-testid="compare-matrix-source-b-path-input" x-model="matrixSourceB.filePath" class="field-input mb-2" placeholder="C:\path\to\file_b.csv" aria-label="file path b" />
            <input data-testid="compare-matrix-source-b-upload-input" type="file" accept=".csv,.xlsx,.xls,.json,.xml,.tsv,.txt,.parquet" @change="handleMatrixFileUpload($event, 'b')" class="field-input" aria-label="file upload b" />
            <div x-show="matrixSourceB.fileName" class="text-xs text-emerald-600 mt-1" x-text="matrixSourceB.fileName + ' loaded'"></div>
          </div>
        </template>

        <template x-if="matrixSourceBType === 'aws_athena'">
          <div class="space-y-2">
            <select data-testid="compare-matrix-source-b-athena-config" x-model="matrixSourceB.configId" class="field-input field-select mb-2" aria-label="athena config b">
              <option value="">Select Athena config</option>
              <template x-for="cfg in configs" :key="cfg.id"><option :value="cfg.id" x-text="cfg.name"></option></template>
            </select>
            <textarea data-testid="compare-matrix-source-b-athena-query-textarea" x-model="matrixSourceB.athenaQuery" class="field-input" rows="3" placeholder="SELECT * FROM athena_db.table_b" aria-label="athena query b"></textarea>
          </div>
        </template>

        <template x-if="matrixSourceBType === 'sap_bo'">
          <div class="space-y-2">
            <select data-testid="compare-matrix-source-b-bo-config" x-model="matrixSourceB.configId" class="field-input field-select mb-2" aria-label="bo config b">
              <option value="">Select BO config</option>
              <template x-for="cfg in configs" :key="cfg.id"><option :value="cfg.id" x-text="cfg.name"></option></template>
            </select>
            <input data-testid="compare-matrix-source-b-bo-doc" x-model="matrixSourceB.docId" class="field-input mb-2" placeholder="Document ID / Name" aria-label="bo doc id b" />
            <input data-testid="compare-matrix-source-b-bo-report" x-model="matrixSourceB.reportId" class="field-input" placeholder="Report ID / Name" aria-label="bo report id b" />
          </div>
        </template>

        <template x-if="matrixSourceBType === 'api'">
          <div class="space-y-2">
            <input data-testid="compare-matrix-source-b-api-url-input" x-model="matrixSourceB.endpointUrl" class="field-input mb-2" placeholder="https://api.example.com/data_b" aria-label="api url b" />
            <select x-model="matrixSourceB.httpMethod" class="field-input field-select" aria-label="http method b">
              <option value="GET">GET</option>
              <option value="POST">POST</option>
            </select>
          </div>
        </template>
      </div>
    </div>

    <!-- General Settings Card -->
    <div class="card space-y-3">
      <div class="grid-2">
        <div>
          <label class="field-label" for="matrix-key-columns">Key Columns <span class="text-slate-400 font-normal">(comma-separated)</span></label>
          <input id="matrix-key-columns" data-testid="matrix-key-columns-input" x-model="matrixKeyColumns" class="field-input" placeholder="id, user_id" />
        </div>
        <div>
          <label class="field-label" for="matrix-exclude-columns">Exclude Columns <span class="text-slate-400 font-normal">(comma-separated)</span></label>
          <input id="matrix-exclude-columns" data-testid="matrix-exclude-columns-input" x-model="matrixExcludeColumns" class="field-input" placeholder="created_at, etl_ts" />
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="field-label" for="matrix-numeric-tolerance">Numeric Tolerance</label>
          <input id="matrix-numeric-tolerance" data-testid="matrix-numeric-tolerance-input" x-model="matrixNumericTolerance" type="number" step="any" class="field-input" placeholder="0.0" />
        </div>
        <div class="flex items-center gap-2 pt-6">
          <input id="matrix-ignore-case" data-testid="matrix-ignore-case-checkbox" type="checkbox" x-model="matrixIgnoreCase" class="rounded" />
          <label for="matrix-ignore-case" class="text-sm">Ignore Case</label>
        </div>
        <div class="flex items-center gap-2 pt-6">
          <input id="matrix-trim-whitespace" data-testid="matrix-trim-whitespace-checkbox" type="checkbox" x-model="matrixTrimWhitespace" class="rounded" />
          <label for="matrix-trim-whitespace" class="text-sm">Trim Whitespace</label>
        </div>
        <div>
          <label class="field-label" for="matrix-backend">Backend</label>
          <select id="matrix-backend" data-testid="matrix-backend-select" x-model="matrixBackend" class="field-input">
            <option value="pandas">pandas</option>
            <option value="polars">polars</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-2">
        <button id="btn-run-matrix-compare" data-testid="btn-run-matrix-compare" @click="runMatrixCompare()" :disabled="matrixCompareLoading" class="btn-primary">
          <span x-show="!matrixCompareLoading">Run Matrix Compare</span>
          <span x-show="matrixCompareLoading">Comparing...</span>
        </button>
        <button data-testid="compare-matrix-save-job-btn" @click="openSaveCompareAsJob('matrix')"
                class="btn-secondary btn-sm text-xs">Save as Job</button>
      </div>
    </div>

    <!-- Matrix Compare Result Card -->
    <template x-if="matrixCompareResult">
      <div class="card space-y-3" id="matrix-compare-results" data-testid="matrix-compare-results">
        <div class="flex items-center justify-between border-b pb-2">
          <h3 class="text-sm font-semibold text-slate-700">Matrix Comparison Result</h3>
          <span data-testid="matrix-compare-status-badge" class="badge" :class="statusBadgeClass(matrixCompareResult.status)" x-text="matrixCompareResult.status"></span>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
          <div class="p-3 bg-slate-50 border rounded">
            <div class="text-xs text-slate-500 font-medium">Source Rows</div>
            <div data-testid="matrix-source-rows-count" class="text-lg font-bold text-slate-800" x-text="matrixCompareResult.results?.[0]?.source_row_count ?? matrixCompareResult.source_row_count ?? 0"></div>
          </div>
          <div class="p-3 bg-slate-50 border rounded">
            <div class="text-xs text-slate-500 font-medium">Target Rows</div>
            <div data-testid="matrix-target-rows-count" class="text-lg font-bold text-slate-800" x-text="matrixCompareResult.results?.[0]?.target_row_count ?? matrixCompareResult.target_row_count ?? 0"></div>
          </div>
          <div class="p-3 bg-rose-50 border border-rose-200 rounded">
            <div class="text-xs text-rose-600 font-medium">Missing Rows</div>
            <div data-testid="matrix-missing-rows-count" class="text-lg font-bold text-rose-700" x-text="(matrixCompareResult.results?.[0]?.missing_in_target_count || 0) + (matrixCompareResult.results?.[0]?.missing_in_source_count || 0)"></div>
          </div>
          <div class="p-3 bg-amber-50 border border-amber-200 rounded">
            <div class="text-xs text-amber-600 font-medium">Mismatches</div>
            <div data-testid="matrix-mismatched-count" class="text-lg font-bold text-amber-700" x-text="matrixCompareResult.results?.[0]?.value_mismatch_count || 0"></div>
          </div>
        </div>

        <template x-if="matrixCompareResult.results && matrixCompareResult.results.length">
          <table data-testid="matrix-compare-results-table" class="data-table mt-2">
            <thead>
              <tr>
                <th scope="col">Query / Label</th>
                <th scope="col">Status</th>
                <th scope="col">Source Rows</th>
                <th scope="col">Target Rows</th>
                <th scope="col">Missing in Target</th>
                <th scope="col">Missing in Source</th>
                <th scope="col">Mismatches</th>
                <th scope="col">Duration</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="r in matrixCompareResult.results" :key="r.id">
                <tr>
                  <td class="font-mono text-xs" x-text="r.query_name || 'matrix_test'"></td>
                  <td><span class="badge" :class="statusBadgeClass(r.status)" x-text="r.status"></span></td>
                  <td x-text="r.source_row_count ?? '-'"></td>
                  <td x-text="r.target_row_count ?? '-'"></td>
                  <td x-text="r.missing_in_target_count ?? 0"></td>
                  <td x-text="r.missing_in_source_count ?? 0"></td>
                  <td x-text="r.value_mismatch_count ?? 0"></td>
                  <td x-text="r.duration_seconds != null ? r.duration_seconds.toFixed(2) + 's' : '-'"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </template>
      </div>
    </template>
  </div>

  <!-- Save compare as Job -->
  <div x-show="saveJobModalOpen" x-cloak class="modal-backdrop" @click.self="saveJobModalOpen = false"
       data-testid="compare-save-job-modal">
    <div class="modal-box w-full max-w-lg" role="dialog" aria-modal="true" aria-labelledby="saveCompareJobTitle">
      <h2 id="saveCompareJobTitle" class="text-lg font-bold mb-4" x-text="editingCompareJob ? 'Update Job' : 'Save Compare as Job'"></h2>
      <div x-show="editingCompareJob" data-testid="compare-save-job-editing-note" class="text-xs text-slate-500 mb-3">
        Updating "<span x-text="editingCompareJob?.name"></span>".
        <button type="button" data-testid="compare-save-job-as-new" @click="saveCompareAsNewJob()" class="btn-link">Save as a new job instead</button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="field-label" for="compare-save-job-name">Job name</label>
          <input id="compare-save-job-name" data-testid="compare-save-job-name" x-model="saveJobName"
                 :disabled="!!editingCompareJob" class="field-input" placeholder="nightly_sales_bo_vs_prod" />
        </div>
        <div>
          <label class="field-label" for="compare-save-job-description">Description</label>
          <input id="compare-save-job-description" data-testid="compare-save-job-description"
                 x-model="saveJobDescription" class="field-input" />
        </div>
        <div>
          <label class="field-label" for="compare-save-job-tags">Tags (comma separated)</label>
          <input id="compare-save-job-tags" data-testid="compare-save-job-tags"
                 x-model="saveJobTags" class="field-input" placeholder="nightly, sales" />
        </div>
        <div x-show="saveJobError" data-testid="compare-save-job-error"
             class="text-sm text-rose-600" x-text="saveJobError"></div>
      </div>
      <div class="flex justify-end gap-2 mt-4">
        <button @click="saveJobModalOpen = false" class="btn-outline btn-sm">Cancel</button>
        <button data-testid="compare-save-job-confirm" @click="saveCompareAsJob()"
                :disabled="saveJobSaving" class="btn-primary btn-sm" x-text="editingCompareJob ? 'Update Job' : 'Save Job'"></button>
      </div>
    </div>
  </div>
</div></template>

<!-- ====================================================================
     TAB - GLOBAL LOGS
     ==================================================================== -->
<template x-if="currentView === 'logs'"><div data-testid="global-logs-panel">
  <div class="section-header">
    <div>
      <div class="section-title">Logs</div>
      <div class="section-sub">Server-wide application log, auto-refreshing every 5 seconds.</div>
    </div>
  </div>

  <div class="space-y-4">
    <div class="card">
      <div class="flex flex-col gap-3">
        <input
          x-model="globalLogRunId"
          @change="loadGlobalLogs()"
          class="field-input"
          data-testid="logs-run-id-input"
          placeholder="Filter to a run ID… (optional)"
        aria-label="filter to a run id optional" />
        <input
          x-model="globalLogFilterQuery"
          class="field-input"
          data-testid="logs-search-input"
          placeholder="Search logs… (live)"
        aria-label="search logs live" />
        <div class="flex gap-2 flex-wrap items-center">
          <button data-testid="logs-level-chip-ALL" class="level-chip" :class="globalLogFilterLevel === '' ? 'chip-active-ALL' : ''" @click="globalLogFilterLevel = ''">ALL</button>
          <button data-testid="logs-level-chip-ERROR" class="level-chip" :class="globalLogFilterLevel === 'ERROR' ? 'chip-active-ERROR' : ''" @click="globalLogFilterLevel = globalLogFilterLevel === 'ERROR' ? '' : 'ERROR'">ERROR</button>
          <button data-testid="logs-level-chip-WARN" class="level-chip" :class="globalLogFilterLevel === 'WARNING' ? 'chip-active-WARNING' : ''" @click="globalLogFilterLevel = globalLogFilterLevel === 'WARNING' ? '' : 'WARNING'">WARN</button>
          <button data-testid="logs-level-chip-INFO" class="level-chip" :class="globalLogFilterLevel === 'INFO' ? 'chip-active-INFO' : ''" @click="globalLogFilterLevel = globalLogFilterLevel === 'INFO' ? '' : 'INFO'">INFO</button>
          <button data-testid="logs-level-chip-DEBUG" class="level-chip" :class="globalLogFilterLevel === 'DEBUG' ? 'chip-active-DEBUG' : ''" @click="globalLogFilterLevel = globalLogFilterLevel === 'DEBUG' ? '' : 'DEBUG'">DEBUG</button>
          <span data-testid="logs-counter" class="text-muted text-xs ml-2" x-text="filteredGlobalLogEvents().length + ' / ' + globalLogEvents.length + ' events'"></span>
        </div>
      </div>
    </div>

    <template x-if="globalLogsLoading">
      <div class="card empty-state"><div class="empty-state-title">Loading logs…</div></div>
    </template>

    <template x-if="!globalLogsLoading && globalLogEvents.length === 0">
      <div class="card empty-state"><div class="empty-state-title">No log events yet.</div></div>
    </template>

    <template x-if="!globalLogsLoading && globalLogEvents.length > 0">
      <div class="card p-0 overflow-hidden">
        <div class="log-list global-log-list" tabindex="0" aria-label="Global application log events">
          <template x-if="filteredGlobalLogEvents().length === 0">
            <div class="empty-state"><div class="empty-state-title">No events match the current filter.</div></div>
          </template>
          <template x-for="line in filteredGlobalLogEvents()" :key="line.number">
            <div class="log-entry" :class="logLevelClass(line.level)">
              <div class="log-entry-meta">
                <span class="font-mono" x-text="'#' + line.number"></span>
                <span class="badge" x-text="line.level"></span>
              </div>
              <pre x-html="highlightMatch(line.text, globalLogFilterQuery)"></pre>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>
</div></template>


</main><!-- end .main-content -->


<!-- ====================================================================
     AUTH SETUP MODAL
     ==================================================================== -->
<div x-show="showAuthModal" x-cloak class="modal-backdrop auth-modal-backdrop" data-testid="auth-modal" @click.self="closeAuthModal()">
  <div x-ref="authDialog" class="modal-box auth-modal-box" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
    <div class="auth-modal-header">
      <h2 id="authModalTitle" class="auth-modal-title">🔑 API Access Setup</h2>
      <button class="drawer-close" @click="closeAuthModal()" aria-label="Close API access setup">×</button>
    </div>

    <div class="auth-path" x-show="!authInitialized && !authCreatedToken">
      <div class="auth-path-label">Create Initial Administrator</div>
      <p class="text-muted text-xs mb-2">No users exist yet. This one-time setup creates the first administrator.</p>
      <div class="auth-row">
        <input x-model="authTokenName" class="field-input" data-testid="auth-bootstrap-name-input" placeholder="Administrator name" @keydown.enter="createToken('auth')" aria-label="administrator name" />
        <button @click="createToken('auth')" class="btn-primary auth-row-button" data-testid="auth-bootstrap-submit-btn">Create Admin →</button>
      </div>
    </div>

    <template x-if="authCreatedToken">
      <div class="bg-amber-50 border border-amber-300 rounded-lg p-4 space-y-2 text-sm">
        <div class="font-semibold text-amber-800">Administrator token created — copy it now:</div>
        <div class="text-xs text-amber-700">This is the only time this token will be shown. Store it securely.</div>
        <div class="font-mono text-xs break-all bg-white border border-amber-200 rounded px-2 py-1 text-amber-900 select-all cursor-text" data-testid="auth-created-token-value" x-text="authCreatedToken"></div>
        <button
          @click="navigator.clipboard.writeText(authCreatedToken).catch(()=>{})"
          class="btn-primary btn-sm text-xs">
          Copy to Clipboard
        </button>
        <button @click="closeAuthModal()" class="btn-secondary btn-sm text-xs ml-2" data-testid="auth-done-btn">Done — I've saved my token</button>
      </div>
    </template>

    <div class="auth-or" x-show="!authInitialized && !authCreatedToken">
      <span></span>
      <strong>or</strong>
      <span></span>
    </div>

    <div class="auth-path" x-show="!authCreatedToken">
      <div class="auth-path-label" x-text="authInitialized ? 'Sign in with Your Access Token' : 'Paste Existing Token'"></div>
      <p x-show="authInitialized" class="text-muted text-xs mb-2">Ask an administrator to create standard-user or administrator access for you.</p>
      <div class="auth-row">
        <input x-model="authPasteValue" type="password" class="field-input" data-testid="auth-paste-input" placeholder="Token" @keydown.enter="activateToken()" aria-label="token" />
        <button @click="activateToken()" class="btn-secondary auth-row-button" data-testid="auth-activate-btn">Activate</button>
      </div>
    </div>

    <template x-if="authError">
      <div class="auth-error" data-testid="auth-error-text" x-text="authError"></div>
    </template>
  </div>
</div>


<!-- ====================================================================
     SLIDE-OVER DRAWER – Mismatch details
     ==================================================================== -->
<template x-if="drawer.show">
  <div>
    <div class="drawer-backdrop" @click="drawer.show = false"></div>
    <div x-ref="drawerDialog" class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerDialogTitle">
      <div class="drawer-header">
        <div id="drawerDialogTitle" class="drawer-title" x-text="'Mismatches · ' + (drawer.result ? drawer.result.query_name : '')"></div>
        <button class="drawer-close" @click="drawer.show = false" aria-label="Close mismatch details">✕</button>
      </div>
      <div class="drawer-body">
        <div x-show="drawer.result" class="flex items-center gap-2 flex-wrap text-xs text-slate-500 mb-3">
          <span x-text="detailRowsLabel(drawer.rows, drawer.result)"></span>
          <span x-show="totalMismatches(drawer.result) > 0"
                class="font-medium text-slate-600"
                x-text="mismatchBreakdownText(drawer.result)"></span>
        </div>
        <template x-if="drawer.loading">
          <div class="text-muted text-sm py-8 text-center">Loading mismatches…</div>
        </template>
        <template x-if="!drawer.loading && drawer.rows.length === 0">
          <div class="empty-state"><div class="empty-state-title">No mismatch details found</div></div>
        </template>

        <template x-if="drawer.result && drawer.result.column_stats && drawer.result.column_stats.length">
          <div class="mb-3 border border-slate-100 rounded overflow-hidden">
            <div class="flex items-center justify-between gap-2 px-3 py-2 bg-slate-50">
              <div class="text-xs text-muted font-semibold">All columns</div>
              <input x-model="columnStatFilters[columnStatKey('drawer', drawer.result)]"
                     class="field-input text-xs py-1 max-w-48"
                     placeholder="Filter columns" aria-label="filter columns" />
            </div>
            <div class="overflow-auto max-h-48">
              <table class="mismatch-diff-table" aria-label="index template table 1">
                <thead>
                  <tr>
                    <th @click="setColumnStatSort('drawer', drawer.result, 'column')" class="cursor-pointer" scope="col" tabindex="0" role="button" @keydown.enter="$el.click()" @keydown.space.prevent="$el.click()">Column</th>
                    <th @click="setColumnStatSort('drawer', drawer.result, 'mismatch_count')" class="cursor-pointer" scope="col" tabindex="0" role="button" @keydown.enter="$el.click()" @keydown.space.prevent="$el.click()">Mismatches</th>
                    <th @click="setColumnStatSort('drawer', drawer.result, 'compared_rows')" class="cursor-pointer" scope="col" tabindex="0" role="button" @keydown.enter="$el.click()" @keydown.space.prevent="$el.click()">Compared</th>
                    <th @click="setColumnStatSort('drawer', drawer.result, 'match_pct')" class="cursor-pointer" scope="col" tabindex="0" role="button" @keydown.enter="$el.click()" @keydown.space.prevent="$el.click()">Match %</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="stat in columnStatsFor(drawer.result, 'drawer')" :key="stat.column">
                    <tr>
                      <td class="font-mono text-xs" x-text="stat.column"></td>
                      <td class="font-semibold text-rose-600" x-text="stat.mismatch_count"></td>
                      <td x-text="stat.compared_rows"></td>
                      <td x-text="matchPctText(stat.match_pct)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>

        <template x-if="!drawer.loading && drawer.rows.length > 0">
          <div class="flex items-center gap-2 mb-3 flex-wrap">
            <div class="flex gap-1 text-xs">
              <template x-for="f in ['ALL','PENDING','ACCEPTED','REJECTED']" :key="f">
                <button @click="mismatchStatusFilter = f"
                        class="sub-tab text-xs"
                        :class="mismatchStatusFilter === f ? 'active' : ''"
                        x-text="f">
                </button>
              </template>
            </div>
            <div class="ml-auto flex gap-2">
              <button @click="decideAllPendingDrawerMismatches('accept')"
                      class="btn-accept-confirm text-xs px-3 py-1.5">
                Accept All Pending
              </button>
              <button @click="decideAllPendingDrawerMismatches('reject')"
                      class="btn-outline btn-sm text-xs">
                Reject All Pending
              </button>
            </div>
          </div>
        </template>

        <div class="space-y-2">
          <template x-for="m in filteredMismatches" :key="m.id">
            <div class="border border-slate-100 rounded-lg p-3 text-sm" :class="m.accepted ? 'diff-accepted' : ''">
              <div class="flex items-center justify-between mb-1">
                <span class="font-mono font-semibold text-slate-700" x-text="m.column_name || '(row)'"></span>
                <span class="badge badge-rose" x-text="m.mismatch_type || 'value'"></span>
              </div>
              <div class="grid-2 gap-2 text-xs">
                <div class="bg-rose-50 rounded p-2">
                  <div class="text-muted mb-0.5">Source</div>
                  <div class="font-mono" x-text="m.source_value ?? '—'"></div>
                </div>
                <div class="bg-sky-50 rounded p-2">
                  <div class="text-muted mb-0.5">Target</div>
                  <div class="font-mono" x-text="m.target_value ?? '—'"></div>
                </div>
              </div>
              <template x-if="m.key_values">
                <div class="mt-1 text-xs text-muted font-mono" x-text="JSON.stringify(m.key_values)"></div>
              </template>
              <template x-if="m.delta != null">
                <div class="mt-1 text-xs font-mono" :class="m.delta > 0 ? 'text-amber-600' : 'text-red-600'"
                     x-text="'delta: ' + (m.delta > 0 ? '+' : '') + m.delta.toFixed(4) + (m.relative_delta != null ? '  (' + (m.relative_delta * 100).toFixed(2) + '%)' : '')"></div>
              </template>
              <div class="mt-2">
                <template x-if="m.accepted">
                  <span class="accepted-badge">Accepted</span>
                </template>
                <template x-if="!m.accepted">
                  <div>
                    <button @click="toggleAcceptForm(m.id)" class="btn-accept-sm">Accept</button>
                    <template x-if="acceptForms[m.id]?.open">
                      <div class="accept-form-inline">
                        <input x-model="acceptForms[m.id].note" class="accept-note-input" placeholder="Reason" aria-label="reason" />
                        <button @click="submitAccept(drawer.runId, drawer.result.id, m.id)" class="btn-accept-confirm">Save</button>
                        <button @click="toggleAcceptForm(m.id)" class="btn-cancel-sm">Cancel</button>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
        <template x-if="drawer.rows.length >= 100">
          <div class="text-center mt-4 space-y-1">
            <button @click="loadMoreMismatches()" class="btn-secondary btn-sm">Load more</button>
            <div class="text-xs text-slate-400" x-text="detailRowsLabel(drawer.rows, drawer.result)"></div>
          </div>
        </template>
      </div>
    </div>
  </div>
</template>


<!-- ====================================================================
     TOAST STACK
     ==================================================================== -->
<div class="toast-stack" role="status" aria-live="polite">
  <template x-for="(t, i) in toasts" :key="t.id">
    <div class="toast" :role="t.type === 'error' ? 'alert' : null" :class="['toast-'+t.type, t.fading ? 'fade-out' : '']">
      <span class="toast-icon" x-text="t.type === 'success' ? '✓' : t.type === 'error' ? '✗' : '⚠'"></span>
      <div class="toast-body">
        <div class="toast-title" x-text="t.title"></div>
        <div class="toast-msg" x-show="t.msg" x-text="t.msg"></div>
      </div>
    </div>
  </template>
</div>


<!-- ====================================================================
     TAB 8 - CONTRACTS
     ==================================================================== -->

                </thead>
                <tbody>

            <div>

  <div x-show="contractsLoading" class="text-slate-400 text-sm py-4">Loading contracts…</div>

  <div x-show="!contractsLoading" class="flex gap-4 mt-4">

          <span :class="{
            'text-emerald-700 bg-emerald-50': (contractStatusMap[c.name] || {}).status === 'OK',
            'text-rose-700 bg-rose-50': (contractStatusMap[c.name] || {}).status === 'BREACHED',
            'text-orange-700 bg-orange-50': (contractStatusMap[c.name] || {}).status === 'OVERDUE',

        </div>
      </template>
    </div>

    <!-- Contract detail -->
    <div class="flex-1" x-show="selectedContract">
      <template x-if="selectedContract">
        <div class="space-y-4">

          <div class="card">
            <div class="flex items-start justify-between">
              <div>
                <div class="text-base font-semibold text-slate-900" x-text="selectedContract.name"></div>

                  &nbsp;&middot;&nbsp; Owner: <span class="font-medium text-slate-700" x-text="selectedContract.owner"></span>
                  &nbsp;&middot;&nbsp; SLA: <span class="font-medium text-slate-700" x-text="selectedContract.sla_hours + 'h'"></span>
                  &nbsp;&middot;&nbsp; v<span x-text="selectedContract.version"></span>
                </div>
                <div class="text-xs text-slate-400 mt-0.5">

          <div class="card">
            <div class="text-xs font-semibold text-slate-500 uppercase mb-2">Breach History</div>

            <div x-show="!contractBreachLoading && contractBreachHistory.length === 0" class="text-slate-400 text-sm">No breaches recorded.</div>
            <template x-for="b in contractBreachHistory" :key="b.id">
              <div class="flex items-center gap-3 py-1.5 border-b border-slate-100 text-xs">
                <span :class="b.resolved_at ? 'text-slate-400' : 'text-rose-600'" class="font-medium w-20 flex-shrink-0" x-text="b.resolved_at ? 'Resolved' : 'Open'"></span>

                <span class="text-slate-400 flex-1" x-text="b.opened_at ? fmtDate(b.opened_at) : ''"></span>
                <span x-show="b.duration_hours != null" class="text-slate-500" x-text="b.duration_hours != null ? b.duration_hours.toFixed(2) + 'h' : ''"></span>

              </div>
            </template>
          </div>

          <!-- Version bump -->

            <div x-show="contractVersionHistory.length > 0" class="mt-3">

              <template x-for="v in contractVersionHistory" :key="v.id">

                  <span class="font-medium text-slate-700 w-10" x-text="v.version"></span>
                  <span class="text-slate-400" x-text="v.bump_type"></span>
                  <span class="text-slate-500 flex-1" x-text="v.note || ''"></span>

          <!-- Contract Testing & Verification -->
          <div class="card">
            <div class="flex items-center justify-between mb-3">

                </div>
              </div>
              <button
                data-testid="contract-run-test-btn"
                @click="runContractTest(selectedContract.name)"

                class="btn-primary btn-sm text-xs"

                <span x-show="!contractTestingLoading">Run Contract Test</span>
                <span x-show="contractTestingLoading">Testing…</span>
              </button>
            </div>

            <div x-show="!contractTestResult &amp;&amp; !contractTestingLoading" class="text-slate-400 text-sm py-4 text-center">
              Click "Run Contract Test" to validate schema, quality, SLA, and consumer compatibility.
            </div>

            <div x-show="contractTestingLoading" class="text-slate-400 text-sm py-4 text-center">
              Running contract tests…
            </div>

            <div x-show="contractTestResult &amp;&amp; !contractTestingLoading" class="space-y-3">
              <div class="flex flex-wrap gap-2">
                <span
                  data-testid="contract-test-status-badge"
                  :class="{
                    'bg-emerald-50 text-emerald-700': contractTestResult &amp;&amp; contractTestResult.overall_status === 'PASSED',
                    'bg-rose-50 text-rose-700': contractTestResult &amp;&amp; contractTestResult.overall_status === 'FAILED',
                    'bg-amber-50 text-amber-700': contractTestResult &amp;&amp; contractTestResult.overall_status === 'WARNING'
                  }"
                  class="text-xs font-semibold px-2 py-1 rounded"
                  x-text="contractTestResult ? contractTestResult.overall_status : ''"
                ></span>
                <span class="text-xs font-medium px-2 py-1 rounded bg-slate-100 text-slate-700">
                  Pass Rate: <span x-text="contractTestResult &amp;&amp; contractTestResult.summary ? contractTestResult.summary.pass_rate + '%' : ''"></span>
                </span>
                <span class="text-xs font-medium px-2 py-1 rounded bg-slate-100 text-slate-700">
                  <span x-text="contractTestResult &amp;&amp; contractTestResult.summary ? contractTestResult.summary.total : ''"></span> Total
                </span>
                <span class="text-xs font-medium px-2 py-1 rounded bg-emerald-100 text-emerald-700">
                  <span x-text="contractTestResult &amp;&amp; contractTestResult.summary ? contractTestResult.summary.passed : ''"></span> Passed
                </span>
                <span class="text-xs font-medium px-2 py-1 rounded bg-rose-100 text-rose-700">
                  <span x-text="contractTestResult &amp;&amp; contractTestResult.summary ? contractTestResult.summary.failed : ''"></span> Failed
                </span>
                <span class="text-xs font-medium px-2 py-1 rounded bg-amber-100 text-amber-700">
                  <span x-text="contractTestResult &amp;&amp; contractTestResult.summary ? contractTestResult.summary.warnings : ''"></span> Warnings
                </span>
                <span class="text-xs text-slate-500 self-center">
                  <span x-text="contractTestResult ? contractTestResult.duration_ms : ''"></span>ms

              <div class="flex flex-wrap gap-1">

                  data-testid="contract-test-filter-all"
                  @click="contractTestCategoryFilter = 'all'"
                  :class="contractTestCategoryFilter === 'all' ? 'bg-indigo-50 text-indigo-700 border-indigo-300' : 'bg-slate-50 text-slate-600 border-slate-200'"
                  class="text-xs font-medium px-2 py-1 rounded border"
                >
                  All (<span x-text="contractTestResult &amp;&amp; contractTestResult.checks ? contractTestResult.checks.length : 0"></span>)
                </button>
                <button
                  data-testid="contract-test-filter-schema"
                  @click="contractTestCategoryFilter = 'schema'"
                  :class="contractTestCategoryFilter === 'schema' ? 'bg-indigo-50 text-indigo-700 border-indigo-300' : 'bg-slate-50 text-slate-600 border-slate-200'"
                  class="text-xs font-medium px-2 py-1 rounded border"
                >
                  Schema (<span x-text="contractTestResult &amp;&amp; contractTestResult.checks ? contractTestResult.checks.filter(c =&gt; c.category === 'schema').length : 0"></span>)
                </button>
                <button
                  data-testid="contract-test-filter-quality"
                  @click="contractTestCategoryFilter = 'quality'"
                  :class="contractTestCategoryFilter === 'quality' ? 'bg-indigo-50 text-indigo-700 border-indigo-300' : 'bg-slate-50 text-slate-600 border-slate-200'"
                  class="text-xs font-medium px-2 py-1 rounded border"
                >
                  Data Quality (<span x-text="contractTestResult &amp;&amp; contractTestResult.checks ? contractTestResult.checks.filter(c =&gt; c.category === 'quality').length : 0"></span>)
                </button>
                <button
                  data-testid="contract-test-filter-sla"
                  @click="contractTestCategoryFilter = 'sla'"
                  :class="contractTestCategoryFilter === 'sla' ? 'bg-indigo-50 text-indigo-700 border-indigo-300' : 'bg-slate-50 text-slate-600 border-slate-200'"
                  class="text-xs font-medium px-2 py-1 rounded border"
                >
                  SLA &amp; Freshness (<span x-text="contractTestResult &amp;&amp; contractTestResult.checks ? contractTestResult.checks.filter(c =&gt; c.category === 'sla').length : 0"></span>)
                </button>
                <button
                  data-testid="contract-test-filter-consumers"
                  @click="contractTestCategoryFilter = 'consumers'"
                  :class="contractTestCategoryFilter === 'consumers' ? 'bg-indigo-50 text-indigo-700 border-indigo-300' : 'bg-slate-50 text-slate-600 border-slate-200'"
                  class="text-xs font-medium px-2 py-1 rounded border"
                >
                  Consumers (<span x-text="contractTestResult &amp;&amp; contractTestResult.checks ? contractTestResult.checks.filter(c =&gt; c.category === 'consumers').length : 0"></span>)
                </button>
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-xs" aria-label="contract test checks table">
                  <thead>
                    <tr class="text-slate-400 text-left border-b border-slate-200">
                      <th class="py-2 pr-2 font-medium" scope="col">Status</th>
                      <th class="py-2 pr-2 font-medium" scope="col">Category</th>
                      <th class="py-2 pr-2 font-medium" scope="col">Check</th>
                      <th class="py-2 pr-2 font-medium" scope="col">Target</th>
                      <th class="py-2 pr-2 font-medium" scope="col">Expected</th>
                      <th class="py-2 pr-2 font-medium" scope="col">Actual</th>
                      <th class="py-2 font-medium" scope="col">Details</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="check in filteredContractChecks()" :key="check.id">
                      <tr class="border-b border-slate-100">
                        <td class="py-2 pr-2">
                          <span
                            :class="{
                              'bg-emerald-100 text-emerald-700': check.status === 'PASS',
                              'bg-rose-100 text-rose-700': check.status === 'FAIL',
                              'bg-amber-100 text-amber-700': check.status === 'WARN'
                            }"
                            class="text-xs font-semibold px-1.5 py-0.5 rounded"
                            x-text="check.status"
                          ></span>
                        </td>
                        <td class="py-2 pr-2 text-slate-600 capitalize" x-text="check.category"></td>
                        <td class="py-2 pr-2 text-slate-700 font-medium" x-text="check.name"></td>
                        <td class="py-2 pr-2 text-slate-600 font-mono" x-text="check.target"></td>
                        <td class="py-2 pr-2 text-slate-600" x-text="check.expected"></td>
                        <td class="py-2 pr-2 text-slate-600" x-text="check.actual"></td>
                        <td class="py-2 text-slate-500" x-text="check.message"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>

              <div class="flex justify-end">
                <button
                  data-testid="contract-export-report-btn"
                  @click="exportContractTestReport()"
                  class="btn-outline btn-sm text-xs"
                >
                  Export ODCS Report (JSON)
                </button>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>

    <div class="flex-1 flex items-center justify-center text-slate-400 text-sm" x-show="!selectedContract">
      Select a contract to view details
    </div>
  </div>
</div></template>

<!-- Contract create/edit modal -->

          <select data-testid="contract-modal-severity-select" x-model="contractModal.breach_severity" class="field-input field-select" id="a11y-index-template-breach-severity">
            <option value="error">Error</option>
            <option value="warn">Warn</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-5">
        <button data-testid="contract-modal-cancel-btn" @click="showContractModal = false" class="btn-outline btn-sm">Cancel</button>
        <button data-testid="contract-modal-save-btn" @click="saveContract()" class="btn-primary btn-sm" x-text="contractModalEditing ? 'Save Changes' : 'Create'"></button>
      </div>
    </div>
  </div>
</template>


<template x-if="showingHelp">
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50"
       @click.self="showingHelp = false">
    <div x-ref="helpDialog" class="bg-white rounded-xl shadow-2xl p-6 max-w-md w-full mx-4" role="dialog" aria-modal="true" aria-labelledby="helpDialogTitle">
      <div class="flex justify-between items-start mb-3">
        <h3 id="helpDialogTitle" class="text-base font-semibold text-slate-900" x-text="helpTitle"></h3>
        <button @click="showingHelp = false" class="text-slate-400 hover:text-slate-600 ml-4" aria-label="Close help">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <p class="text-sm text-slate-600" x-text="helpContent"></p>
    </div>
  </div>
</template>

<!-- ====================================================================
     HELP CENTER
     ==================================================================== -->
<template x-if="currentView === 'help'"><div>
  <div class="section-header">
    <div>
      <div class="section-title">Help Center</div>
      <div class="section-sub">End-user guide — detailed steps for every area of the app</div>
    </div>
  </div>

  <div class="help-layout">
    <aside class="help-sidebar">
      <div class="help-search-wrap">
        <svg class="help-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input data-testid="help-search-input" class="help-search" type="text" placeholder="Search help…" x-model="helpSearch" aria-label="Search help" />
      </div>
      <nav class="help-nav">
        <template x-for="s in helpFilteredSections()" :key="s.id">
          <button class="help-nav-item" :class="helpActiveId === s.id ? 'active' : ''" @click="scrollToHelp(s.id)" x-text="s.title"></button>
        </template>
        <template x-if="helpFilteredSections().length === 0">
          <div class="help-nav-empty">No matches</div>
        </template>
      </nav>
    </aside>

    <div class="help-content">
      <template x-for="(s, i) in helpFilteredSections()" :key="s.id">
        <section class="help-section" :id="'help-' + s.id">
          <div class="help-section-head">
            <span class="help-badge" x-text="String(i + 1).padStart(2, '0')"></span>
            <div>
              <template x-if="s.category">
                <span class="help-badge-cat" x-text="s.category"></span>
              </template>
              <h2 class="help-section-title" x-text="s.title"></h2>
              <p class="help-section-intro" x-text="s.intro"></p>
            </div>
          </div>
          <div class="help-steps">
            <template x-for="(step, si) in s.steps" :key="step.title">
              <div class="help-step" x-show="helpStepMatches(step, helpSearch.trim())">
                <span class="help-step-num" x-text="String(si + 1).padStart(2, '0')"></span>
                <div class="help-step-body">
                  <h3 class="help-step-title" x-text="step.title"></h3>
                  <p class="help-step-text" x-text="step.text"></p>
                  <template x-if="step.where">
                    <div class="help-where"><span class="help-where-label">Where</span><span x-text="step.where"></span></div>
                  </template>
                  <template x-if="step.when">
                    <div class="help-where"><span class="help-where-label">When to use</span><span x-text="step.when"></span></div>
                  </template>
                  <template x-if="step.tip">
                    <div class="help-callout tip"><span class="help-callout-label">Tip</span><span x-text="step.tip"></span></div>
                  </template>
                  <template x-if="step.warn">
                    <div class="help-callout warn"><span class="help-callout-label">Caution</span><span x-text="step.warn"></span></div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </section>
      </template>

      <template x-if="helpFilteredSections().length === 0">
        <div class="help-empty">No help topics match "<span x-text="helpSearch"></span>".</div>
      </template>
    </div>
  </div>
</div></template>

    <template x-if="bulkDecisionForm.open">
      <div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40" @click.self="closeBulkDecisionForm()">
        <div x-ref="bulkDecisionDialog" class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md mx-4" role="dialog" aria-modal="true" aria-labelledby="bulkDecisionDialogTitle">
          <div class="flex items-center justify-between mb-4">
            <h2 id="bulkDecisionDialogTitle" class="text-base font-semibold text-slate-900"
                 x-text="bulkDecisionForm.mode === 'bulk-accept' ? 'Accept all mismatches' : 'Bulk pass with actions'"></h2>
            <button @click="closeBulkDecisionForm()" class="text-slate-400 hover:text-slate-600 text-lg leading-none" aria-label="Close bulk decision">&times;</button>
          </div>
          <div class="space-y-3">
            <template x-if="bulkDecisionForm.mode === 'bulk-accept'">
              <div>
                <label  class="field-label" for="a11y-index-template-accept-reason-applied-to-all-selected-mismatches">Accept reason (applied to all selected mismatches)</label>
                <textarea x-model="bulkDecisionForm.note" maxlength="1000" rows="3"
                          class="field-input" placeholder="e.g. rounding diff within tolerance" id="a11y-index-template-accept-reason-applied-to-all-selected-mismatches"></textarea>
              </div>
            </template>
            <template x-if="bulkDecisionForm.mode === 'bulk-override'">
              <div>
                <label  class="field-label" for="a11y-index-template-agreed-actions-applied-to-all-selected-tests">Agreed actions (applied to all selected tests)</label>
                <textarea x-model="bulkDecisionForm.note" maxlength="4000" rows="4"
                          class="field-input" placeholder="Describe the agreed actions required to accept these failed outcomes" id="a11y-index-template-agreed-actions-applied-to-all-selected-tests"></textarea>
              </div>
            </template>
            <div class="flex gap-2 justify-end pt-2">
              <button @click="closeBulkDecisionForm()" class="btn-secondary">Cancel</button>
              <button @click="submitBulkDecision(selectedRun.run_id)" :disabled="bulkDecisionForm.saving"
                      class="btn-primary">
                <span x-show="!bulkDecisionForm.saving">Confirm</span>
                <span x-show="bulkDecisionForm.saving">Saving...</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <template x-if="mismatchDecisionForm.open">
      <div data-testid="decision-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40" @click.self="closeMismatchDecisionForm()">
        <div x-ref="mismatchDecisionDialog" class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md mx-4" role="dialog" aria-modal="true" aria-labelledby="mismatchDecisionDialogTitle">
          <div class="flex items-center justify-between mb-4">
            <h2 id="mismatchDecisionDialogTitle" class="text-base font-semibold text-slate-900"
                 x-text="(mismatchDecisionForm.decision === 'accept' ? 'Accept' : 'Reject') + ' matching mismatches'"></h2>
            <button @click="closeMismatchDecisionForm()" class="text-slate-400 hover:text-slate-600 text-lg leading-none" aria-label="Close mismatch decision">&times;</button>
          </div>
          <div class="space-y-3">
            <div>
              <label  class="field-label" x-text="'Reason (applied to every matching mismatch)'" for="a11y-index-template-field"></label>
              <textarea data-testid="decision-modal-note-textarea" x-model="mismatchDecisionForm.note" maxlength="1000" rows="3"
                        class="field-input" placeholder="e.g. rounding diff within tolerance" id="a11y-index-template-field"></textarea>
            </div>
            <div class="flex gap-2 justify-end pt-2">
              <button data-testid="decision-modal-cancel-btn" @click="closeMismatchDecisionForm()" class="btn-secondary">Cancel</button>
              <button data-testid="decision-modal-confirm-btn" @click="submitMismatchDecision()" :disabled="mismatchDecisionForm.saving"
                      class="btn-primary">
                <span x-show="!mismatchDecisionForm.saving">Confirm</span>
                <span x-show="mismatchDecisionForm.saving">Saving...</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </template>
</div><!-- end .app-content -->
